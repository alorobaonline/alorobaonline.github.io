<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة ترحيل الصور - العروبة أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #f3f4f6; color: #1f2937; padding: 16px; }
    .container { max-width: 560px; margin: 0 auto; background: white; border-radius: 16px; padding: 20px; border: 1px solid #e5e7eb; }
    h1 { font-size: 1.1rem; color: #1b4d2e; margin-bottom: 6px; }
    p.desc { font-size: 0.8rem; color: #6b7280; margin-bottom: 16px; line-height: 1.6; }
    button { width: 100%; background: #1b4d2e; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button.secondary { background: #e5e7eb; color: #374151; }
    .status-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; font-size: 0.8rem; margin-top: 14px; white-space: pre-line; max-height: 340px; overflow-y: auto; line-height: 1.8; }
    .stat-badge { display: inline-block; background: #1b4d2e; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-inline-end: 6px; }
    .stat-badge.warn { background: #ea580c; }
    .stat-badge.ok { background: #16a34a; }
    .progress-wrap { background: #e5e7eb; border-radius: 20px; height: 10px; overflow: hidden; margin-top: 10px; display: none; }
    .progress-bar { background: #16a34a; height: 100%; width: 0%; transition: width 0.3s; }
    .row-ok { color: #16a34a; }
    .row-err { color: #dc2626; }
</style>
</head>
<body>
<div class="container">
    <h1>🔄 أداة ترحيل صور المنتجات</h1>
    <p class="desc">
        الأداة دي بتفحص كل المنتجات في المتجر، وتلاقي اللي لسه صورتها مخزّنة كـ base64 (نص طويل) بدل رابط، وترفعها تلقائيًا لـ Cloudinary وتستبدل الرابط في قاعدة البيانات. استخدمها مرة واحدة بس.
    </p>

    <button id="scanBtn" onclick="scanProducts()">1️⃣ فحص المنتجات وعدّ اللي محتاج ترحيل</button>
    <button id="migrateBtn" onclick="migrateAll()" disabled>2️⃣ ترحيل كل الصور دفعة واحدة 🚀</button>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-box" id="statusBox">اضغط "فحص المنتجات" عشان نبدأ.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
        authDomain: "alorobaonline.firebaseapp.com",
        projectId: "alorobaonline",
        storageBucket: "alorobaonline.firebasestorage.app",
        messagingSenderId: "880642361344",
        appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
        measurementId: "G-NL9CS2135V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;
    window.updateDoc = updateDoc;
    window.doc = doc;

    window.dispatchEvent(new Event('firebase-ready'));
</script>
<script>
    const CLOUDINARY_CLOUD_NAME = 'lqrit0u7';
    const CLOUDINARY_UPLOAD_PRESET = 'v7mkckzz';

    let productsNeedingMigration = [];
    let firebaseReady = false;

    window.addEventListener('firebase-ready', () => { firebaseReady = true; });

    function log(msg, cls) {
        const box = document.getElementById('statusBox');
        const line = document.createElement('div');
        if (cls) line.className = cls;
        line.innerText = msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    function clearLog() {
        document.getElementById('statusBox').innerHTML = '';
    }

    async function waitForFirebase() {
        if (firebaseReady) return;
        await new Promise(resolve => window.addEventListener('firebase-ready', resolve, { once: true }));
    }

    async function scanProducts() {
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true;
        scanBtn.innerText = 'جاري الفحص...';
        clearLog();
        log('⏳ جاري الاتصال بقاعدة البيانات...');

        await waitForFirebase();

        try {
            const snap = await window.getDocs(window.collection(window.db, "products"));
            const allProducts = [];
            snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));

            productsNeedingMigration = allProducts.filter(p => p.img && typeof p.img === 'string' && p.img.startsWith('data:'));

            clearLog();
            log(`📦 إجمالي المنتجات: ${allProducts.length}`);
            log(`⚠️ منتجات بصورة base64 (محتاجة ترحيل): ${productsNeedingMigration.length}`, 'row-err');
            log(`✅ منتجات صورتها رابط بالفعل (تمام): ${allProducts.length - productsNeedingMigration.length}`, 'row-ok');

            if (productsNeedingMigration.length > 0) {
                log('');
                log('اضغط "ترحيل كل الصور دفعة واحدة" عشان تبدأ.');
                document.getElementById('migrateBtn').disabled = false;
                document.getElementById('migrateBtn').innerText = `2️⃣ ترحيل ${productsNeedingMigration.length} صورة الآن 🚀`;
            } else {
                log('🎉 كل المنتجات تمام، مفيش حاجة تتترحّل!');
            }
        } catch (e) {
            console.error(e);
            log('❌ حصل خطأ أثناء الفحص: ' + e.message, 'row-err');
        } finally {
            scanBtn.disabled = false;
            scanBtn.innerText = '1️⃣ إعادة فحص المنتجات';
        }
    }

    async function uploadToCloudinary(dataUrl) {
        const formData = new FormData();
        formData.append('file', dataUrl);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
        formData.append('folder', 'products');

        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error('فشل رفع الصورة إلى Cloudinary');
        }

        const data = await response.json();
        return data.secure_url;
    }

    async function migrateAll() {
        if (productsNeedingMigration.length === 0) return;

        const migrateBtn = document.getElementById('migrateBtn');
        const scanBtn = document.getElementById('scanBtn');
        migrateBtn.disabled = true;
        scanBtn.disabled = true;

        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        progressWrap.style.display = 'block';

        clearLog();
        log(`🚀 بدء ترحيل ${productsNeedingMigration.length} صورة...`);
        log('');

        let successCount = 0;
        let failCount = 0;

        for (let i = 0; i < productsNeedingMigration.length; i++) {
            const product = productsNeedingMigration[i];
            const productLabel = product.name || product.id;

            try {
                migrateBtn.innerText = `جاري الترحيل... (${i + 1} من ${productsNeedingMigration.length})`;
                const newUrl = await uploadToCloudinary(product.img);
                await window.updateDoc(window.doc(window.db, "products", product.id), { img: newUrl });
                successCount++;
                log(`✅ ${productLabel}`, 'row-ok');
            } catch (e) {
                failCount++;
                log(`❌ ${productLabel} - فشل: ${e.message}`, 'row-err');
            }

            const percent = Math.round(((i + 1) / productsNeedingMigration.length) * 100);
            progressBar.style.width = percent + '%';
        }

        log('');
        log(`🎉 انتهى الترحيل! نجاح: ${successCount} | فشل: ${failCount}`);

        migrateBtn.innerText = '2️⃣ تم الترحيل ✅';
        scanBtn.disabled = false;

        if (failCount > 0) {
            migrateBtn.disabled = false;
            migrateBtn.innerText = `أعد المحاولة للمتبقي (${failCount}) 🔁`;
            productsNeedingMigration = productsNeedingMigration.filter((p, idx) => false); // سيُعاد فحصها من جديد
            log('نصيحة: اضغط "إعادة فحص المنتجات" عشان تشوف اللي لسه محتاج ترحيل وتحاول تاني.');
        }
    }

    window.scanProducts = scanProducts;
    window.migrateAll = migrateAll;
</script>
</body>
</html>
