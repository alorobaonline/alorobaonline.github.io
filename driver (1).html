<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; border: 1px solid #e5e7eb; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid #cbd5e1; }
        
        .order-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 0.75rem; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px; }
        
        .btn-call { background: #2563eb; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; }
        .btn-whatsapp { background: #25D366; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; margin-inline-start: 6px; }
        .btn-location { background: #059669; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; margin-inline-start: 6px; }
        .btn-complete { background: #16a34a; color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-complete.btn-pickup { background: #f59e0b; }
        .status-badge { font-size: 0.62rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-inline-start: 6px; }
        .status-badge.status-ready { background: #fef3c7; color: #92400e; }
        .status-badge.status-onway { background: #dbeafe; color: #1e40af; }
        .delay-notice { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; padding: 6px; border-radius: 6px; font-size: 0.65rem; margin-top: 6px; font-weight: bold; }

        .route-btn { background: linear-gradient(135deg, #1b4d2e 0%, #2563eb 100%); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .route-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .route-panel { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 0.72rem; }
        .route-panel-title { font-weight: 900; color: #1e40af; margin-bottom: 6px; font-size: 0.78rem; }
        .route-stop-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #bfdbfe; }
        .route-stop-row:last-child { border-bottom: none; }
        .route-stop-num { background: #1e40af; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 900; flex-shrink: 0; }
        .open-full-route-btn { background: #1e40af; color: white; text-decoration: none; border: none; padding: 9px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .seq-badge { background: #1e40af; color: white; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 900; margin-inline-end: 6px; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, where, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.getDoc = getDoc;
        window.query = query;
        window.where = where;
        window.increment = increment;
        window.setDoc = setDoc;

        // ===================== بوابة تسجيل الدخول (Firebase Authentication) =====================
        let appBooted = false;

        window.staffLogin = async function() {
            const email = document.getElementById('authGateEmail').value.trim();
            const password = document.getElementById('authGatePassword').value;
            const errEl = document.getElementById('authGateError');
            const btn = document.getElementById('authGateSubmitBtn');
            errEl.innerText = '';

            if (!email || !password) {
                errEl.innerText = 'الرجاء تعبئة البريد الإلكتروني وكلمة المرور';
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ جاري الدخول...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                console.error(e);
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    errEl.innerText = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else if (e.code === 'auth/too-many-requests') {
                    errEl.innerText = '❌ محاولات كتيرة، حاول بعد شوي';
                } else {
                    errEl.innerText = '❌ تعذر تسجيل الدخول: ' + (e.message || e);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = 'دخول';
            }
        };

        window.staffLogout = function() {
            signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            const gate = document.getElementById('authGateScreen');
            const errEl = document.getElementById('authGateError');
            if (user) {
                try {
                    const roleSnap = await getDoc(doc(db, "staffRoles", user.email));
                    const roles = (roleSnap.exists() && Array.isArray(roleSnap.data().roles)) ? roleSnap.data().roles : [];
                    const allowed = roles.includes('admin') || roles.includes('driver');
                    if (!allowed) {
                        if (errEl) errEl.innerText = '❌ ما عندك صلاحية توصل لهاي الصفحة - تواصل مع الإدارة';
                        await signOut(auth);
                        return;
                    }
                } catch (e) {
                    console.error(e);
                    if (errEl) errEl.innerText = '❌ تعذر التحقق من الصلاحية، حاول مرة أخرى';
                    await signOut(auth);
                    return;
                }
                if (gate) gate.style.display = 'none';
                if (!appBooted) {
                    appBooted = true;
                    window.dispatchEvent(new Event('firebase-ready'));
                }
            } else {
                appBooted = false;
                if (gate) gate.style.display = 'flex';
            }
        });
    </script>
</head>
<body>

<!-- بوابة تسجيل دخول الموظفين -->
<div id="authGateScreen" style="position: fixed; inset: 0; background: var(--light-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="max-width: 380px; width: 100%; background: white; border-radius: 20px; padding: 28px 22px; border: 1px solid #e5e7eb;">
        <div style="text-align: center; margin-bottom: 18px;">
            <div style="font-size: 2rem; margin-bottom: 6px;">🔒</div>
            <div style="font-size: 1rem; font-weight: 900; color: var(--primary-green);">تسجيل دخول الموظفين</div>
            <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 4px;">شاشة السائق - العروبة أونلاين</div>
        </div>
        <input type="email" id="authGateEmail" placeholder="البريد الإلكتروني" autocomplete="username" style="width:100%; padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:12px; font-size:0.85rem; font-weight:600; margin-bottom:10px; outline:none; box-sizing:border-box;" onkeydown="if(event.key==='Enter') document.getElementById('authGatePassword').focus();">
        <input type="password" id="authGatePassword" placeholder="كلمة المرور" autocomplete="current-password" style="width:100%; padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:12px; font-size:0.85rem; font-weight:600; margin-bottom:6px; outline:none; box-sizing:border-box;" onkeydown="if(event.key==='Enter') staffLogin();">
        <div id="authGateError" style="color:#dc2626; font-size:0.7rem; font-weight:800; min-height:16px; margin-bottom:8px;"></div>
        <button id="authGateSubmitBtn" onclick="staffLogin()" style="width:100%; background: var(--primary-green); color:white; border:none; padding:12px; border-radius:12px; font-weight:800; font-size:0.85rem; cursor:pointer;">دخول</button>
    </div>
</div>


<div class="container">
    <div class="header">
        <h1>🏍️ شاشة السائق - العروبة أونلاين</h1>
        <div style="display:flex; gap:6px;">
            <a href="admin.html" class="back-btn">← لوحة التحكم</a>
            <button onclick="staffLogout()" class="back-btn" style="background:#fee2e2; color:#991b1b; border-color:#fecaca; cursor:pointer;">🚪 خروج</button>
        </div>
    </div>

    <div style="font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; color: #4b5563;">
        الطلبات الجاهزة للتوصيل:
    </div>

    <button id="optimizeRouteBtn" class="route-btn" style="display:none;" onclick="optimizeDeliveryRoute()">🗺️ رتب أفضل مسار للتوصيل</button>
    <div id="routePanel" style="display:none;"></div>

    <div id="driverOrdersContainer">
        <p style="text-align: center; color: #888; font-size: 0.75rem;">جاري تحميل الطلبات...</p>
    </div>
</div>

<script>
    let currentOrdersList = [];

    window.addEventListener('firebase-ready', function() {
        initDriverOrdersListener();
    });

    function initDriverOrdersListener() {
        // نجيب فقط الطلبات الجاهزة للتوصيل/قيد التوصيل من قاعدة البيانات مباشرة
        // بدل ما نحمّل كل تاريخ الطلبات كل مرة (هذا كان يبطّئ الشاشة مع تراكم الطلبات)
        const activeQuery = window.query(
            window.collection(window.db, "orders"),
            window.where("status", "in", ["جاهز للتوصيل", "قيد التوصيل"])
        );
        window.onSnapshot(activeQuery, (snapshot) => {
            let orders = [];
            snapshot.forEach(docSnap => {
                orders.push({ id: docSnap.id, ...docSnap.data() });
            });
            currentOrdersList = orders;
            renderDriverOrders(orders);
        });
    }

    // يحوّل أي رقم هاتف محلي (05xxxxxxxx أو 5xxxxxxxx) لرابط واتساب مباشر
    function buildWhatsAppLink(phone) {
        let p = (phone || '').replace(/[^0-9]/g, '');
        if (p.startsWith('0')) p = p.substring(1);
        if (!p.startsWith('972')) p = '972' + p;
        return `https://wa.me/${p}`;
    }

    function renderDriverOrders(orders) {
        const container = document.getElementById('driverOrdersContainer');
        if(!container) return;
        
        let deliveryOrders = orders.filter(o => o.status === "جاهز للتوصيل" || o.status === "قيد التوصيل");

        if(deliveryOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات جاهزة للتوصيل حالياً 🛵</p>';
            document.getElementById('optimizeRouteBtn').style.display = 'none';
            document.getElementById('routePanel').style.display = 'none';
            currentRouteOrderIds = null;
            return;
        }

        // كم طلب "قيد التوصيل" (مستلم فعلياً) وعنده موقع صالح - هدول بس المرشحين لترتيب المسار
        const pickedUpWithGps = deliveryOrders.filter(o => o.status === "قيد التوصيل" && parseLatLngFromGpsUrl(o.customerGps));
        const optimizeBtn = document.getElementById('optimizeRouteBtn');
        if (pickedUpWithGps.length >= 2) {
            optimizeBtn.style.display = 'flex';
        } else {
            optimizeBtn.style.display = 'none';
            document.getElementById('routePanel').style.display = 'none';
            currentRouteOrderIds = null;
        }

        // لو عندنا مسار محسوب مسبقاً، رتب الطلبات "قيد التوصيل" حسبه (والباقي كيفما اتفق)
        if (currentRouteOrderIds && currentRouteOrderIds.length > 0) {
            const seqIndex = new Map(currentRouteOrderIds.map((id, i) => [id, i]));
            deliveryOrders = deliveryOrders.slice().sort((a, b) => {
                const ai = seqIndex.has(a.id) ? seqIndex.get(a.id) : 999;
                const bi = seqIndex.has(b.id) ? seqIndex.get(b.id) : 999;
                return ai - bi;
            });
        }

        container.innerHTML = '';
        deliveryOrders.forEach((ord, index) => {
            let delayHtml = '';
            if(ord.delayReason) {
                delayHtml = `<div class="delay-notice">⚠️ سبب التأخير المسجل: ${ord.delayReason}</div>`;
            }
            let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : `#${index + 1}`;

            let currentStatus = ord.status || 'جاهز للتوصيل';
            let isPickedUp = currentStatus === 'قيد التوصيل';

            let statusBadgeHtml = isPickedUp
                ? `<span class="status-badge status-onway">🛵 بالطريق</span>`
                : `<span class="status-badge status-ready">🔒 جاهزة بالمتجر</span>`;

            // شارة رقم الترتيب المقترح بالمسار (لو محسوب)
            let seqBadgeHtml = '';
            if (isPickedUp && currentRouteOrderIds) {
                const pos = currentRouteOrderIds.indexOf(ord.id);
                if (pos !== -1) seqBadgeHtml = `<span class="seq-badge">${pos + 1}</span>`;
            }

            if (!isPickedUp) {
                // بطاقة مقفولة: بس رقم الطلبية والاسم، لحد ما السائق يستلمها فعليًا
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>طلب ${orderLabel} - ${escapeHtml(ord.customerName) || 'زبون'} ${statusBadgeHtml}</span>
                            <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                        </div>
                        <div style="font-size: 0.68rem; color: #94a3b8; margin-bottom: 6px;">باقي التفاصيل (الهاتف، العنوان، الموقع) بتفتح بعد ما تستلم الطلبية</div>
                        <button class="btn-complete btn-pickup" onclick="markOrderPickedUp('${ord.id}')">📦 استلام الطلبية من المتجر</button>
                    </div>
                `;
            } else {
                // بطاقة مفتوحة بكل التفاصيل بعد الاستلام
                let hasLocation = ord.customerGps && ord.customerGps !== 'غير متوفر';
                let locationHtml = hasLocation
                    ? `<a href="${safeExternalUrl(ord.customerGps)}" target="_blank" rel="noopener" class="btn-location">📍 فتح الموقع والتوجه للطلبية</a>`
                    : `<div style="font-size: 0.68rem; color: #94a3b8; margin: 4px 0;">📍 الزبون ما حدد موقعه على الخريطة</div>`;

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>${seqBadgeHtml}طلب ${orderLabel} - ${escapeHtml(ord.customerName) || 'زبون'} ${statusBadgeHtml}</span>
                            <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                        </div>
                        <div style="font-size: 0.7rem; margin-bottom: 4px;"><b>الهاتف:</b> <a href="${buildWhatsAppLink(ord.customerPhone)}" target="_blank" rel="noopener" style="color: #059669; text-decoration: underline; font-weight: 800;">${escapeHtml(ord.customerPhone)}</a></div>
                        <div style="font-size: 0.7rem; margin-bottom: 6px;"><b>العنوان:</b> ${escapeHtml(ord.customerAddress || ord.address)}</div>
                        
                        <a href="tel:${(ord.customerPhone || '').replace(/[^0-9+]/g, '')}" class="btn-call">📞 اتصال بالزبون</a>
                        <a href="${buildWhatsAppLink(ord.customerPhone)}" target="_blank" rel="noopener" class="btn-whatsapp">💬 واتساب الزبون</a>
                        ${locationHtml}
                        
                        ${delayHtml}

                        <button class="btn-complete" onclick="markOrderDelivered('${ord.id}')">تأكيد تسليم الطلب (مكتمل) ✅</button>
                    </div>
                `;
            }
        });
    }

    // ===================== تنظيف بسيط لمنع XSS من بيانات الزبون =====================
    function escapeHtml(str) {
        if (str === undefined || str === null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ما نسمح إلا بروابط https حقيقية (يمنع حقن روابط javascript:/data: عبر حقل الموقع)
    function safeExternalUrl(url) {
        try {
            const u = new URL(url, window.location.href);
            if (u.protocol === 'https:') return u.href;
        } catch(e) {}
        return '#';
    }

    // ===================== ترتيب أفضل مسار توصيل =====================
    let currentRouteOrderIds = null;

    // يقرأ الإحداثيات lat,lng من رابط خرائط جوجل المخزّن (destination=lat,lng)
    function parseLatLngFromGpsUrl(url) {
        if (!url) return null;
        const match = String(url).match(/destination=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
        if (!match) return null;
        return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
    }

    // مسافة تقريبية بالكيلومتر بين نقطتين (خط مستقيم، كافي لترتيب الأولوية)
    function haversineKm(a, b) {
        const R = 6371;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLng = (b.lng - a.lng) * Math.PI / 180;
        const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
    }

    function getDriverCurrentLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve(null); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 8000 }
            );
        });
    }

    async function getStoreLocation() {
        try {
            const snap = await window.getDoc(window.doc(window.db, "settings", "attendanceAdmin"));
            if (snap.exists() && snap.data().workplaceLat) {
                return { lat: snap.data().workplaceLat, lng: snap.data().workplaceLng };
            }
        } catch(e) { console.error(e); }
        return null;
    }

    async function optimizeDeliveryRoute() {
        const btn = document.getElementById('optimizeRouteBtn');
        const panel = document.getElementById('routePanel');
        btn.disabled = true;
        btn.innerText = '⏳ جاري تحديد موقعك...';

        // نقطة الانطلاق: موقع السائق الحالي، وإلا موقع المتجر المسجل، وإلا أول طلبية
        let origin = await getDriverCurrentLocation();
        let originLabel = '📍 موقعك الحالي';
        if (!origin) {
            origin = await getStoreLocation();
            originLabel = '🏪 المتجر';
        }

        const pickedUp = currentOrdersList.filter(o => o.status === "قيد التوصيل");
        const stops = pickedUp
            .map(o => ({ id: o.id, orderNumber: o.orderNumber, customerName: o.customerName, coords: parseLatLngFromGpsUrl(o.customerGps) }))
            .filter(s => s.coords);

        if (stops.length < 2) {
            btn.disabled = false;
            btn.innerText = '🗺️ رتب أفضل مسار للتوصيل';
            return;
        }

        if (!origin) origin = stops[0].coords; // لو ما قدرنا نحدد نقطة انطلاق، نبلش من أقرب طلبية عشوائياً

        // خوارزمية "أقرب نقطة تالية" - بسيطة وسريعة، كافية لعدد قليل من الطلبات بنفس الجولة
        const remaining = stops.slice();
        const ordered = [];
        let current = origin;
        while (remaining.length > 0) {
            let bestIdx = 0;
            let bestDist = Infinity;
            remaining.forEach((s, i) => {
                const d = haversineKm(current, s.coords);
                if (d < bestDist) { bestDist = d; bestIdx = i; }
            });
            const next = remaining.splice(bestIdx, 1)[0];
            ordered.push(next);
            current = next.coords;
        }

        currentRouteOrderIds = ordered.map(s => s.id);

        // بناء رابط خرائط جوجل بمسار كامل بكل المحطات مرتبة
        const waypoints = ordered.slice(0, -1).map(s => `${s.coords.lat},${s.coords.lng}`).join('|');
        const last = ordered[ordered.length - 1].coords;
        let mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${last.lat},${last.lng}&travelmode=driving`;
        if (origin) mapsUrl += `&origin=${origin.lat},${origin.lng}`;
        if (waypoints) mapsUrl += `&waypoints=${encodeURIComponent(waypoints)}`;

        const stopsHtml = ordered.map((s, i) => `
            <div class="route-stop-row">
                <span class="route-stop-num">${i + 1}</span>
                <span>${escapeHtml(s.customerName) || 'زبون'} ${s.orderNumber ? '(#' + s.orderNumber + ')' : ''}</span>
            </div>
        `).join('');

        panel.innerHTML = `
            <div class="route-panel">
                <div class="route-panel-title">🗺️ المسار المقترح (من ${originLabel})</div>
                ${stopsHtml}
                <a href="${safeExternalUrl(mapsUrl)}" target="_blank" rel="noopener" class="open-full-route-btn">🧭 افتح المسار الكامل بجوجل مابس</a>
            </div>
        `;
        panel.style.display = 'block';

        btn.disabled = false;
        btn.innerText = '🔄 إعادة حساب المسار';

        renderDriverOrders(currentOrdersList);
    }

    async function markOrderPickedUp(orderId) {
        if(confirm("هل استلمت الطلبية من المتجر وبدأت التوصيل؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "قيد التوصيل"
                });
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }

    async function markOrderDelivered(orderId) {
        if(confirm("هل أنت متأكد من تسليم الطلب بنجاح وانتقاله للأرشيف؟")) {
            try {
                let ord = currentOrdersList.find(o => o.id === orderId);
                let orderTotal = ord ? (Number(ord.total) || 0) : 0;

                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "مكتمل"
                });

                // نحدّث إجمالي المبيعات المجمّع فورًا بدل ما تضطر لوحة التحكم تعيد جمع كل الطلبات من الصفر
                await window.setDoc(window.doc(window.db, "settings", "salesStats"), {
                    totalRevenue: window.increment(orderTotal),
                    completedCount: window.increment(1)
                }, { merge: true });
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }
</script>
