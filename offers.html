<style>
    :root { --primary-green: #6BA516; --price-red: #dc2626; --price-black: #111827; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #f3f4f6; color: #1f2937; padding-bottom: 90px; }
    .wrap { max-width: 480px; margin: 0 auto; background: #f3f4f6; min-height: 100vh; }

    .top-header {
        background: var(--primary-green); color: white; padding: 16px;
        display: flex; align-items: center; justify-content: space-between;
        border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 50;
    }
    .top-header .title { font-size: 17px; font-weight: 900; }
    .top-header .sub { font-size: 11px; opacity: 0.9; margin-top: 2px; }

    .banner-strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px; scrollbar-width: none; }
    .banner-strip::-webkit-scrollbar { display: none; }
    .banner-strip img { height: 150px; border-radius: 14px; flex-shrink: 0; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .banner-strip a { display: block; flex-shrink: 0; }

    /* بانر بشكل سلايدر: صورة وحدة كبيرة بكل مرة، ونقاط تنقل تحتها - نفس شكل المتجر بالظبط */
    .banner-carousel { padding: 14px; }
    .banner-carousel-viewport { position: relative; width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); aspect-ratio: 16/9; background: #eee; }
    .banner-carousel-track { display: flex; height: 100%; transition: transform 0.4s ease; }
    .banner-carousel-track a, .banner-carousel-track img { width: 100%; height: 100%; flex-shrink: 0; object-fit: cover; display: block; }
    .banner-carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .banner-carousel-dots span { width: 6px; height: 6px; border-radius: 50%; background: #d1d5db; transition: all 0.25s ease; }
    .banner-carousel-dots span.active { background: var(--primary-green); width: 18px; border-radius: 4px; }

    .section-title { font-weight: 900; font-size: 15px; color: #1f2937; padding: 18px 14px 8px; }

    .products-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 12px 14px; }
    .product-card {
        background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 8px;

    }
    .product-card.has-sale { border: 1.5px solid var(--price-red); }
    .product-img-box { width: 100%; height: 78px; display: flex; align-items: center; justify-content: center; background: #fafbfa; border-radius: 10px; margin-bottom: 6px; position: relative; }
    .product-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .discount-badge { position: absolute; top: 4px; right: 4px; background: var(--price-red); color: white; font-size: 8px; font-weight: 800; padding: 2px 5px; border-radius: 5px; }
    /* شارة تسويقية للحزمة - تُقرأ من marketingBadge المحفوظ بلوحة bundle */

        position: absolute; top: 5px; left: 5px; z-index: 3;

    .marketing-badge.strong { background: #dc2626; }

    .marketing-badge.featured { background: #d97706; }

    .product-name { font-size: 10.5px; font-weight: 700; color: #1e293b; margin-bottom: 3px; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .sale-price { color:#111827; font-size:11px; font-weight:900; }

    /* الشارة الحمراء الدائرية في زاوية البطاقة */
    .marketing-badge {
        position:absolute; top:7px; right:7px; left:auto; z-index:5;

    /* وفّري - نفس الشريط الأصفر أسفل معلومات المنتج */

    }
    .saving-badge:before,.saving-badge:after {

        clip-path:polygon(50% 0,100% 16%,55% 30%,100% 45%,55% 60%,100% 76%,50% 100%,0 82%,45% 65%,0 50%,45% 34%,0 18%);
    }
    .saving-badge:before { right:-4px; }
    .saving-badge:after { left:-4px; transform:scaleX(-1); }

<body>

<div class="zoom-overlay" id="zoomOverlay" onclick="if(event.target===this) closeImageZoom()">
    <div class="zoom-box">
        <button class="zoom-close-btn" onclick="closeImageZoom()">✕</button>
        <div class="zoom-img-wrap"><img id="zoomImg" src="" alt=""></div>
        <div class="zoom-info">
            <div class="zoom-name" id="zoomName"></div>
            <div id="zoomBadgeWrap"></div>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="top-header">
        <div>
            <div class="title">🎁 عروضنا وحملاتنا</div>
            <div class="sub">العروبة أونلاين</div>
        </div>
        <div style="display:flex; gap:6px;" id="headerActionButtons">
            <button id="pdfBtn" onclick="downloadOffersAsPdf()" style="background:rgba(255,255,255,0.18); border:none; color:white; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">📄</button>
            <button id="shareBtn" onclick="shareOffersPage()" style="background:rgba(255,255,255,0.18); border:none; color:white; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">📤</button>

    </div>

    <div id="productsSection"><div class="loading-msg">جاري تحميل العروض...</div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
        authDomain: "alorobaonline.firebaseapp.com",
        projectId: "alorobaonline",
        storageBucket: "alorobaonline.firebasestorage.app",
        messagingSenderId: "880642361344",
        appId: "1:880642361344:web:9dddec05f81125f0fc30e5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let products = [];
    let bundles = [];
    let categories = [];
    let bannerSlides = [];

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // نافذة تكبير الصورة - بتفتح بالضغط على الصورة بس (مش على باقي البطاقة)، وبتوري الصورة
    // والاسم والعرض بدون ما تودي الزبون عالمتجر
    window.openImageZoom = function(event, img, name, badgeText) {
        event.preventDefault();
        event.stopPropagation();
        document.getElementById('zoomImg').src = img || '';
        document.getElementById('zoomImg').alt = name || '';
        document.getElementById('zoomName').innerText = name || '';
        document.getElementById('zoomBadgeWrap').innerHTML = badgeText ? `<span class="bundle-price-badge" style="display:inline-block;">${badgeText}</span>` : '';
        document.getElementById('zoomOverlay').classList.add('active');
    };

    window.closeImageZoom = function() {
        document.getElementById('zoomOverlay').classList.remove('active');
    };

    // زر مشاركة الصفحة - بيفتح قائمة مشاركة الجهاز الطبيعية (واتساب، انستقرام...)، وإذا الجهاز
    // ما بيدعمها (متصفح كمبيوتر مثلاً)، بننسخ الرابط للحافظة بدلاً منها
    window.shareOffersPage = async function() {
        const shareData = {
            title: '🎁 عروض وحملات العروبة أونلاين',
            text: 'شوفي أحدث العروض والحزم عندنا بضغطة وحدة 🔥',
            url: window.location.href
        };
        try {
            if (navigator.share) {
                await navigator.share(shareData);
            } else {
                await navigator.clipboard.writeText(shareData.url);
                alert('✅ تم نسخ رابط الصفحة، الصقيه بأي مكان بدك تشاركيه');
            }
        } catch (e) {
            // المستخدم لغى المشاركة أو صار خطأ بسيط - ما في داعي نظهر رسالة خطأ مزعجة
            console.log('مشاركة ملغاة أو غير مدعومة', e);
        }
    };

    // بتحوّل محتوى الصفحة الحالي (العروض والحزم الظاهرة هلأ) لملف PDF قابل للتحميل - مفيد
    // للطباعة أو الإرسال كملف بدل رابط. بتاخد "صورة" من الصفحة وتقسمها لصفحات PDF تلقائياً
    window.downloadOffersAsPdf = async function() {
        const btn = document.getElementById('pdfBtn');
        const original = btn.innerText;
        btn.disabled = true;
        btn.innerText = '⏳';

        try {
            const target = document.querySelector('.wrap');

            // الصور معمولة "loading=lazy"، فأي صورة برة الشاشة لسا ما تحملت - لازم نجبرها تتحمل
            // كلها وننتظرها قبل ما ناخد "صورة" من الصفحة، وإلا بتطلع فاضية بالـ PDF
            const imgs = Array.from(target.querySelectorAll('img'));
            await Promise.all(imgs.map(img => {
                img.loading = 'eager';
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = () => resolve();
                    img.onerror = () => resolve();
                    setTimeout(resolve, 4000); // احتياط حتى ما تعلّق الصفحة لو صورة تعطّلت
                });
            }));

            const canvas = await html2canvas(target, {
                scale: 2, useCORS: true, backgroundColor: '#f3f4f6',
                ignoreElements: (el) => el.id === 'headerActionButtons'
            });

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            const imgWidth = pageWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            let heightLeft = imgHeight;
            let position = 0;
            const imgData = canvas.toDataURL('image/jpeg', 0.92);

            pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;

            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
            }

            pdf.save('عروض-العروبة-اونلاين.pdf');
        } catch (e) {
            console.error(e);
            alert('❌ تعذر إنشاء ملف PDF، حاولي مرة ثانية');
        } finally {
            btn.disabled = false;
            btn.innerText = original;
        }
    };

    let bannerCarouselIndex = 0;
    let bannerCarouselTimer = null;
    let bannerCarouselSlides = [];

    function renderBanners() {
        const container = document.getElementById('bannersSection');
        let todayStr = new Date().toISOString().slice(0, 10);
        let slides = (bannerSlides || []).filter(s => s && s.img && (!s.expiryDate || s.expiryDate >= todayStr));

        if (bannerCarouselTimer) { clearInterval(bannerCarouselTimer); bannerCarouselTimer = null; }

        if (slides.length === 0) {
            container.innerHTML = '';
            return;
        }

        bannerCarouselSlides = slides;
        bannerCarouselIndex = 0;

        container.innerHTML = `
            <div class="banner-carousel">
                <div class="banner-carousel-viewport" id="bannerViewport">
                    <div class="banner-carousel-track" id="bannerTrack">
                        ${slides.map(s => {
                            const imgTag = `<img src="${s.img}" alt="${escapeHtml(s.title)}">`;
                            return s.link ? `<a href="${s.link}" target="_blank" rel="noopener">${imgTag}</a>` : imgTag;
                        }).join('')}
                    </div>
                </div>
                ${slides.length > 1 ? `<div class="banner-carousel-dots" id="bannerDots">
                    ${slides.map((s, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('')}
                </div>` : ''}
            </div>
        `;

        if (slides.length > 1) {
            initBannerSwipe();
            bannerCarouselTimer = setInterval(() => goToBannerSlide(bannerCarouselIndex + 1), 4000);
        }
    }

    function goToBannerSlide(index) {
        const track = document.getElementById('bannerTrack');
        if (!track) return;
        const count = bannerCarouselSlides.length;
        bannerCarouselIndex = ((index % count) + count) % count;
        track.style.transform = `translateX(-${bannerCarouselIndex * 100}%)`;
        document.querySelectorAll('#bannerDots span').forEach((dot, i) => dot.classList.toggle('active', i === bannerCarouselIndex));
    }

    // سحب بالإصبع للتنقل بين البانرات يدوياً (بالإضافة للتدوير التلقائي)
    function initBannerSwipe() {
        const viewport = document.getElementById('bannerViewport');
        let startX = 0;
        viewport.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
        viewport.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) < 40) return;
            clearInterval(bannerCarouselTimer);
            goToBannerSlide(bannerCarouselIndex + (diff > 0 ? 1 : -1)); // RTL: سحب لليمين = رجوع
            bannerCarouselTimer = setInterval(() => goToBannerSlide(bannerCarouselIndex + 1), 4000);
        }, { passive: true });
    }

    // بترجع الحزمة (عرض كمية) المرتبطة بمنتج معين لو موجودة - نفس منطق المتجر الرئيسي بالظبط
    function findSpecificBundleForProduct(p) {
        if (!bundles || bundles.length === 0) return null;
        return bundles.find(b => b.selectedItems && b.selectedItems.length > 0 && b.selectedItems.includes(p.name)) || null;
    }

    function parseBundlePrice(b) {
        return Number(String(b.priceText || '0').replace(',', '.')) || 0;
    }

    // بس الحزم يلي عندها صورة مخصصة أو منتج ممثّل هي يلي بتظهر بمكان "الرزم" (بطاقة وحدة بس لكل
    // حزمة، مش كل منتجاتها فرادى) - نفس منطق المتجر الرئيسي بالظبط
    function renderProducts() {
        const container = document.getElementById('productsSection');

        let html = '<div class="products-grid">';
        let addedProductIds = new Set();
        let hasAnyCard = false;

        (bundles || []).forEach(b => {
            let featuredProduct = b.featuredForOffers ? products.find(p => p.name === b.featuredForOffers) : null;
            if (b.customImage) {
                html += createBundleOfferCardHtml(b);
                hasAnyCard = true;
                if (featuredProduct) addedProductIds.add(featuredProduct.id);
            } else if (featuredProduct) {
                html += createProductCardHtml(featuredProduct, findSpecificBundleForProduct(featuredProduct));
                hasAnyCard = true;
                addedProductIds.add(featuredProduct.id);
            }
        });

        products.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')).forEach(p => {
            let hasSale = p.salePrice !== undefined && p.salePrice !== "" && p.salePrice !== null;
            if (hasSale && !addedProductIds.has(p.id)) {
                html += createProductCardHtml(p, findSpecificBundleForProduct(p));
                hasAnyCard = true;
                addedProductIds.add(p.id);
            }
        });

        html += '</div>';

        if (!hasAnyCard) {
            container.innerHTML = '<div class="empty-msg">لا توجد عروض حالياً، رجعي تشيكي قريباً 🙂</div>';
            return;
        }

        container.innerHTML = html;
    }

    // الشارة التسويقية المختارة من لوحة إدارة الحزم.
    // يدعم القيم العربية وكذلك مفاتيح إنجليزية محتملة للحفاظ على التوافق.
    function getMarketingBadgeInfo(bundle) {
        const raw = String((bundle && bundle.marketingBadge) || '').trim();
        if (!raw) return null;

        const normalized = raw.replace(/\s+/g, ' ').toLowerCase();
        const map = {
            'عرض قوي': { text: 'عرض\nقوي', cls: 'strong' },
            '🔥 عرض قوي': { text: 'عرض\nقوي', cls: 'strong' },
            'strong': { text: 'عرض\nقوي', cls: 'strong' },
            'hot': { text: 'عرض\nقوي', cls: 'strong' },

            'الأكثر طلبًا': { text: 'الأكثر\nطلبًا', cls: 'popular' },
            'الأكثر طلبا': { text: 'الأكثر\nطلبًا', cls: 'popular' },
            '👑 الأكثر طلبًا': { text: 'الأكثر\nطلبًا', cls: 'popular' },
            'popular': { text: 'الأكثر\nطلبًا', cls: 'popular' },

            'عرض مميز': { text: 'عرض\nمميز', cls: 'featured' },
            '⭐ عرض مميز': { text: 'عرض\nمميز', cls: 'featured' },
            'featured': { text: 'عرض\nمميز', cls: 'featured' },

            'جديد': { text: 'جديد', cls: 'new' },
            '✨ جديد': { text: 'جديد', cls: 'new' },
            'new': { text: 'جديد', cls: 'new' }
        };
        return map[normalized] || { text: raw, cls: 'featured' };
    }

    function marketingBadgeHtml(bundle) {
        const info = getMarketingBadgeInfo(bundle);
        return info ? `<span class="marketing-badge ${info.cls}">${escapeHtml(info.text)}</span>` : '';
    }


    function getBundleOriginalTotal(bundle) {
        if (!bundle || !Array.isArray(bundle.selectedItems) || bundle.selectedItems.length === 0) return 0;
        const qty = Number(bundle.qty) || 0;
        const participating = bundle.selectedItems
            .map(name => products.find(p => p.name === name))
            .filter(Boolean);
        if (!participating.length || !qty) return 0;

        // عند اختلاف أسعار النكهات، نستخدم سعر المنتج الممثل إن وُجد؛ وإلا أول منتج مشارك.
        let representative = bundle.featuredForOffers
            ? participating.find(p => p.name === bundle.featuredForOffers)
            : null;
        representative = representative || participating[0];
        return (Number(representative.price) || 0) * qty;
    }

    function bundleSavingHtml(bundle) {
        const original = getBundleOriginalTotal(bundle);
        const offer = parseBundlePrice(bundle);
        const saving = original - offer;
        if (!(original > 0 && saving > 0.005)) return '';
        return `<div class="saving-row">
            <span class="saving-old">${original.toFixed(2)} ₪</span>
            <span class="saving-badge">وفّري ${saving.toFixed(2)} ₪</span>
        </div>`;
    }

    function saleSavingHtml(product) {
        const regular = Number(product && product.price) || 0;
        const sale = Number(product && product.salePrice);
        const saving = regular - sale;
        if (!(regular > 0 && Number.isFinite(sale) && saving > 0.005)) return '';
        return `<div class="saving-row">
            <span class="saving-old">${regular.toFixed(2)} ₪</span>
            <span class="saving-badge">وفّري ${saving.toFixed(2)} ₪</span>
        </div>`;
    }

    // بطاقة عرض حزمة (بس للحزم يلي عندها صورة مخصصة) - بالضغط عليها بتوديك لقسم "العروض" بالمتجر
    function createBundleOfferCardHtml(b) {
        let qty = Number(b.qty) || 4;
        let price = parseBundlePrice(b);
        let badgeText = `${qty} بـ ${price.toFixed(2)} ₪`;
        return `
            <div class="product-card has-sale">
                <div class="product-img-box" onclick='openImageZoom(event, "${b.customImage}", "${escapeHtml(b.name)}", "${escapeHtml(badgeText)}")'>
                    ${marketingBadgeHtml(b)}
                    <img src="${b.customImage}" alt="${escapeHtml(b.name)}" loading="lazy">
                </div>
                <div class="product-name">${escapeHtml(b.name || '')}</div>
                <div class="product-weight">${qty} قطع</div>
                ${bundleSavingHtml(b)}
                <span class="bundle-price-badge">${qty} بـ ${price.toFixed(2)} ₪</span>
            </div>
        `;
    }

    function createProductCardHtml(p, matchedBundle) {
        const hasSale = p.salePrice !== undefined && p.salePrice !== "" && p.salePrice !== null;
        const sellPrice = Number(p.price) || 0;
        const salePrice = hasSale ? Number(p.salePrice) : null;
        const discountPct = (hasSale && sellPrice > 0) ? Math.round((1 - salePrice / sellPrice) * 100) : null;

        // ملاحظة: ما عادت البطاقة نفسها رابط - الزبون ما بينتقل للمتجر إلا من زر "تسوقي" بالأسفل
        let bundleBadgeHtml = '';
        let zoomBadgeText = '';
        if (matchedBundle) {
            let bQty = Number(matchedBundle.qty) || 0;
            let bPrice = parseBundlePrice(matchedBundle);
            zoomBadgeText = `${bQty} بـ ${bPrice.toFixed(2)} ₪`;
            bundleBadgeHtml = `<span class="bundle-price-badge">${zoomBadgeText}</span>`;
        } else if (hasSale) {
            zoomBadgeText = `${salePrice.toFixed(2)}₪`;
        }

        return `
            <div class="product-card ${(hasSale || matchedBundle) ? 'has-sale' : ''}">
                <div class="product-img-box" onclick='openImageZoom(event, "${p.img || ''}", "${escapeHtml(p.name)}", "${escapeHtml(zoomBadgeText)}")'>
                    ${matchedBundle ? marketingBadgeHtml(matchedBundle) : ''}
                    ${discountPct ? `<span class="discount-badge">${discountPct}%-</span>` : ''}
                    <img src="${p.img || ''}" alt="${escapeHtml(p.name)}" loading="lazy">
                </div>
                <div class="product-name">${escapeHtml(p.name || '')}</div>
                <div class="product-weight">${escapeHtml(p.weight || 'حبة')}</div>
                ${matchedBundle ? bundleSavingHtml(matchedBundle) : (hasSale ? saleSavingHtml(p) : '')}
                ${(!matchedBundle && hasSale) ? `
                <div class="price-row"><span class="sale-price">${salePrice.toFixed(2)}₪</span></div>` : ''}
                ${bundleBadgeHtml}
            </div>
        `;
    }

    // بيانات حية (Live) - أي تغيير بالعروض من لوحة التحكم بينعكس هون تلقائياً بدون ما تحتاجي تنشري الملف من جديد
    onSnapshot(collection(db, "products"), (snap) => {
        products = [];
        snap.forEach(d => products.push({ id: d.id, ...d.data() }));
        renderProducts();
    });

    onSnapshot(collection(db, "bundles"), (snap) => {
        bundles = [];
        snap.forEach(d => bundles.push({ id: d.id, ...d.data() }));
        // نرتّب حسب sortOrder (نفس ترتيب السحب والإفلات المضبوط بـ bundle.html) حتى ترتيب المنتجات
        // هون يطابق بالظبط ترتيب قسم "العروض" بالمتجر الرئيسي
        bundles.sort((a, b) => (a.sortOrder !== undefined ? a.sortOrder : 999999) - (b.sortOrder !== undefined ? b.sortOrder : 999999));
        renderProducts();
    });

    onSnapshot(collection(db, "categories"), (snap) => {
        categories = [];
        snap.forEach(d => categories.push({ id: d.id, ...d.data() }));
        renderProducts();
    });
</script>
</body>
</html>
