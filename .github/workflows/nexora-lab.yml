name: nexora-lab
# فحوصات NEXORA على سيرفرات GitHub (بيانات بايننس الحقيقية من data.binance.vision). ما بيلمس ملفات المتجر.
# كل فحص بيشتغل على سيرفر لحاله بالتوازي.
on:
  push:
    branches: [main]
    paths: ["nexora-lab/jobs/**", "nexora-lab/runner.js", ".github/workflows/nexora-lab.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexora-lab-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: p
        run: |
          # عند الرفع: بس الفحوصات اللي ملفها تغيّر بهالرفعة (الباقي إما خلص أو شغال بدفعة ثانية)
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            export ONLY_CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- nexora-lab/jobs | sed 's#nexora-lab/jobs/##; s#\.json$##' | paste -sd, -)
            echo "changed: $ONLY_CHANGED"
          fi
          LIST=/tmp/todo.json node nexora-lab/runner.js
          echo "ids=$(cat /tmp/todo.json)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    if: needs.plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.nexora-data
          key: nexora-data-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            nexora-data-${{ matrix.id }}-
            nexora-data-
      - name: run ${{ matrix.id }}
        run: |
          git config user.name "nexora-lab-bot"
          git config user.email "nexora-lab-bot@users.noreply.github.com"
          ONLY=${{ matrix.id }} node nexora-lab/runner.js
