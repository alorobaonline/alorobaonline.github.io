name: nexora-tri1m
# 27/11: استراتيجية الفيديو 3 Trend Indicators (4 setups) على شموع الدقيقة — بيانات بايننس العامة. ما بيلمس ملفات المتجر.
on:
  push:
    branches: [main]
    paths: ["nexora-lab/tri1m_test.js", ".github/workflows/nexora-tri1m.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.nexora-data
          key: nexora-data-tri-${{ github.run_id }}
          restore-keys: |
            nexora-data-box-
            nexora-data-
      - name: run tri 1m test
        run: |
          git config user.name "nexora-lab-bot"
          git config user.email "nexora-lab-bot@users.noreply.github.com"
          node --max-old-space-size=12000 nexora-lab/tri1m_test.js
          git add nexora-lab/results/tri1m.txt
          git commit -m "NEXORA lab: tri 1m results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*7)); done
