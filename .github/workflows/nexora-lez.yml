name: nexora-lez
# 25/11: فحص Liquidity Entry Zones كما هي على سنتين (بيانات بايننس العامة). ما بيلمس ملفات المتجر.
on:
  push:
    branches: [main]
    paths: ["nexora-lab/lez_test.js", ".github/workflows/nexora-lez.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.nexora-data
          key: nexora-data-box-${{ github.run_id }}
          restore-keys: |
            nexora-data-box-
            nexora-data-
      - name: run lez test
        run: |
          git config user.name "nexora-lab-bot"
          git config user.email "nexora-lab-bot@users.noreply.github.com"
          node --max-old-space-size=12000 nexora-lab/lez_test.js
          git add nexora-lab/results/lez2y.txt
          git commit -m "NEXORA lab: LEZ 2y results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*7)); done
