name: nexora-grid1m
# 25/11: غريد الزخم على شموع الدقيقة بتنفيذ واقعي (بيانات بايننس العامة). ما بيلمس ملفات المتجر.
on:
  push:
    branches: [main]
    paths: ["nexora-lab/grid1m_test.js", ".github/workflows/nexora-grid1m.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.nexora-data
          key: nexora-data-box-${{ github.run_id }}
          restore-keys: |
            nexora-data-box-
            nexora-data-
      - name: run grid 1m test
        run: |
          git config user.name "nexora-lab-bot"
          git config user.email "nexora-lab-bot@users.noreply.github.com"
          GRID_TIME=1 GRID_COINS=AKEUSDT,EVAAUSDT,JCTUSDT,IDOLUSDT,AINUSDT,AGTUSDT,BLESSUSDT,BULLAUSDT,INITUSDT,ONUSDT,ARIAUSDT,BTWUSDT,SOPHUSDT,PIEVERSEUSDT,MMTUSDT,BLURUSDT,STRKUSDT,TRUMPUSDT,TIAUSDT,WLDUSDT node --max-old-space-size=12000 nexora-lab/grid1m_test.js
          git add nexora-lab/results/grid1m_scan.txt
          git commit -m "NEXORA lab: grid 1m results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*7)); done
