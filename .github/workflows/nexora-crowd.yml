name: nexora-crowd
# 28/11: فحص ازدحام السوق (عقود مفتوحة · نسب لونج/شورت · بريميوم) على بيانات بايننس الرسمية. ما بيلمس ملفات المتجر.
on:
  push:
    branches: [main]
    paths: ["nexora-lab/crowd_test.js", ".github/workflows/nexora-crowd.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ~/.nexora-data
          key: nexora-crowd-${{ github.run_id }}
          restore-keys: |
            nexora-crowd-
      - run: |
          git config user.name "nexora-lab-bot"
          git config user.email "nexora-lab-bot@users.noreply.github.com"
          CONFIRM=1000PEPEUSDT,ENAUSDT,SUIUSDT,ORDIUSDT,KAITOUSDT node --max-old-space-size=12000 nexora-lab/crowd_test.js
          git add nexora-lab/results/crowd_test.txt nexora-lab/results/crowd_confirm.txt 2>/dev/null; git add nexora-lab/results/crowd_confirm.txt
          git commit -m "NEXORA lab: crowd test results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*7)); done
