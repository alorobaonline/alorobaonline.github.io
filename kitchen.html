<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; border: 1px solid #e5e7eb; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid #cbd5e1; }
        
        .order-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 0.75rem; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px; }
        .order-items-list { margin-bottom: 8px; font-size: 0.7rem; color: #4b5563; }
        .order-items-list div { padding: 2px 0; border-bottom: 1px dashed #e2e8f0; }
        
        .form-control { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.75rem; outline: none; background: white; margin-top: 5px; margin-bottom: 8px; }
        .btn-action { background: var(--accent-green); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-delay { background: #d97706; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍳 شاشة المطبخ - العروبة أونلاين</h1>
        <a href="admin.html" class="back-btn">← لوحة التحكم</a>
    </div>

    <div style="font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; color: #4b5563;">
        الطلبات الواردة للتحضير النشط:
    </div>

    <div id="kitchenOrdersContainer">
        <p style="text-align: center; color: #888; font-size: 0.75rem;">جاري تحميل الطلبات...</p>
    </div>
</div>

<script>
    window.addEventListener('firebase-ready', function() {
        initKitchenOrdersListener();
    });

    function initKitchenOrdersListener() {
        window.onSnapshot(window.collection(window.db, "orders"), (snapshot) => {
            let orders = [];
            snapshot.forEach(docSnap => {
                orders.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderKitchenOrders(orders);
        });
    }

    function renderKitchenOrders(orders) {
        const container = document.getElementById('kitchenOrdersContainer');
        if(!container) return;
        
        // تصفية الطلبات التي لم تكتمل بعد أو تخص المطبخ
        let activeOrders = orders.filter(o => !o.status || o.status === "جديد" || o.status === "new" || o.status === "قيد التحضير");

        if(activeOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات جديدة حالياً ✨</p>';
            return;
        }

        container.innerHTML = '';
        activeOrders.forEach((ord, index) => {
            let itemsHtml = '';
            if(ord.items && Array.isArray(ord.items)) {
                ord.items.forEach(item => {
                    itemsHtml += `<div>• ${item.name || 'منتج'} (الكمية: ${item.qty || 1})</div>`;
                });
            }

            container.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span>طلب #${index + 1} - ${ord.customerName || 'زبون'}</span>
                        <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                    </div>
                    <div style="font-size: 0.7rem; margin-bottom: 5px;"><b>الهاتف:</b> ${ord.customerPhone || ''}</div>
                    <div style="font-size: 0.7rem; margin-bottom: 5px;"><b>العنوان:</b> ${ord.customerAddress || ord.address || ''}</div>
                    
                    <div class="order-items-list">
                        <b>المنتجات المطلوبة:</b>
                        ${itemsHtml}
                    </div>

                    <div class="form-group">
                        <label style="font-size: 0.65rem; font-weight: bold; color: #4b5563;">سبب التأخير (إن وجد):</label>
                        <select id="delayReason_${ord.id}" class="form-control">
                            <option value="">بدون تأخير / طبيعي</option>
                            <option value="تأخر تحضير المواد بالمطبخ">تأخر تحضير المواد بالمطبخ</option>
                            <option value="نقص في بعض المواد الخام">نقص في بعض المواد الخام</option>
                            <option value="ضغط طلبات عالية جداً">ضغط طلبات عالية جداً</option>
                        </select>
                        <button class="btn-delay" onclick="saveDelayReason('${ord.id}')">حفظ سبب التأخير ⚠️</button>
                    </div>

                    <button class="btn-action" onclick="markOrderReady('${ord.id}')">تم التحضير - جاهز للتوصيل 🚀</button>
                </div>
            `;
        });
    }

    async function saveDelayReason(orderId) {
        const selectElem = document.getElementById(`delayReason_${orderId}`);
        const reason = selectElem ? selectElem.value : "";
        
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), {
                delayReason: reason
            });
            alert("تم حفظ سبب التأخير بنجاح وزامن مع النظام! ✨");
        } catch(e) {
            console.error(e);
            alert("خطأ في حفظ سبب التأخير.");
        }
    }

    async function markOrderReady(orderId) {
        if(confirm("هل أنت متأكد من أن الطلب جاهز للتوصيل؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "جاهز للتوصيل"
                });
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }
</script>
</body>
</html>
