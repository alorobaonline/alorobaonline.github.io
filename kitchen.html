<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ والطلبات - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }

        .container { max-width: 480px; margin: 0 auto; }
        
        .header { background: var(--primary-green); color: white; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; box-shadow: var(--shadow-card); }
        .header h1 { font-size: 1.1rem; font-weight: 900; margin-bottom: 5px; }
        .status-badge { display: inline-block; background: rgba(104, 166, 51, 0.3); color: #a3e635; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }

        .notif-bar { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 10px 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .notif-bar span { color: #1e40af; font-weight: bold; }
        .notif-bar button { background: #2563eb; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .order-card { background: white; border: 2px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: var(--shadow-card); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 10px; font-weight: 900; color: var(--primary-green); font-size: 0.9rem; }
        
        .timer-badge { background: #fef3c7; color: #d97706; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; display: inline-flex; align-items: center; gap: 4px; direction: ltr; }
        .clock-badge { background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; display: inline-flex; align-items: center; gap: 4px; }

        .customer-info { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 0.75rem; }
        .customer-info div { margin-bottom: 3px; }

        .items-title { font-size: 0.8rem; font-weight: 800; color: #374151; margin-bottom: 6px; }
        
        .kitchen-item-row { display: flex; align-items: center; justify-content: space-between; background: #fafafa; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; transition: all 0.2s; }
        .kitchen-item-row.checked { background: #f0fdf4; border-color: #bbf7d0; opacity: 0.75; }
        .kitchen-item-row.checked .item-name-text { text-decoration: line-through; color: #166534; }

        .item-left-side { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .item-checkbox { width: 20px; height: 20px; accent-color: var(--accent-green); cursor: pointer; flex-shrink: 0; }
        .item-thumb { width: 40px; height: 40px; object-fit: contain; background: white; border-radius: 6px; border: 1px solid #e5e7eb; padding: 2px; flex-shrink: 0; }
        
        .item-details-box { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .item-name-text { font-size: 0.8rem; font-weight: 700; color: #1f2937; white-space: normal; word-break: break-word; line-height: 1.2; }
        .item-weight-badge { color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 1px 5px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; width: fit-content; margin-top: 2px; }

        .item-right-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-right: 6px; }
        .item-price-badge { background: #fef9c3; color: #854d0e; padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .item-qty-badge { background: var(--primary-green); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 900; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #f1f5f9; padding-top: 10px; margin-top: 10px; }
        .total-price { font-size: 0.95rem; font-weight: 900; color: var(--primary-green); }
        
        .btn-action { background: var(--accent-green); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: opacity 0.2s; }
        .btn-action:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        
        .btn-start { background: #d97706; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        
        .nav-back { display: block; text-align: center; background: #e5e7eb; color: #374151; padding: 10px; border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 0.8rem; margin-bottom: 15px; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="container">
    <a href="admin.html" class="nav-back">← العودة إلى لوحة التحكم</a>
    
    <div class="header">
        <h1>🍳 شاشة المطبخ والطلبات</h1>
        <div class="status-badge">🟢 متصل بالسحابة (تحديث مباشر)</div>
    </div>

    <!-- شريط تفعيل التنبيهات الصوتية -->
    <div class="notif-bar" id="notifBanner">
        <span>🔔 انقر لتفعيل التنبيهات الصوتية للطلبات</span>
        <button onclick="askNotificationPermission()">تفعيل</button>
    </div>

    <div id="kitchenOrdersList">
        <p style="text-align: center; color: #666; font-size: 0.8rem; padding: 20px;">جاري تحميل الطلبات...</p>
    </div>
</div>

<script>
    let orders = [];
    let productsList = [];
    let isInitialLoad = true;

    window.addEventListener('firebase-ready', async function() {
        checkNotificationPermissionUI();
        await loadProductsList();
        initKitchenRealtimeOrders();
        
        setInterval(updateOrderTimers, 1000);
    });

    function checkNotificationPermissionUI() {
        if ("Notification" in window && Notification.permission === "granted") {
            const banner = document.getElementById('notifBanner');
            if(banner) banner.style.display = 'none';
        }
    }

    function askNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    const banner = document.getElementById('notifBanner');
                    if(banner) banner.style.display = 'none';
                    alert("تم تفعيل إشعارات المطبخ بنجاح!");
                }
            });
        }
    }

    function playAlertSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {
            console.log("Audio blocked");
        }
    }

    async function loadProductsList() {
        try {
            const querySnapshot = await window.getDocs(window.collection(window.db, "products"));
            productsList = [];
            querySnapshot.forEach(docSnap => {
                productsList.push(docSnap.data());
            });
        } catch (e) {
            console.error("خطأ في جلب المنتجات:", e);
        }
    }

    function initKitchenRealtimeOrders() {
        window.onSnapshot(window.collection(window.db, "orders"), (snapshot) => {
            if (isInitialLoad) {
                isInitialLoad = false;
                orders = [];
                snapshot.forEach(docSnap => {
                    let d = docSnap.data();
                    orders.push({ id: docSnap.id, ...d });
                });
                renderKitchenOrders();
                return;
            }

            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    let newOrder = change.doc.data();
                    playAlertSound();
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("طلب مطبخ جديد! 🍳", {
                            body: `الزبون: ${newOrder.customerName || 'بدون اسم'} - الإجمالي: ${newOrder.total || 0} ₪`,
                            icon: "https://i.ibb.co/3m1K2wP/basket.png"
                        });
                    }
                }
            });

            orders = [];
            snapshot.forEach(docSnap => {
                let d = docSnap.data();
                orders.push({ id: docSnap.id, ...d });
            });
            renderKitchenOrders();
        });
    }

    function formatClockTime(isoString) {
        if (!isoString) return "--:--";
        let date = new Date(isoString);
        if (isNaN(date.getTime())) return "--:--";
        let hours = date.getHours().toString().padStart(2, '0');
        let minutes = date.getMinutes().toString().padStart(2, '0');
        return `${hours}:${minutes}`;
    }

    function renderKitchenOrders() {
        const container = document.getElementById('kitchenOrdersList');
        if(!container) return;

        const activeOrders = orders.filter(o => !o.status || o.status === "جديد" || o.status === "قيد التحضير" || o.status === "new");

        if(activeOrders.length === 0) {
            container.innerHTML = '<div style="background: white; border-radius: 16px; padding: 30px; text-align: center; font-size: 0.9rem; color: #666; box-shadow: var(--shadow-card);">🎉 لا توجد طلبات معلقة حالياً!</div>';
            return;
        }

        let html = "";
        activeOrders.forEach((ord, index) => {
            let itemsHtml = "";
            
            if(ord.items && Array.isArray(ord.items)) {
                ord.items.forEach((item, itemIdx) => {
                    let imgSrc = item.img;
                    let itemPrice = item.price;
                    let itemWeight = item.weight || item.size || item.unit || "";

                    // البحث في قائمة المنتجات في المتجر لاستكمال بيانات الصورة، السعر، والوزن/الحجم
                    let foundProd = productsList.find(p => p.name === item.name);
                    if(foundProd) {
                        if(!imgSrc && foundProd.img) imgSrc = foundProd.img;
                        if(itemPrice === undefined || itemPrice === null) itemPrice = foundProd.price;
                        if(!itemWeight) itemWeight = foundProd.weight || foundProd.size || foundProd.unit || "";
                    }
                    if(!imgSrc) {
                        imgSrc = "https://i.ibb.co/3m1K2wP/basket.png";
                    }

                    let formattedPrice = (itemPrice !== undefined && itemPrice !== null) ? `${itemPrice} ₪` : '';
                    let weightBadgeHtml = itemWeight ? `<span class="item-weight-badge">${itemWeight}</span>` : '';

                    let checkboxId = `chk_${ord.id}_${itemIdx}`;
                    itemsHtml += `
                        <div class="kitchen-item-row" id="row_${checkboxId}">
                            <div class="item-left-side">
                                <input type="checkbox" class="item-checkbox" id="${checkboxId}" onchange="toggleItemCheck('${checkboxId}', '${ord.id}')">
                                <img src="${imgSrc}" class="item-thumb" onerror="this.src='https://i.ibb.co/3m1K2wP/basket.png'">
                                <div class="item-details-box">
                                    <span class="item-name-text">${item.name}</span>
                                    ${weightBadgeHtml}
                                </div>
                            </div>
                            <div class="item-right-side">
                                ${formattedPrice ? `<span class="item-price-badge">${formattedPrice}</span>` : ''}
                                <div class="item-qty-badge">${item.quantity || 1}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                itemsHtml = '<p style="font-size: 0.75rem; color: #888;">لا توجد تفاصيل للمنتجات</p>';
            }

            let statusText = ord.status || 'جديد';
            let badgeHtml = "";
            let actionButtonHtml = "";

            if (!ord.status || ord.status === "جديد" || ord.status === "new") {
                let orderTime = formatClockTime(ord.createdAt);
                badgeHtml = `<span class="clock-badge">🕒 استلام الطلبية: ${orderTime}</span>`;
                actionButtonHtml = `<button class="btn-start" onclick="startPreparation('${ord.id}')">ابدأ بالتحضير ⏱️</button>`;
            } else {
                let startTime = ord.preparingAt || new Date().toISOString();
                badgeHtml = `<span class="timer-badge preparing-timer" data-start="${startTime}">⏱️ 00:00:00</span>`;
                actionButtonHtml = `<button class="btn-action" id="btn_send_${ord.id}" onclick="markOrderReady('${ord.id}')" disabled>إرسال للسائق 🚚</button>`;
            }

            html += `
                <div class="order-card" id="order_card_${ord.id}">
                    <div class="order-header">
                        <span>طلب #${ord.id ? ord.id.substring(0, 6) : (index + 1)}</span>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            ${badgeHtml}
                            <span style="font-size: 0.75rem; background: ${ord.status === 'قيد التحضير' ? '#fef3c7' : '#dcfce7'}; color: ${ord.status === 'قيد التحضير' ? '#b45309' : '#166534'}; padding: 2px 8px; border-radius: 6px;">${statusText}</span>
                        </div>
                    </div>

                    <div class="customer-info">
                        <div><b>👤 الزبون:</b> ${ord.customerName || 'بدون اسم'}</div>
                        <div><b>📍 العنوان:</b> ${ord.customerAddress || 'بدون عنوان'}</div>
                    </div>

                    <div class="items-title">📦 قائمة المنتجات والتجهيز:</div>
                    <div style="margin-bottom: 12px;">
                        ${itemsHtml}
                    </div>

                    <div class="order-footer">
                        <div class="total-price">المجموع: ${ord.total || 0} ₪</div>
                        <div>
                            ${actionButtonHtml}
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
        updateOrderTimers();
    }

    function updateOrderTimers() {
        document.querySelectorAll('.preparing-timer').forEach(badge => {
            let startStr = badge.getAttribute('data-start');
            if (startStr) {
                let startMs = new Date(startStr).getTime();
                let nowMs = new Date().getTime();
                let diff = nowMs - startMs;
                if (diff < 0) diff = 0;

                let totalSeconds = Math.floor(diff / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                let formatted = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                badge.innerHTML = `⏱️ ${formatted}`;
            }
        });
    }

    function toggleItemCheck(checkboxId, orderId) {
        const checkbox = document.getElementById(checkboxId);
        const row = document.getElementById(`row_${checkboxId}`);
        if(checkbox && row) {
            if(checkbox.checked) {
                row.classList.add('checked');
            } else {
                row.classList.remove('checked');
            }
        }

        const card = document.getElementById(`order_card_${orderId}`);
        if(card) {
            const checkboxes = card.querySelectorAll('.item-checkbox');
            const sendBtn = document.getElementById(`btn_send_${orderId}`);
            
            if(sendBtn) {
                let allChecked = true;
                checkboxes.forEach(chk => {
                    if(!chk.checked) allChecked = false;
                });

                if(allChecked) {
                    sendBtn.removeAttribute('disabled');
                } else {
                    sendBtn.setAttribute('disabled', 'true');
                }
            }
        }
    }

    async function startPreparation(orderId) {
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), { 
                status: "قيد التحضير",
                preparingAt: new Date().toISOString() 
            });
        } catch(e) {
            alert("حدث خطأ أثناء تحديث حالة الطلب");
        }
    }

    async function markOrderReady(orderId) {
        const card = document.getElementById(`order_card_${orderId}`);
        if(card) {
            const checkboxes = card.querySelectorAll('.item-checkbox');
            let allChecked = true;
            checkboxes.forEach(chk => {
                if(!chk.checked) allChecked = false;
            });
            if(!allChecked) {
                alert("⚠️ تنبيه: يجب شطب جميع منتجات الطلب وتحديدها أولاً قبل إرساله للسائق!");
                return;
            }
        }

        if(confirm("هل أنت متأكد من انتهاء تجهيز الطلب وإرساله إلى السائق؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), { status: "جاهز للتوصيل" });
                alert("تم إرسال الطلب إلى لوحة السائق بنجاح! 🚚");
            } catch(e) {
                alert("حدث خطأ أثناء تحديث حالة الطلب");
            }
        }
    }
</script>
</body>
</html>
