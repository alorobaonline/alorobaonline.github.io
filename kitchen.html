<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; border: 1px solid #e5e7eb; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid #cbd5e1; }
        
        .order-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 0.75rem; transition: background .3s, border-color .3s; }
        .order-card.order-warning { background: #fffbeb; border-color: #f59e0b; }
        .order-card.order-urgent { background: #fef2f2; border-color: #dc2626; animation: pulse-urgent 1.6s infinite; }
        @keyframes pulse-urgent {
            0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.35); }
            70% { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
            100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
        }
        .order-elapsed { font-weight: 700; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px; font-size: 0.8rem; }
        
        .order-info { margin-bottom: 8px; color: #333; }
        .order-info p { margin: 3px 0; }
        .order-time { background: #fef3c7; color: #b45309; padding: 5px 10px; border-radius: 6px; display: inline-block; font-weight: bold; margin-top: 6px; font-size: 0.75rem; border: 1px solid #fde68a; }
        .prep-time-chip { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 6px; display: inline-block; font-weight: bold; margin-top: 6px; margin-inline-start: 6px; font-size: 0.75rem; border: 1px solid #bae6fd; }
        .order-notes { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 7px 10px; margin-top: 6px; font-weight: 700; font-size: 0.75rem; }
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-inline-start: 6px; }
        .status-badge.status-new { background: #dbeafe; color: #1e40af; }
        .status-badge.status-preparing { background: #fef3c7; color: #92400e; }
        .btn-secondary-action { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px; }
        .btn-secondary-action:hover { background: #2563eb; }
        .btn-prepare-action { background: #f59e0b; }
        .btn-prepare-action:hover { background: #d97706; }

        #printArea { display: none; }
        @media print {
            body > *:not(#printArea) { display: none !important; }
            #printArea { display: block !important; }
        }

        .products-section { margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 8px; }
        .section-label { font-weight: bold; margin-bottom: 6px; color: #4b5563; font-size: 0.75rem; }
        
        .product-item-row { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; margin-bottom: 6px; transition: background .2s ease, border-color .2s ease; }
        .item-check-box { width: 22px; height: 22px; accent-color: var(--accent-green); cursor: pointer; flex-shrink: 0; }
        .product-item-row.item-checked { background: #f0fdf4; border-color: #bbf7d0; }
        .product-item-row.item-checked .product-name,
        .product-item-row.item-checked .product-qty { text-decoration: line-through; color: #9ca3af; }
        .btn-action:disabled { opacity: 0.45; cursor: not-allowed; }
        .ready-hint { font-size: 0.65rem; color: #b45309; font-weight: 700; text-align: center; margin-top: 4px; }
        
        .product-thumb { width: 45px; height: 45px; min-width: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; transition: opacity 0.2s; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden; }
        .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .product-thumb:hover { opacity: 0.85; }

        .product-details { display: flex; flex-direction: column; }
        .product-name { font-weight: 600; color: #1f2937; font-size: 0.75rem; }
        .product-qty { font-size: 0.7rem; color: #6b7280; }

        .btn-action { background: var(--accent-green); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-action:hover { background: #558b2f; }

        /* نافذة تكبير الصورة (Modal) */
        .image-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; border: 2px solid white; object-fit: contain; }
        .image-modal.active { display: flex; }
    </style>

        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.query = query;
        window.where = where;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div id="newOrderBanner" onclick="dismissNewOrderAlert()" style="display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(220,38,38,0.96); flex-direction: column; align-items: center; justify-content: center; cursor: pointer; animation: bannerPulse 1s infinite;">
    <div style="font-size: 4rem; margin-bottom: 10px;">🔔</div>
    <div style="color: white; font-size: 1.4rem; font-weight: 900; margin-bottom: 8px;">طلبية جديدة وصلت!</div>
    <div style="color: white; font-size: 0.85rem; font-weight: 700; background: rgba(255,255,255,0.2); padding: 10px 24px; border-radius: 30px; margin-top: 14px;">✅ اضغط هنا عشان توقف التنبيه</div>
</div>
<style>
@keyframes bannerPulse {
    0%, 100% { background: rgba(220,38,38,0.96); }
    50% { background: rgba(185,28,28,0.96); }
}
</style>

<div class="container">
    <div class="header">
        <h1>🍳 شاشة المطبخ - العروبة أونلاين</h1>
        <a href="admin.html" class="back-btn">← لوحة التحكم</a>
    </div>

    <button id="unlockSoundBtn" onclick="unlockSound()" style="width: 100%; margin-bottom: 10px; padding: 8px; background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; color: #0369a1;">🔔 اضغط هنا لتفعيل التنبيه الصوتي عند وصول طلبات جديدة</button>

    <div style="font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; color: #4b5563;">
        الطلبات الواردة للتحضير النشط:
    </div>

    <div id="kitchenOrdersContainer">
        <p style="text-align: center; color: #888; font-size: 0.75rem;">جاري تحميل الطلبات...</p>
    </div>
</div>

<!-- منطقة الطباعة (تظهر فقط عند الطباعة) -->
<div id="printArea"></div>

<!-- نافذة تكبير الصورة -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="modalImage" src="" alt="صورة مكبرة">
</div>

<script>
    let currentOrdersList = [];
    let knownActiveOrderIds = new Set();
    let isFirstSnapshot = true;
    let soundUnlocked = false;

    window.addEventListener('firebase-ready', function() {
        initKitchenOrdersListener();
    });

    function initKitchenOrdersListener() {
        // نجيب فقط الطلبات الجديدة/قيد التحضير من قاعدة البيانات مباشرة
        // بدل ما نحمّل كل تاريخ الطلبات كل مرة (هذا كان يبطّئ الشاشة مع تراكم الطلبات)
        const activeQuery = window.query(
            window.collection(window.db, "orders"),
            window.where("status", "in", ["جديد", "new", "قيد التحضير"])
        );
        window.onSnapshot(activeQuery, (snapshot) => {
            let allOrders = [];
            snapshot.forEach(docSnap => {
                allOrders.push({ id: docSnap.id, ...docSnap.data() });
            });
            currentOrdersList = allOrders;

            let activeOrders = allOrders.filter(o => !o.status || o.status === "جديد" || o.status === "new" || o.status === "قيد التحضير");
            let currentIds = new Set(activeOrders.map(o => o.id));

            if (!isFirstSnapshot) {
                let hasNewOrder = activeOrders.some(o => !knownActiveOrderIds.has(o.id));
                if (hasNewOrder) showNewOrderAlert();
            }
            isFirstSnapshot = false;
            knownActiveOrderIds = currentIds;

            renderKitchenOrders(allOrders);
        });
    }

    // ===================== تنبيه صوتي عند وصول طلب جديد =====================
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch(e) {
            console.log('تعذر تفعيل قفل الشاشة (منع الإغلاق التلقائي):', e);
        }
    }

    // نعيد طلب قفل الشاشة لو الجهاز رجع من وضع الخلفية (النظام يلغيه تلقائيًا لما الشاشة تختفي)
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    function unlockSound() {
        soundUnlocked = true;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } catch(e) {}
        requestWakeLock(); // نمنع الشاشة تنطفي أو تنام لحد ما الموظف يقفلها بنفسه، عشان ما يفوته أي طلب جديد
        let btn = document.getElementById('unlockSoundBtn');
        if (btn) {
            btn.innerText = '🔔 التنبيه الصوتي مفعّل ✅';
            btn.disabled = true;
            btn.style.opacity = '0.6';
        }
    }

    function playNewOrderSound() {
        if (!soundUnlocked) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const playBeep = (startTime, freq) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.4);
            };
            const now = ctx.currentTime;
            playBeep(now, 880);
            playBeep(now + 0.25, 1046);
        } catch(e) { console.log('تعذر تشغيل صوت التنبيه:', e); }
    }

    // ===================== تنبيه بصري كبير يتكرر لحد ما الموظف يلاحظه ويقفله يدويًا =====================
    let alertRepeatInterval = null;

    function showNewOrderAlert() {
        playNewOrderSound();
        if (alertRepeatInterval) clearInterval(alertRepeatInterval);
        alertRepeatInterval = setInterval(playNewOrderSound, 3000);

        let banner = document.getElementById('newOrderBanner');
        if (banner) banner.style.display = 'flex';
    }

    function dismissNewOrderAlert() {
        if (alertRepeatInterval) {
            clearInterval(alertRepeatInterval);
            alertRepeatInterval = null;
        }
        let banner = document.getElementById('newOrderBanner');
        if (banner) banner.style.display = 'none';
    }

    function formatOrderTime(ord) {
        let timeVal = ord.createdAt || ord.time || ord.timestamp || ord.date || ord.orderTime;
        if (!timeVal) return 'الوقت غير مسجل';
        
        let date;
        if (typeof timeVal === 'object' && timeVal.seconds) {
            date = new Date(timeVal.seconds * 1000);
        } else {
            date = new Date(timeVal);
        }
        
        if (isNaN(date.getTime())) {
            return timeVal;
        }
        
        let timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        let dateStr = date.toLocaleDateString('en-GB');
        return `${timeStr} | ${dateStr}`;
    }

    // يرجع وقت الطلب بالميلي ثانية لحساب "الوقت الحي المنقضي" وتلوين الطلبات المتأخرة
    function getOrderTimestampMillis(ord) {
        let timeVal = ord.createdAt || ord.time || ord.timestamp || ord.date || ord.orderTime;
        if (!timeVal) return null;
        let date;
        if (typeof timeVal === 'object' && timeVal.seconds) {
            date = new Date(timeVal.seconds * 1000);
        } else {
            date = new Date(timeVal);
        }
        if (isNaN(date.getTime())) return null;
        return date.getTime();
    }

    // يحدّث "منذ كم دقيقة" لكل الطلبات المعروضة حياً، ويلوّن البطاقة حسب مدة الانتظار
    function tickElapsedTimes() {
        document.querySelectorAll('.order-elapsed').forEach(el => {
            let ts = Number(el.getAttribute('data-ts'));
            let card = el.closest('.order-card');
            if (!ts) { el.innerText = ''; return; }

            let diffMin = Math.floor((Date.now() - ts) / 60000);
            el.innerText = diffMin <= 0 ? '(الآن)' : `(منذ ${diffMin} دقيقة)`;

            if (card) {
                card.classList.remove('order-warning', 'order-urgent');
                if (diffMin >= 30) card.classList.add('order-urgent');
                else if (diffMin >= 15) card.classList.add('order-warning');
            }
        });
    }
    setInterval(tickElapsedTimes, 20000);


    function renderKitchenOrders(orders) {
        const container = document.getElementById('kitchenOrdersContainer');
        if(!container) return;
        
        let activeOrders = orders.filter(o => !o.status || o.status === "جديد" || o.status === "new" || o.status === "قيد التحضير");

        // ترتيب الطلبات: الأقدم أولاً (أعلى القائمة) عشان ما يتنسى ولا طلب
        activeOrders.sort((a, b) => {
            let ta = getOrderTimestampMillis(a);
            let tb = getOrderTimestampMillis(b);
            if (ta === null) return 1;
            if (tb === null) return -1;
            return ta - tb;
        });

        if(activeOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات جديدة حالياً ✨</p>';
            return;
        }

        container.innerHTML = '';
        activeOrders.forEach((ord, index) => {
            let itemsHtml = '';
            let totalQty = 0;
            let itemsCount = (ord.items && Array.isArray(ord.items)) ? ord.items.length : 0;
            if(ord.items && Array.isArray(ord.items)) {
                ord.items.forEach((item, itemIdx) => {
                    let imgSrc = item.image || item.img || item.imageUrl || item.photo || item.productImage || (item.product && (item.product.image || item.product.img)) || "";
                    let qty = Number(item.qty || item.quantity || 1);
                    totalQty += qty;
                    
                    let imageElement = '';
                    if(imgSrc) {
                        imageElement = `<div class="product-thumb" onclick="openImageModal('${imgSrc}')"><img src="${imgSrc}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='🛒';"></div>`;
                    } else {
                        imageElement = `<div class="product-thumb">🛒</div>`;
                    }

                    let isChecked = Array.isArray(ord.checkedItems) && ord.checkedItems[itemIdx] === true;

                    itemsHtml += `
                        <div class="product-item-row ${isChecked ? 'item-checked' : ''}">
                            <input type="checkbox" class="item-check-box" ${isChecked ? 'checked' : ''} onchange="toggleItemCheck('${ord.id}', ${itemIdx}, this)">
                            ${imageElement}
                            <div class="product-details">
                                <span class="product-name">${item.name || item.productName || 'منتج'}</span>
                                <span class="product-qty">الكمية: (${qty})</span>
                            </div>
                        </div>
                    `;
                });
            }

            let orderTimeFormatted = formatOrderTime(ord);
            let orderTsMillis = getOrderTimestampMillis(ord);
            let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : `#${index + 1}`;

            let currentStatus = ord.status || "جديد";
            let statusBadgeHtml = currentStatus === 'قيد التحضير'
                ? `<span class="status-badge status-preparing">🔥 قيد التحضير</span>`
                : `<span class="status-badge status-new">🆕 جديد</span>`;

            let estimatedMinutes = 5 + (totalQty * 2);

            let notesVal = ord.notes || ord.orderNotes || ord.customerNotes || '';
            let notesHtml = notesVal ? `<div class="order-notes">📝 ملاحظة الزبون: ${notesVal}</div>` : '';

            let allChecked = isOrderFullyChecked(ord);
            let actionButtonHtml = currentStatus === 'قيد التحضير'
                ? `<button class="btn-action" id="readyBtn_${ord.id}" ${allChecked ? '' : 'disabled'} onclick="markOrderReady('${ord.id}')">✅ تم التحضير - جاهز للتوصيل</button>
                   <div class="ready-hint" id="readyHint_${ord.id}" style="${allChecked ? 'display:none;' : ''}">✅ علّم كل المنتجات (اشطبها) أولاً عشان تقدر ترسل الطلب للسائق</div>`
                : `<button class="btn-action btn-prepare-action" onclick="startPreparingOrder('${ord.id}')">🔥 بدء التحضير</button>`;

            container.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span>طلب ${orderLabel} - ${ord.customerName || ord.clientName || 'زبون'} ${statusBadgeHtml}</span>
                        <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                    </div>
                    
                    <div class="order-info">
                        <p><strong>الهاتف:</strong> ${ord.customerPhone || ord.phone || ''}</p>
                        <p><strong>العنوان:</strong> ${ord.customerAddress || ord.address || ''}</p>
                        <div class="order-time">⏰ وقت الطلب: <span dir="ltr" style="display:inline-block;">${orderTimeFormatted}</span> <span class="order-elapsed" data-ts="${orderTsMillis || ''}"></span></div>
                        <span class="prep-time-chip">⏱️ الوقت المتوقع: ~${estimatedMinutes} د</span>
                        ${notesHtml}
                    </div>
                    
                    <div class="products-section">
                        <div class="section-label">المنتجات المطلوبة:</div>
                        ${itemsHtml}
                    </div>

                    ${actionButtonHtml}
                    <button class="btn-secondary-action" onclick="printOrder('${ord.id}')">🖨️ طباعة فاتورة التحضير</button>
                </div>
            `;
        });

        tickElapsedTimes();
    }

    function openImageModal(imageSrc) {
        if(!imageSrc) return;
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modalImg.src = imageSrc;
        modal.classList.add('active');
    }

    function closeImageModal() {
        const modal = document.getElementById('imageModal');
        modal.classList.remove('active');
    }

    // ===================== تتبّع تعليم المنتجات المجهّزة قبل إرسال الطلب للسائق (محفوظة بقاعدة البيانات) =====================
    function isOrderFullyChecked(ord) {
        let itemsCount = (ord && ord.items) ? ord.items.length : 0;
        if (itemsCount === 0) return true;
        let arr = ord ? ord.checkedItems : null;
        if (!Array.isArray(arr)) return false;
        for (let i = 0; i < itemsCount; i++) {
            if (!arr[i]) return false;
        }
        return true;
    }

    function toggleItemCheck(orderId, itemIndex, checkboxEl) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord) return;
        let itemsCount = ord.items ? ord.items.length : 0;

        let checkedArr = Array.isArray(ord.checkedItems) ? ord.checkedItems.slice() : [];
        while (checkedArr.length < itemsCount) checkedArr.push(false);
        checkedArr[itemIndex] = checkboxEl.checked;
        ord.checkedItems = checkedArr; // تحديث فوري بالنسخة المحلية عشان الواجهة تتفاعل بدون انتظار الشبكة

        // تحديث فوري بالشكل (بدون انتظار حفظ قاعدة البيانات)
        let row = checkboxEl.closest('.product-item-row');
        if (row) row.classList.toggle('item-checked', checkboxEl.checked);

        let allChecked = isOrderFullyChecked(ord);
        let btn = document.getElementById(`readyBtn_${orderId}`);
        let hint = document.getElementById(`readyHint_${orderId}`);
        if (btn) btn.disabled = !allChecked;
        if (hint) hint.style.display = allChecked ? 'none' : 'block';

        // حفظ الحالة بقاعدة البيانات بالخلفية، تضمن استمرارها حتى لو تحدثت الصفحة أو فتحتها من جهاز ثاني
        window.updateDoc(window.doc(window.db, "orders", orderId), { checkedItems: checkedArr })
            .catch(e => console.log('تعذر حفظ حالة التعليم بقاعدة البيانات:', e));
    }

    // ===================== إشعارات SMS للزبون عند كل تحديث بحالة طلبيته =====================
    // ⚠️ لازم تستبدل هالرابط بنفس رابط دالة phoneOtp اللي نشرتها من Google Cloud Console
    const NOTIFY_FUNCTION_URL = 'https://REGION-PROJECT_ID.cloudfunctions.net/phoneOtp';

    async function sendOrderNotification(phone, message) {
        if (!phone) return;
        try {
            await fetch(NOTIFY_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'notify', phone, message })
            });
        } catch(e) {
            console.log('تعذر إرسال إشعار SMS للزبون:', e);
        }
    }

    function getOrderLabelFor(ord) {
        return (ord && ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : '';
    }

    async function startPreparingOrder(orderId) {
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), {
                status: "قيد التحضير"
            });
            let ord = currentOrdersList.find(o => o.id === orderId);
            if (ord) {
                sendOrderNotification(ord.customerPhone, `🍳 طلبك ${getOrderLabelFor(ord)} قيد التحضير الآن! - العروبة أونلاين`);
            }
        } catch(e) {
            console.error(e);
            alert("خطأ أثناء تحديث حالة الطلب.");
        }
    }

    async function markOrderReady(orderId) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!isOrderFullyChecked(ord)) {
            alert("لازم تعلّم (تشطب) كل المنتجات كمجهّزة أولاً قبل ما ترسل الطلب للسائق ✅");
            return;
        }

        if(confirm("هل أنت متأكد من أن الطلب جاهز للتوصيل؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "جاهز للتوصيل"
                });
                sendOrderNotification(ord.customerPhone, `📦 طلبك ${getOrderLabelFor(ord)} جاهز، وبانتظار السائق - وصوله قريب! - العروبة أونلاين`);
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }

    // ===================== طباعة فاتورة تحضير للطلب =====================
    function printOrder(orderId) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord) return;

        let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : orderId;
        let notesVal = ord.notes || ord.orderNotes || ord.customerNotes || '';

        let itemsRows = '';
        if (ord.items && Array.isArray(ord.items)) {
            ord.items.forEach(item => {
                itemsRows += `
                    <tr>
                        <td style="padding:4px 6px; border-bottom:1px solid #ddd;">${item.name || item.productName || 'منتج'}</td>
                        <td style="padding:4px 6px; border-bottom:1px solid #ddd; text-align:center;">${item.qty || item.quantity || 1}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('printArea').innerHTML = `
            <div style="font-family: 'Cairo', sans-serif; direction: rtl; padding: 15px; max-width: 400px; margin: 0 auto;">
                <h2 style="text-align: center; margin-bottom: 4px;">🍳 العروبة أونلاين</h2>
                <p style="text-align: center; margin-bottom: 12px; color: #555;">فاتورة تحضير الطلب</p>
                <hr>
                <p><strong>رقم الطلبية:</strong> ${orderLabel}</p>
                <p><strong>الزبون:</strong> ${ord.customerName || ord.clientName || 'زبون'}</p>
                <p><strong>الهاتف:</strong> ${ord.customerPhone || ord.phone || ''}</p>
                <p><strong>العنوان:</strong> ${ord.customerAddress || ord.address || ''}</p>
                <p><strong>وقت الطلب:</strong> <span dir="ltr">${formatOrderTime(ord)}</span></p>
                ${notesVal ? `<p><strong>ملاحظة الزبون:</strong> ${notesVal}</p>` : ''}
                <hr style="margin: 10px 0;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="text-align: right; padding: 4px 6px; border-bottom: 2px solid #000;">المنتج</th>
                            <th style="text-align: center; padding: 4px 6px; border-bottom: 2px solid #000;">الكمية</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>
                <h3 style="text-align: left; margin-top: 14px;">الإجمالي: ${ord.total || 0} ₪</h3>
            </div>
        `;
        window.print();
    }

</script>
</body>
</html>
