<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; border: 1px solid #e5e7eb; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid #cbd5e1; }
        
        .order-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 0.75rem; transition: background .3s, border-color .3s; }
        .order-card.order-warning { background: #fffbeb; border-color: #f59e0b; }
        .order-card.order-urgent { background: #fef2f2; border-color: #dc2626; animation: pulse-urgent 1.6s infinite; }
        @keyframes pulse-urgent {
            0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.35); }
            70% { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
            100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
        }
        .order-elapsed { font-weight: 700; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px; font-size: 0.8rem; }
        
        .order-info { margin-bottom: 8px; color: #333; }
        .order-info p { margin: 3px 0; }
        .order-time { background: #fef3c7; color: #b45309; padding: 5px 10px; border-radius: 6px; display: inline-block; font-weight: bold; margin-top: 6px; font-size: 0.75rem; border: 1px solid #fde68a; }
        .prep-time-chip { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 6px; display: inline-block; font-weight: bold; margin-top: 6px; margin-inline-start: 6px; font-size: 0.75rem; border: 1px solid #bae6fd; }
        .order-notes { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 7px 10px; margin-top: 6px; font-weight: 700; font-size: 0.75rem; }
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-inline-start: 6px; }
        .status-badge.status-new { background: #dbeafe; color: #1e40af; }
        .status-badge.status-preparing { background: #fef3c7; color: #92400e; }
        .btn-secondary-action { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px; }
        .btn-secondary-action:hover { background: #2563eb; }
        .btn-prepare-action { background: #f59e0b; }
        .btn-prepare-action:hover { background: #d97706; }

        #printArea { display: none; }
        @media print {
            body > *:not(#printArea) { display: none !important; }
            #printArea { display: block !important; }
        }

        .products-section { margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 8px; }
        .section-label { font-weight: bold; margin-bottom: 6px; color: #4b5563; font-size: 0.75rem; }
        
        .product-item-row { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; margin-bottom: 6px; transition: background .2s ease, border-color .2s ease; }
        .item-edit-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .item-mini-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 6px; font-size: 0.72rem; cursor: pointer; line-height: 1; }
        .item-mini-btn-danger { background: #fee2e2; border-color: #fecaca; }
        .item-check-box { width: 22px; height: 22px; accent-color: var(--accent-green); cursor: pointer; flex-shrink: 0; }
        .product-item-row.item-checked { background: #f0fdf4; border-color: #bbf7d0; }
        .product-item-row.item-checked .product-name,
        .product-item-row.item-checked .product-qty { text-decoration: line-through; color: #9ca3af; }
        .btn-action:disabled { opacity: 0.45; cursor: not-allowed; }
        .ready-hint { font-size: 0.65rem; color: #b45309; font-weight: 700; text-align: center; margin-top: 4px; }
        
        .product-thumb { width: 45px; height: 45px; min-width: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; transition: opacity 0.2s; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden; }
        .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .product-thumb:hover { opacity: 0.85; }

        .product-details { display: flex; flex-direction: column; }
        .product-name { font-weight: 600; color: #1f2937; font-size: 0.75rem; }
        .product-qty { font-size: 0.7rem; color: #6b7280; }
        .product-price { color: #16a34a; font-weight: 700; }
        .item-checked .product-price { color: #9ca3af; }

        .btn-action { background: var(--accent-green); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-action:hover { background: #558b2f; }

        /* نافذة تكبير الصورة (Modal) */
        .image-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; }
        .image-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; border: 2px solid white; object-fit: contain; }
        .image-modal.active { display: flex; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, where, getDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
        import { getFunctions, httpsCallableFromURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const functionsInstance = getFunctions(app, "europe-west1");
        // بدّلها لو رابط الفنكشن الفعلي بعد النشر مختلف
        const REGISTER_PUSH_TOKEN_URL = "https://register-push-token-880642361344.europe-west1.run.app";
        // ⚠️ لسا لازم تحطه: مفتاح Web Push (VAPID) من Firebase Console -> Project settings -> Cloud Messaging
        const VAPID_KEY = "PASTE_YOUR_VAPID_KEY_HERE";

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;

        // ===================== بوابة تسجيل الدخول (Firebase Authentication) =====================
        let appBooted = false;

        window.staffLogin = async function() {
            const email = document.getElementById('authGateEmail').value.trim();
            const password = document.getElementById('authGatePassword').value;
            const errEl = document.getElementById('authGateError');
            const btn = document.getElementById('authGateSubmitBtn');
            errEl.innerText = '';

            if (!email || !password) {
                errEl.innerText = 'الرجاء تعبئة البريد الإلكتروني وكلمة المرور';
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ جاري الدخول...';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                console.error(e);
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    errEl.innerText = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else if (e.code === 'auth/too-many-requests') {
                    errEl.innerText = '❌ محاولات كتيرة، حاول بعد شوي';
                } else {
                    errEl.innerText = '❌ تعذر تسجيل الدخول: ' + (e.message || e);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = 'دخول';
            }
        };

        window.staffLogout = function() {
            signOut(auth);
        };

        // ===================== إشعارات Push (توصل حتى لو المتصفح مسكّر) =====================
        async function setupPushNotifications() {
            try {
                if (!('serviceWorker' in navigator) || !('Notification' in window)) return;
                if (VAPID_KEY === 'PASTE_YOUR_VAPID_KEY_HERE') {
                    console.log('إشعارات Push: لسا ما تحط مفتاح VAPID.');
                    return;
                }

                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;

                const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                const messaging = getMessaging(app);
                const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
                if (!token) return;

                const registerPushToken = httpsCallableFromURL(functionsInstance, REGISTER_PUSH_TOKEN_URL);
                await registerPushToken({ token });
                console.log('✅ تم تفعيل إشعارات Push لهاد الجهاز');
            } catch (e) {
                console.error('تعذر تفعيل إشعارات Push:', e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            const gate = document.getElementById('authGateScreen');
            const errEl = document.getElementById('authGateError');
            if (user) {
                try {
                    const roleSnap = await getDoc(doc(db, "staffRoles", user.email));
                    const roles = (roleSnap.exists() && Array.isArray(roleSnap.data().roles)) ? roleSnap.data().roles : [];
                    const allowed = roles.includes('admin') || roles.includes('kitchen');
                    if (!allowed) {
                        if (errEl) errEl.innerText = '❌ ما عندك صلاحية توصل لهاي الصفحة - تواصل مع الإدارة';
                        await signOut(auth);
                        return;
                    }
                } catch (e) {
                    console.error(e);
                    if (errEl) errEl.innerText = '❌ تعذر التحقق من الصلاحية، حاول مرة أخرى';
                    await signOut(auth);
                    return;
                }
                if (gate) gate.style.display = 'none';
                if (!appBooted) {
                    appBooted = true;
                    window.dispatchEvent(new Event('firebase-ready'));
                }
                setupPushNotifications(); // ما بنوقف الصفحة لو فشلت - إشعار إضافي مو أساسي
            } else {
                appBooted = false;
                if (gate) gate.style.display = 'flex';
            }
        });
    </script>
</head>

<script>
    let currentOrdersList = [];
    let knownActiveOrderIds = new Set();
    let isFirstSnapshot = true;
    let soundUnlocked = false;
    let catalogProducts = [];
    let bundlesList = [];
    let spendOffersList = [];

    window.addEventListener('firebase-ready', function() {
        initKitchenOrdersListener();
        loadCatalogProducts();
        loadBundlesAndSpendOffers();
    });

    async function loadCatalogProducts() {
        try {
            const snap = await window.getDocs(window.collection(window.db, "products"));
            catalogProducts = [];
            snap.forEach(docSnap => catalogProducts.push({ id: docSnap.id, ...docSnap.data() }));
        } catch(e) {
            console.error('تعذر تحميل كتالوج المنتجات (خاصية الاستبدال قد لا تعمل):', e);
        }
    }

    // عروض الحزمة وعروض "اشتري واحصل على خصم" - حتى لما نضيف منتج نسيه الزبون من المطبخ، نقدر نطبّق
    // نفس أسعار العروض المفعّلة (مو بس السعر العادي)، بنفس منطق المتجر والـ Cloud Function بالضبط
    function loadBundlesAndSpendOffers() {
        window.onSnapshot(window.collection(window.db, "bundles"), (snap) => {
            bundlesList = [];
            snap.forEach(docSnap => {
                let b = docSnap.data();
                if (b.active) bundlesList.push({ id: docSnap.id, ...b });
            });
        });
        window.onSnapshot(window.doc(window.db, "settings", "spendOffers"), (docSnap) => {
            spendOffersList = (docSnap.exists() && Array.isArray(docSnap.data().offers)) ? docSnap.data().offers : [];
        });
    }

    // نجيب أحدث نسخة من الحزم وعروض الشراء مباشرة (بدل ما نعتمد بس على onSnapshot يلي ممكن ما يكون
    // وصل لأول تحديث له بعد لو الموظف فتح الصفحة وضاف منتج بسرعة) - نستخدمها قبل أي حساب سعر مباشرة
    async function ensureFreshBundlesAndSpendOffers() {
        try {
            const [bundlesSnap, spendOffersDoc] = await Promise.all([
                window.getDocs(window.collection(window.db, "bundles")),
                window.getDoc(window.doc(window.db, "settings", "spendOffers"))
            ]);
            let freshBundles = [];
            bundlesSnap.forEach(docSnap => {
                let b = docSnap.data();
                if (b.active) freshBundles.push({ id: docSnap.id, ...b });
            });
            bundlesList = freshBundles;
            spendOffersList = (spendOffersDoc.exists() && Array.isArray(spendOffersDoc.data().offers)) ? spendOffersDoc.data().offers : [];
        } catch(e) {
            console.error('تعذر تحديث بيانات العروض قبل الحساب:', e);
        }
    }

    // ===================== نفس منطق تسعير العروض المستخدم بالمتجر والـ Cloud Function بالضبط، =====================
    // ===================== بس مطبّق هون على منتجات طلبية معينة بدل السلة =====================
    function getEffectiveCatalogPrice(product) {
        let hasSale = product.salePrice !== undefined && product.salePrice !== null && product.salePrice !== '';
        return hasSale ? Number(product.salePrice) : Number(product.price) || 0;
    }

    function parseBundlePriceKitchen(bundle) {
        return Number(String(bundle.priceText || "0").replace(",", ".")) || 0;
    }

    function getBundleParticipatingProductsKitchen(bundle) {
        if (bundle.selectedItems && bundle.selectedItems.length > 0) {
            return catalogProducts.filter(p => bundle.selectedItems.includes(p.name));
        }
        return catalogProducts;
    }

    function findBundleForProductKitchen(product) {
        if (!bundlesList || bundlesList.length === 0) return null;
        return bundlesList.find(b => {
            if (!b.selectedItems || b.selectedItems.length === 0) return true;
            return b.selectedItems.includes(product.name);
        }) || null;
    }

    // توزيع خصم الحزمة على القطع الفعلية بالطلبية (نفس منطق computeBundleUnitAllocation بالمتصفح/السيرفر)
    function computeBundleUnitAllocationKitchen(bundle, orderItems) {
        let qtyNeeded = Number(bundle.qty) || 0;
        let bundlePrice = parseBundlePriceKitchen(bundle);
        let participating = getBundleParticipatingProductsKitchen(bundle);

        let units = [];
        participating.forEach(p => {
            let it = orderItems.find(oi => oi.id === p.id && !oi.unavailable);
            let qty = it ? Number(it.quantity || it.qty || 0) : 0;
            let price = getEffectiveCatalogPrice(p);
            for (let i = 0; i < qty; i++) units.push({ productId: p.id, price });
        });

        let totalSelected = units.length;
        if (qtyNeeded <= 0 || totalSelected === 0) return { qtyNeeded, bundlePrice, sets: 0, perProduct: {} };

        let sortedUnits = units.slice().sort((a, c) => c.price - a.price);
        let sets = Math.floor(totalSelected / qtyNeeded);
        let discountedCountTotal = sets * qtyNeeded;

        let perProduct = {};
        sortedUnits.forEach((u, idx) => {
            if (!perProduct[u.productId]) perProduct[u.productId] = { discountedQty: 0, remainderQty: 0 };
            if (idx < discountedCountTotal) perProduct[u.productId].discountedQty++;
            else perProduct[u.productId].remainderQty++;
        });

        return { qtyNeeded, bundlePrice, sets, perProduct };
    }

    // ترتيب عروض الشراء حسب ترتيب إضافتهم الفعلي للطلبية (نفس منطق المتجر بالضبط) - عروض منتجات مش
    // موجودة بالطلبية ما بتاخد "حصة" ولا بتأثر على غيرها
    function getActiveSpendOffersInOrderItems(orderItems) {
        let offersByProductId = new Map();
        (spendOffersList || []).forEach(o => {
            if (o.active && o.productId && o.threshold) offersByProductId.set(o.productId, o);
        });
        let ordered = [];
        orderItems.forEach(it => {
            if (it.unavailable) return;
            let offer = offersByProductId.get(it.id);
            if (offer && !ordered.includes(offer)) ordered.push(offer);
        });
        return ordered;
    }

    function getSpendOfferCumulativeThresholdKitchen(offer, orderItems) {
        let inCartOrdered = getActiveSpendOffersInOrderItems(orderItems);
        let cum = 0;
        for (let i = 0; i < inCartOrdered.length; i++) {
            cum += Number(inCartOrdered[i].threshold) || 0;
            if (inCartOrdered[i] === offer) return cum;
        }
        let alreadyCommitted = inCartOrdered.reduce((sum, o) => sum + (Number(o.threshold) || 0), 0);
        return alreadyCommitted + (Number(offer.threshold) || 0);
    }

    function getSpendOffersAdjustedSubtotalKitchen(orderItems) {
        let baseSubtotal = 0;
        orderItems.forEach(it => {
            if (it.unavailable) return;
            let p = catalogProducts.find(cp => cp.id === it.id);
            let rawPrice = p ? getEffectiveCatalogPrice(p) : (Number(it.price) || 0);
            baseSubtotal += rawPrice * (Number(it.quantity || it.qty) || 0);
        });
        let excluded = 0;
        getActiveSpendOffersInOrderItems(orderItems).forEach(o => {
            let it = orderItems.find(oi => oi.id === o.productId && !oi.unavailable);
            let p = it ? catalogProducts.find(cp => cp.id === it.id) : null;
            if (it && p) excluded += getEffectiveCatalogPrice(p);
        });
        return baseSubtotal - excluded;
    }

    // بيرجع السعر الصافي الصحيح (بعد أي خصم حزمة/عرض شراء) لمنتج معيّن ضمن قائمة منتجات طلبية معينة -
    // نفس منطق getEffectiveLineInfo بالمتصفح بالضبط، بس معتمد على orderItems بدل السلة
    function computeEffectivePriceForOrderItem(productId, orderItems) {
        let product = catalogProducts.find(p => p.id === productId);
        if (!product) return null;
        let it = orderItems.find(oi => oi.id === productId && !oi.unavailable);
        let quantity = it ? Number(it.quantity || it.qty || 1) : 1;
        let basePrice = getEffectiveCatalogPrice(product);

        let matchedBundle = findBundleForProductKitchen(product);
        if (matchedBundle) {
            let allocation = computeBundleUnitAllocationKitchen(matchedBundle, orderItems);
            let alloc = allocation.perProduct[productId];
            if (alloc && alloc.discountedQty > 0) {
                let perUnitDiscountedPrice = allocation.bundlePrice / allocation.qtyNeeded;
                let discountedQty = Math.min(alloc.discountedQty, quantity);
                let remainderQty = quantity - discountedQty;
                let lineTotal = discountedQty * perUnitDiscountedPrice + remainderQty * basePrice;
                return { unitPrice: lineTotal / quantity, bundleName: matchedBundle.name };
            }
        }

        let matchedOffer = (spendOffersList || []).find(o => o.active && o.productId === productId && o.threshold);
        if (matchedOffer) {
            let required = getSpendOfferCumulativeThresholdKitchen(matchedOffer, orderItems);
            let adjustedSubtotal = getSpendOffersAdjustedSubtotalKitchen(orderItems);
            if (adjustedSubtotal >= required) {
                let discountedQty = Math.min(1, quantity);
                let remainderQty = quantity - discountedQty;
                let lineTotal = discountedQty * Number(matchedOffer.discountedPrice) + remainderQty * basePrice;
                return { unitPrice: lineTotal / quantity, spendOfferName: product.name };
            }
        }

        return { unitPrice: basePrice };
    }

    // بعد أي إضافة/تعديل، منعيد حساب سعر **كل** منتجات الطلبية (مش بس المنتج المضاف) لأنه إضافة قطعة
    // جديدة ممكن تغيّر توزيع خصم الحزمة على باقي القطع (مثلاً تكمّل مجموعة جديدة مخفّضة)
    function recomputeAllItemPricesWithPromos(orderItems) {
        return orderItems.map(it => {
            if (it.unavailable) return it;
            let effective = computeEffectivePriceForOrderItem(it.id, orderItems);
            if (!effective) return it; // منتج مش موجود بالكتالوج (نادر) - نسيبه متل ما هو
            return { ...it, price: Number(effective.unitPrice.toFixed(2)) };
        });
    }

    function initKitchenOrdersListener() {
        // نجيب فقط الطلبات الجديدة/قيد التحضير من قاعدة البيانات مباشرة
        // بدل ما نحمّل كل تاريخ الطلبات كل مرة (هذا كان يبطّئ الشاشة مع تراكم الطلبات)
        const activeQuery = window.query(
            window.collection(window.db, "orders"),
            window.where("status", "in", ["جديد", "new", "قيد التحضير"])
        );
        window.onSnapshot(activeQuery, (snapshot) => {
            let allOrders = [];
            snapshot.forEach(docSnap => {
                allOrders.push({ id: docSnap.id, ...docSnap.data() });
            });
            currentOrdersList = allOrders;

            let activeOrders = allOrders.filter(o => !o.status || o.status === "جديد" || o.status === "new" || o.status === "قيد التحضير");
            let currentIds = new Set(activeOrders.map(o => o.id));

            if (!isFirstSnapshot) {
                let hasNewOrder = activeOrders.some(o => !knownActiveOrderIds.has(o.id));
                if (hasNewOrder) showNewOrderAlert();
            }
            isFirstSnapshot = false;
            knownActiveOrderIds = currentIds;

            renderKitchenOrders(allOrders);
        });
    }

    // ===================== تنبيه صوتي عند وصول طلب جديد =====================
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch(e) {
            console.log('تعذر تفعيل قفل الشاشة (منع الإغلاق التلقائي):', e);
        }
    }

    // نعيد طلب قفل الشاشة لو الجهاز رجع من وضع الخلفية (النظام يلغيه تلقائيًا لما الشاشة تختفي)
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    function unlockSound() {
        soundUnlocked = true;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        } catch(e) {}
        requestWakeLock(); // نمنع الشاشة تنطفي أو تنام لحد ما الموظف يقفلها بنفسه، عشان ما يفوته أي طلب جديد
        let btn = document.getElementById('unlockSoundBtn');
        if (btn) {
            btn.innerText = '🔔 التنبيه الصوتي مفعّل ✅';
            btn.disabled = true;
            btn.style.opacity = '0.6';
        }
    }

    function playNewOrderSound() {
        if (!soundUnlocked) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const playBeep = (startTime, freq) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.4);
            };
            const now = ctx.currentTime;
            playBeep(now, 880);
            playBeep(now + 0.25, 1046);
        } catch(e) { console.log('تعذر تشغيل صوت التنبيه:', e); }
    }

    // ===================== تنبيه بصري كبير يتكرر لحد ما الموظف يلاحظه ويقفله يدويًا =====================
    let alertRepeatInterval = null;

    function showNewOrderAlert() {
        playNewOrderSound();
        if (alertRepeatInterval) clearInterval(alertRepeatInterval);
        alertRepeatInterval = setInterval(playNewOrderSound, 3000);

        let banner = document.getElementById('newOrderBanner');
        if (banner) banner.style.display = 'flex';
    }

    function dismissNewOrderAlert() {
        if (alertRepeatInterval) {
            clearInterval(alertRepeatInterval);
            alertRepeatInterval = null;
        }
        let banner = document.getElementById('newOrderBanner');
        if (banner) banner.style.display = 'none';
    }

    function formatOrderTime(ord) {
        let timeVal = ord.createdAt || ord.time || ord.timestamp || ord.date || ord.orderTime;
        if (!timeVal) return 'الوقت غير مسجل';
        
        let date;
        if (typeof timeVal === 'object' && timeVal.seconds) {
            date = new Date(timeVal.seconds * 1000);
        } else {
            date = new Date(timeVal);
        }
        
        if (isNaN(date.getTime())) {
            return timeVal;
        }
        
        let timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        let dateStr = date.toLocaleDateString('en-GB');
        return `${timeStr} | ${dateStr}`;
    }

    // يرجع وقت الطلب بالميلي ثانية لحساب "الوقت الحي المنقضي" وتلوين الطلبات المتأخرة
    function getOrderTimestampMillis(ord) {
        let timeVal = ord.createdAt || ord.time || ord.timestamp || ord.date || ord.orderTime;
        if (!timeVal) return null;
        let date;
        if (typeof timeVal === 'object' && timeVal.seconds) {
            date = new Date(timeVal.seconds * 1000);
        } else {
            date = new Date(timeVal);
        }
        if (isNaN(date.getTime())) return null;
        return date.getTime();
    }

    // يحدّث "منذ كم دقيقة" لكل الطلبات المعروضة حياً، ويلوّن البطاقة حسب مدة الانتظار
    function tickElapsedTimes() {
        document.querySelectorAll('.order-elapsed').forEach(el => {
            let ts = Number(el.getAttribute('data-ts'));
            let card = el.closest('.order-card');
            if (!ts) { el.innerText = ''; return; }

            let diffMin = Math.floor((Date.now() - ts) / 60000);
            el.innerText = diffMin <= 0 ? '(الآن)' : `(منذ ${diffMin} دقيقة)`;

            if (card) {
                card.classList.remove('order-warning', 'order-urgent');
                if (diffMin >= 30) card.classList.add('order-urgent');
                else if (diffMin >= 15) card.classList.add('order-warning');
            }
        });
    }
    setInterval(tickElapsedTimes, 20000);


    function renderKitchenOrders(orders) {
        const container = document.getElementById('kitchenOrdersContainer');
        if(!container) return;
        
        let activeOrders = orders.filter(o => !o.status || o.status === "جديد" || o.status === "new" || o.status === "قيد التحضير");

        // ترتيب الطلبات: الأقدم أولاً (أعلى القائمة) عشان ما يتنسى ولا طلب
        activeOrders.sort((a, b) => {
            let ta = getOrderTimestampMillis(a);
            let tb = getOrderTimestampMillis(b);
            if (ta === null) return 1;
            if (tb === null) return -1;
            return ta - tb;
        });

        if(activeOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات جديدة حالياً ✨</p>';
            return;
        }

        container.innerHTML = '';
        activeOrders.forEach((ord, index) => {
            let itemsHtml = '';
            let totalQty = 0;
            let itemsCount = (ord.items && Array.isArray(ord.items)) ? ord.items.length : 0;
            if(ord.items && Array.isArray(ord.items)) {
                ord.items.forEach((item, itemIdx) => {
                    let imgSrc = item.image || item.img || item.imageUrl || item.photo || item.productImage || (item.product && (item.product.image || item.product.img)) || "";
                    let qty = Number(item.qty || item.quantity || 1);
                    let isUnavailable = !!item.unavailable;
                    if (!isUnavailable) totalQty += qty;

                    let imageElement = '';
                    if(imgSrc) {
                        imageElement = `<div class="product-thumb" onclick="openImageModal('${imgSrc}')"><img src="${imgSrc}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='🛒';"></div>`;
                    } else {
                        imageElement = `<div class="product-thumb">🛒</div>`;
                    }

                    let isChecked = Array.isArray(ord.checkedItems) && ord.checkedItems[itemIdx] === true;

                    let priceHtml = isUnavailable
                        ? `<span style="color:#dc2626; font-weight:800;">🚫 نفذت الكمية - ما بتحسب بالمجموع</span>`
                        : `<span class="product-price">${(Number(item.price) || 0).toFixed(2)} ₪ × ${qty} = ${((Number(item.price) || 0) * qty).toFixed(2)} ₪</span>`;
                    let addedBadge = (item.addedByStaff && !isUnavailable) ? `<span style="background:#dcfce7; color:#166534; font-size:0.6rem; font-weight:800; padding:1px 6px; border-radius:6px; margin-right:4px;">➕ أضيف لاحقاً</span>` : '';

                    let actionsHtml = isUnavailable
                        ? `<button class="item-mini-btn" title="تراجع - رجّع المنتج للطلبية" onclick="restoreOrderItem('${ord.id}', ${itemIdx})">↩️</button>`
                        : `
                            <button class="item-mini-btn" title="تعديل الكمية" onclick="editOrderItemQty('${ord.id}', ${itemIdx})">✏️</button>
                            <button class="item-mini-btn" title="استبدال المنتج" onclick="openReplaceItemModal('${ord.id}', ${itemIdx})">🔄</button>
                            <button class="item-mini-btn item-mini-btn-danger" title="نفذت الكمية" onclick="markOrderItemUnavailable('${ord.id}', ${itemIdx})">🗑️</button>
                        `;

                    itemsHtml += `
                        <div class="product-item-row ${isChecked ? 'item-checked' : ''}" ${isUnavailable ? 'style="opacity:0.65; background:#fef2f2;"' : ''}>
                            <input type="checkbox" class="item-check-box" ${isChecked ? 'checked' : ''} ${isUnavailable ? 'disabled' : ''} onchange="toggleItemCheck('${ord.id}', ${itemIdx}, this)">
                            ${imageElement}
                            <div class="product-details">
                                <span class="product-name" ${isUnavailable ? 'style="text-decoration:line-through; color:#9ca3af;"' : ''}>${addedBadge}${item.name || item.productName || 'منتج'}</span>
                                <span class="product-qty" ${isUnavailable ? 'style="text-decoration:line-through;"' : ''}>الكمية: (${qty}) &nbsp;•&nbsp; ${priceHtml}</span>
                            </div>
                            <div class="item-edit-actions">
                                ${actionsHtml}
                            </div>
                        </div>
                    `;
                });
            }

            let orderTimeFormatted = formatOrderTime(ord);
            let orderTsMillis = getOrderTimestampMillis(ord);
            let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : `#${index + 1}`;

            let currentStatus = ord.status || "جديد";
            let statusBadgeHtml = currentStatus === 'قيد التحضير'
                ? `<span class="status-badge status-preparing">🔥 قيد التحضير</span>`
                : `<span class="status-badge status-new">🆕 جديد</span>`;

            let estimatedMinutes = 5 + (totalQty * 2);

            let notesVal = ord.notes || ord.orderNotes || ord.customerNotes || '';
            let notesHtml = notesVal ? `<div class="order-notes">📝 ملاحظة الزبون: ${notesVal}</div>` : '';

            let allChecked = isOrderFullyChecked(ord);
            let actionButtonHtml = currentStatus === 'قيد التحضير'
                ? `<button class="btn-action" id="readyBtn_${ord.id}" ${allChecked ? '' : 'disabled'} onclick="markOrderReady('${ord.id}')">✅ تم التحضير - جاهز للتوصيل</button>
                   <div class="ready-hint" id="readyHint_${ord.id}" style="${allChecked ? 'display:none;' : ''}">✅ علّم كل المنتجات (اشطبها) أولاً عشان تقدر ترسل الطلب للسائق</div>`
                : `<button class="btn-action btn-prepare-action" onclick="startPreparingOrder('${ord.id}')">🔥 بدء التحضير</button>`;

            let productsTotalForDisplay = (Number(ord.subtotal) || 0) - (Number(ord.bundleDiscount) || 0) - (Number(ord.discount) || 0);
            if (productsTotalForDisplay < 0) productsTotalForDisplay = 0;
            let deliveryFeeForDisplay = Number(ord.deliveryFee) || 0;

            let notifyRemovedItemsHtml = (ord.removedItemsLog && ord.removedItemsLog.length > 0)
                ? `<button class="btn-action" style="background:#25D366; margin-top:4px;" onclick="notifyCustomerRemovedItems('${ord.id}')">📤 إشعار الزبون بالمنتجات المحذوفة (${ord.removedItemsLog.length})</button>`
                : '';

            container.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span>طلب ${orderLabel} - ${ord.customerName || ord.clientName || 'زبون'} ${statusBadgeHtml}</span>
                        <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                    </div>
                    <div style="display:flex; gap:8px; margin: 4px 0 8px 0; flex-wrap: wrap;">
                        <span style="background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; font-size:0.68rem; font-weight:800; padding:3px 9px; border-radius:8px;">🛒 المنتجات: ${productsTotalForDisplay.toFixed(2)} ₪</span>
                        <span style="background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; font-size:0.68rem; font-weight:800; padding:3px 9px; border-radius:8px;">🚚 التوصيل: ${deliveryFeeForDisplay.toFixed(2)} ₪</span>
                    </div>
                    
                    <div class="order-info">
                        <p><strong>الهاتف:</strong> ${ord.customerPhone || ord.phone || ''}</p>
                        <p><strong>العنوان:</strong> ${ord.customerAddress || ord.address || ''}</p>
                        <div class="order-time">⏰ وقت الطلب: <span dir="ltr" style="display:inline-block;">${orderTimeFormatted}</span> <span class="order-elapsed" data-ts="${orderTsMillis || ''}"></span></div>
                        <span class="prep-time-chip">⏱️ الوقت المتوقع: ~${estimatedMinutes} د</span>
                        ${notesHtml}
                    </div>
                    
                    <div class="products-section">
                        <div class="section-label">المنتجات المطلوبة:</div>
                        ${itemsHtml}
                        <button class="btn-secondary-action" style="margin-top:8px; background:#f0fdf4; color:#166534; border-color:#bbf7d0;" onclick="openAddItemModal('${ord.id}')">➕ إضافة منتج نسيه الزبون</button>
                    </div>

                    ${notifyRemovedItemsHtml}
                    ${actionButtonHtml}
                    <button class="btn-secondary-action" onclick="printOrder('${ord.id}')">🖨️ طباعة فاتورة التحضير</button>
                    <button class="btn-secondary-action" style="background:#fee2e2; color:#991b1b; border-color:#fecaca;" onclick="cancelWholeOrder('${ord.id}')">❌ إلغاء الطلبية بالكامل</button>
                </div>
            `;
        });

        tickElapsedTimes();
    }

    function openImageModal(imageSrc) {
        if(!imageSrc) return;
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modalImg.src = imageSrc;
        modal.classList.add('active');
    }

    function closeImageModal() {
        const modal = document.getElementById('imageModal');
        modal.classList.remove('active');
    }

    // ===================== تتبّع تعليم المنتجات المجهّزة قبل إرسال الطلب للسائق (محفوظة بقاعدة البيانات) =====================
    function isOrderFullyChecked(ord) {
        let items = (ord && ord.items) ? ord.items : [];
        let arr = ord ? ord.checkedItems : null;
        for (let i = 0; i < items.length; i++) {
            if (items[i].unavailable) continue; // نفذت الكمية - مش لازم تتشيّك
            if (!Array.isArray(arr) || !arr[i]) return false;
        }
        return true;
    }

    function toggleItemCheck(orderId, itemIndex, checkboxEl) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord) return;
        let itemsCount = ord.items ? ord.items.length : 0;

        let checkedArr = Array.isArray(ord.checkedItems) ? ord.checkedItems.slice() : [];
        while (checkedArr.length < itemsCount) checkedArr.push(false);
        checkedArr[itemIndex] = checkboxEl.checked;
        ord.checkedItems = checkedArr; // تحديث فوري بالنسخة المحلية عشان الواجهة تتفاعل بدون انتظار الشبكة

        // تحديث فوري بالشكل (بدون انتظار حفظ قاعدة البيانات)
        let row = checkboxEl.closest('.product-item-row');
        if (row) row.classList.toggle('item-checked', checkboxEl.checked);

        let allChecked = isOrderFullyChecked(ord);
        let btn = document.getElementById(`readyBtn_${orderId}`);
        let hint = document.getElementById(`readyHint_${orderId}`);
        if (btn) btn.disabled = !allChecked;
        if (hint) hint.style.display = allChecked ? 'none' : 'block';

        // حفظ الحالة بقاعدة البيانات بالخلفية، تضمن استمرارها حتى لو تحدثت الصفحة أو فتحتها من جهاز ثاني
        window.updateDoc(window.doc(window.db, "orders", orderId), { checkedItems: checkedArr })
            .catch(e => console.log('تعذر حفظ حالة التعليم بقاعدة البيانات:', e));
    }

    // ===================== إشعارات SMS للزبون عند كل تحديث بحالة طلبيته =====================
    // ⚠️ لازم تستبدل هالرابط بنفس رابط دالة phoneOtp اللي نشرتها من Google Cloud Console
    const NOTIFY_FUNCTION_URL = 'https://REGION-PROJECT_ID.cloudfunctions.net/phoneOtp';

    async function sendOrderNotification(phone, message) {
        if (!phone) return;
        try {
            await fetch(NOTIFY_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'notify', phone, message })
            });
        } catch(e) {
            console.log('تعذر إرسال إشعار SMS للزبون:', e);
        }
    }

    function getOrderLabelFor(ord) {
        return (ord && ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : '';
    }

    // ===================== تعديل/حذف/استبدال منتجات الطلب =====================
    // نعيد حساب المجموع الكلي بعد أي تعديل على المنتجات. مهم: سعر كل صنف بمصفوفة items هو أصلاً السعر
    // "الصافي" بعد أي خصم عرض حزمة/شراء (مو السعر الخام) - انضاف هيك لما صار كل صنف يتحفظ بسعره الحقيقي
    // بعد الخصم مباشرة. يعني مجموع الأصناف (newSubtotal) هون أصلاً شامل الخصم جواته، فما لازم نطرح
    // bundleDiscount مرة تانية فوقه (كان في خطأ سابق هون بيطرحه مرتين ويطلّع مجموع أوطى من الصح).
    // الخصم الوحيد المنفصل يلي لازم نطرحه هو خصم الكوبون (discount) لأنه ما بينعكس بسعر الصنف نفسه.
    function recomputeOrderTotal(ord) {
        let newSubtotal = 0;
        (ord.items || []).forEach(it => {
            if (it.unavailable) return;
            newSubtotal += (Number(it.price) || 0) * (Number(it.quantity || it.qty) || 0);
        });
        let discount = Number(ord.discount) || 0; // خصم الكوبون بس - منفصل عن خصم الحزمة/الشراء (مدمج أصلاً بسعر الصنف)
        let deliveryFee = Number(ord.deliveryFee) || 0;
        let newTotal = newSubtotal - discount + deliveryFee;
        // نقرّب لخانتين عشريتين هون - جمع/طرح أسعار عشرية (زي 99.9، 25.9) بجافاسكريبت
        // بينتج أحيانًا أرقام زي 283.40000000000003 بدون هالتقريب
        return { subtotal: Number(newSubtotal.toFixed(2)), total: Number(Math.max(0, newTotal).toFixed(2)) };
    }

    async function saveOrderItemsUpdate(orderId, newItems, extraFields) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord) return;
        ord.items = newItems;
        const { subtotal, total } = recomputeOrderTotal(ord);
        ord.subtotal = subtotal;
        ord.total = total;
        // خلّينا bundleDiscount صفر من هون وطالع، لأنه صار مدمج جوا سعر كل صنف مباشرة (subtotal صار "صافي")
        // - أي مكان تاني بيحسب "subtotal - bundleDiscount - discount" (زي شارة 🛒 المنتجات بالأعلى) بيضل صحيح
        ord.bundleDiscount = 0;
        const fieldsToSave = { items: newItems, subtotal: subtotal, total: total, bundleDiscount: 0, ...(extraFields || {}) };
        Object.assign(ord, extraFields || {}); // نحدّث النسخة المحلية كمان (زي removedItemsLog) حتى تنعرض فوراً بدون انتظار الـ listener
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), fieldsToSave);
        } catch(e) {
            console.error(e);
            alert('تعذر حفظ التعديل: ' + (e.message || e));
        }
    }

    async function editOrderItemQty(orderId, itemIdx) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord || !ord.items || !ord.items[itemIdx]) return;
        const item = ord.items[itemIdx];
        const currentQty = Number(item.quantity || item.qty || 1);
        const input = prompt(`الكمية الجديدة لـ "${item.name || 'المنتج'}":`, currentQty);
        if (input === null) return;
        const newQty = parseInt(input);
        if (!newQty || newQty < 1) {
            alert('كمية غير صالحة');
            return;
        }
        let newItems = ord.items.map((it, i) => i === itemIdx ? { ...it, quantity: newQty, qty: newQty } : it);
        // تغيير الكمية ممكن يفعّل/يلغي عرض حزمة أو شراء لباقي منتجات الطلبية - منحدث بيانات العروض
        // لأحدث نسخة أول (تحسباً لو ما وصلت onSnapshot لسا) وبعدين نعيد حساب الكل
        await ensureFreshBundlesAndSpendOffers();
        newItems = recomputeAllItemPricesWithPromos(newItems);
        await saveOrderItemsUpdate(orderId, newItems);
    }

    // بدل ما نحذف المنتج من الطلبية نهائياً، منعلّمه "نفذت الكمية" ومنخليه ظاهر (مشطوب) بالطلبية -
    // حتى الموظف والزبون يفهموا إنه المنتج هذا نفذ ومش هيوصل، بدل ما يختفي بدون تفسير. ما بيندخل بالمجموع.
    async function markOrderItemUnavailable(orderId, itemIdx) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord || !ord.items || !ord.items[itemIdx]) return;
        const item = ord.items[itemIdx];
        if (!confirm(`تعليم "${item.name || 'المنتج'}" كـ"نفذت الكمية"؟ رح يضل ظاهر بالطلبية (مشطوب) بس ما رح يتحسب بالمجموع.`)) return;
        let newItems = ord.items.map((it, i) => i === itemIdx ? { ...it, unavailable: true } : it);
        // شيل هالمنتج ممكن يفكّ مجموعة عرض حزمة كانت كاملة، فباقي القطع لازم ترجع لسعرها العادي
        await ensureFreshBundlesAndSpendOffers();
        newItems = recomputeAllItemPricesWithPromos(newItems);
        const newRemovedLog = [...(ord.removedItemsLog || []), { name: item.name || 'منتج', price: Number(item.price) || 0, quantity: Number(item.quantity || item.qty) || 1 }];
        await saveOrderItemsUpdate(orderId, newItems, { removedItemsLog: newRemovedLog });
    }

    // تراجع عن "نفذت الكمية" - يرجّع المنتج يتحسب بالمجموع عادي (لو انعلّم غلط مثلاً)
    async function restoreOrderItem(orderId, itemIdx) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord || !ord.items || !ord.items[itemIdx]) return;
        let newItems = ord.items.map((it, i) => i === itemIdx ? { ...it, unavailable: false } : it);
        await ensureFreshBundlesAndSpendOffers();
        newItems = recomputeAllItemPricesWithPromos(newItems);
        await saveOrderItemsUpdate(orderId, newItems);
    }

    // ===================== إشعار الزبون بالمنتجات المحذوفة (رسالة واحدة تجمع كل المنتجات المحذوفة من هاي الطلبية) =====================
    function buildRemovedItemsWhatsAppMessage(ord) {
        const orderLabel = getOrderLabelFor(ord) || '';
        const itemsList = (ord.removedItemsLog || []).map(it => `• ${it.name}`).join('\n');
        const count = (ord.removedItemsLog || []).length;
        const intro = count > 1 ? 'فيها منتجات نفذت عندنا حاليًا' : 'فيها منتج نفذ عندنا حاليًا';
        const pronoun = count > 1 ? 'نشيلهم' : 'نشيله';
        const pronoun2 = count > 1 ? 'سعرهم' : 'سعره';
        return `مرحبا! معك متجر العروبة أونلاين 🙏\n\nبدنا نعتذر، طلبيتك رقم ${orderLabel} ${intro}:\n${itemsList}\n\nراح ${pronoun} من طلبيتك، وطبعاً راح ينزل ${pronoun2} من المجموع الكلي لطلبيتك - ما راح تدفع فلس زيادة على إشي ما وصلك.\n\nبقية الطلبية راح توصلك عادي زي المتفق عليه. آسفين على الإزعاج 🙌`;
    }

    async function notifyCustomerRemovedItems(orderId) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord || !ord.removedItemsLog || ord.removedItemsLog.length === 0) return;

        const phoneRaw = (ord.customerPhone || ord.phone || '').replace(/[^0-9]/g, '');
        if (!phoneRaw) {
            alert('ما في رقم هاتف مسجّل بهاي الطلبية.');
            return;
        }
        const waPhone = phoneRaw.startsWith('0') ? '972' + phoneRaw.slice(1) : phoneRaw;
        const message = buildRemovedItemsWhatsAppMessage(ord);
        window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(message)}`, '_blank');

        // نفضّي القائمة بعد ما يبعتها، حتى الزر يختفي لغاية ما ينحذف منتج جديد لاحقاً
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), { removedItemsLog: [] });
            ord.removedItemsLog = [];
            renderKitchenOrders(currentOrdersList);
        } catch(e) {
            console.error(e);
        }
    }

    // ===================== استبدال منتج =====================
    let replaceItemContext = { orderId: null, itemIdx: null };

    function openReplaceItemModal(orderId, itemIdx) {
        replaceItemContext = { orderId, itemIdx };
        document.getElementById('replaceItemSearchInput').value = '';
        renderReplaceItemResults('');
        document.getElementById('replaceItemModal').style.display = 'flex';
    }

    function closeReplaceItemModal() {
        document.getElementById('replaceItemModal').style.display = 'none';
    }

    function renderReplaceItemResults(query) {
        const container = document.getElementById('replaceItemResultsContainer');
        let list = catalogProducts.slice();
        if (query) list = list.filter(p => (p.name || '').includes(query));
        list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        list = list.slice(0, 30);

        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888; font-size:0.75rem; padding:15px;">لا يوجد منتج مطابق</p>';
            return;
        }

        container.innerHTML = list.map(p => {
            let price = (p.salePrice !== undefined && p.salePrice !== null && p.salePrice !== '') ? p.salePrice : p.price;
            return `
                <div style="display:flex; align-items:center; gap:8px; padding:7px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:5px; cursor:pointer;" onclick="confirmReplaceItem('${p.id}')">
                    <img src="${p.img || ''}" style="width:34px; height:34px; object-fit:contain; border-radius:6px; flex-shrink:0; background:white;" onerror="this.style.display='none'">
                    <span style="flex:1; font-size:0.75rem; font-weight:700;">${p.name}</span>
                    <span style="font-size:0.7rem; color:#16a34a; font-weight:800; flex-shrink:0;">${price || 0} ₪</span>
                </div>
            `;
        }).join('');
    }

    async function confirmReplaceItem(newProductId) {
        const { orderId, itemIdx } = replaceItemContext;
        const ord = currentOrdersList.find(o => o.id === orderId);
        const newProduct = catalogProducts.find(p => p.id === newProductId);
        if (!ord || !ord.items || !ord.items[itemIdx] || !newProduct) return;

        const oldItem = ord.items[itemIdx];
        const oldQty = Number(oldItem.quantity || oldItem.qty || 1);
        const oldPrice = Number(oldItem.price) || 0; // ممكن يكون سعر مخفّض ضمن عرض حزمة/شراء - هاد هو الافتراضي الآمن
        const newProductOwnPrice = (newProduct.salePrice !== undefined && newProduct.salePrice !== null && newProduct.salePrice !== '') ? Number(newProduct.salePrice) : Number(newProduct.price) || 0;

        // الافتراضي هو سعر المنتج القديم (يحافظ على أي خصم/عرض كان محسوب)، بس تقدر تعدّله يدوياً هون كاحتياط
        // لو الحالة مختلفة (مثلاً المنتج البديل أغلى فعلاً وبدك تحسب فرق، أو أي سبب تاني)
        let promptMsg = `سعر "${newProduct.name}" لكل قطعة:`;
        if (Math.abs(newProductOwnPrice - oldPrice) > 0.01) {
            promptMsg = `سعر المنتج البديل الأصلي ${newProductOwnPrice.toFixed(2)}₪، والمنتج القديم كان محسوب بـ${oldPrice.toFixed(2)}₪ (ممكن ضمن عرض). عدّل السعر هون لو بدك، أو سيبه متل ما هو:`;
        }
        const priceInput = prompt(promptMsg, oldPrice.toFixed(2));
        if (priceInput === null) return; // ألغى الاستبدال
        const finalPrice = parseFloat(priceInput);
        if (isNaN(finalPrice) || finalPrice < 0) {
            alert('سعر غير صالح');
            return;
        }

        const newItems = ord.items.map((it, i) => i === itemIdx ? {
            id: newProduct.id,
            name: newProduct.name,
            img: newProduct.img || '',
            price: finalPrice,
            quantity: oldQty,
            qty: oldQty
        } : it);

        closeReplaceItemModal();
        await saveOrderItemsUpdate(orderId, newItems);
    }

    // ===================== إضافة منتج نسيه الزبون (يضيفه الموظف من المطبخ للطلبية) =====================
    let addItemContext = { orderId: null };

    function openAddItemModal(orderId) {
        addItemContext = { orderId };
        document.getElementById('addItemSearchInput').value = '';
        renderAddItemResults('');
        document.getElementById('addItemModal').style.display = 'flex';
    }

    function closeAddItemModal() {
        document.getElementById('addItemModal').style.display = 'none';
    }

    function renderAddItemResults(query) {
        const container = document.getElementById('addItemResultsContainer');
        let list = catalogProducts.slice();
        if (query) list = list.filter(p => (p.name || '').includes(query));
        list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        list = list.slice(0, 30);

        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888; font-size:0.75rem; padding:15px;">لا يوجد منتج مطابق</p>';
            return;
        }

        container.innerHTML = list.map(p => {
            let price = (p.salePrice !== undefined && p.salePrice !== null && p.salePrice !== '') ? p.salePrice : p.price;
            return `
                <div style="display:flex; align-items:center; gap:8px; padding:7px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:5px; cursor:pointer;" onclick="confirmAddItem('${p.id}')">
                    <img src="${p.img || ''}" style="width:34px; height:34px; object-fit:contain; border-radius:6px; flex-shrink:0; background:white;" onerror="this.style.display='none'">
                    <span style="flex:1; font-size:0.75rem; font-weight:700;">${p.name}</span>
                    <span style="font-size:0.7rem; color:#16a34a; font-weight:800; flex-shrink:0;">${price || 0} ₪</span>
                </div>
            `;
        }).join('');
    }

    async function confirmAddItem(productId) {
        const { orderId } = addItemContext;
        const ord = currentOrdersList.find(o => o.id === orderId);
        const product = catalogProducts.find(p => p.id === productId);
        if (!ord || !product) return;

        const input = prompt(`الكمية المطلوبة من "${product.name}":`, "1");
        if (input === null) return;
        const qty = parseInt(input);
        if (!qty || qty < 1) {
            alert('كمية غير صالحة');
            return;
        }

        const rawPrice = getEffectiveCatalogPrice(product);

        // لو المنتج أصلاً موجود بالطلبية (ومش معلّم نفذت الكمية)، منزيد على كميته بدل ما نكرره كصف مستقل
        let existingIdx = (ord.items || []).findIndex(it => it.id === product.id && !it.unavailable);
        let newItems;
        if (existingIdx > -1) {
            newItems = ord.items.map((it, i) => i === existingIdx ? { ...it, quantity: Number(it.quantity || it.qty || 0) + qty, qty: Number(it.quantity || it.qty || 0) + qty } : it);
        } else {
            newItems = [...(ord.items || []), {
                id: product.id,
                name: product.name,
                img: product.img || '',
                price: rawPrice,
                quantity: qty,
                qty: qty,
                addedByStaff: true
            }];
        }

        // منعيد حساب سعر كل الأصناف (مش بس المضاف) - المنتج الجديد ممكن يفعّل أو يغيّر عرض حزمة/شراء
        // كان شغال على منتجات تانية بنفس الطلبية أصلاً. منحدث بيانات العروض لأحدث نسخة أول
        // (تحسباً لو الموظف فتح الصفحة وضاف منتج بسرعة قبل ما توصل onSnapshot)
        await ensureFreshBundlesAndSpendOffers();
        newItems = recomputeAllItemPricesWithPromos(newItems);
        let matchedInfo = computeEffectivePriceForOrderItem(product.id, newItems);
        if (matchedInfo && (matchedInfo.bundleName || matchedInfo.spendOfferName) && Math.abs(matchedInfo.unitPrice - rawPrice) > 0.01) {
            alert(`تنبيه: "${product.name}" مشمول بعرض مفعّل حالياً بالطلبية، فانحسب سعره ${matchedInfo.unitPrice.toFixed(2)}₪ بدل سعره العادي ${rawPrice.toFixed(2)}₪.`);
        }

        closeAddItemModal();
        await saveOrderItemsUpdate(orderId, newItems);
    }

    // ===================== إلغاء الطلبية بالكامل =====================
    async function cancelWholeOrder(orderId) {
        const ord = currentOrdersList.find(o => o.id === orderId);
        const label = ord ? getOrderLabelFor(ord) : '';
        if (!confirm(`متأكد من إلغاء الطلبية ${label} بالكامل؟ هاد الإجراء نهائي وما ممكن نتراجع عنه.`)) return;
        try {
            await window.deleteDoc(window.doc(window.db, "orders", orderId));
        } catch(e) {
            console.error(e);
            alert('تعذر إلغاء الطلبية: ' + (e.message || e));
        }
    }

    async function startPreparingOrder(orderId) {
        try {
            await window.updateDoc(window.doc(window.db, "orders", orderId), {
                status: "قيد التحضير"
            });
            let ord = currentOrdersList.find(o => o.id === orderId);
            if (ord) {
                sendOrderNotification(ord.customerPhone, `🍳 طلبك ${getOrderLabelFor(ord)} قيد التحضير الآن! - العروبة أونلاين`);
            }
        } catch(e) {
            console.error(e);
            alert("خطأ أثناء تحديث حالة الطلب.");
        }
    }

    async function markOrderReady(orderId) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!isOrderFullyChecked(ord)) {
            alert("لازم تعلّم (تشطب) كل المنتجات كمجهّزة أولاً قبل ما ترسل الطلب للسائق ✅");
            return;
        }

        if(confirm("هل أنت متأكد من أن الطلب جاهز للتوصيل؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "جاهز للتوصيل"
                });
                sendOrderNotification(ord.customerPhone, `📦 طلبك ${getOrderLabelFor(ord)} جاهز، وبانتظار السائق - وصوله قريب! - العروبة أونلاين`);
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }

    // ===================== طباعة فاتورة تحضير للطلب =====================
    function printOrder(orderId) {
        let ord = currentOrdersList.find(o => o.id === orderId);
        if (!ord) return;

        let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : orderId;
        let notesVal = ord.notes || ord.orderNotes || ord.customerNotes || '';

        let itemsRows = '';
        if (ord.items && Array.isArray(ord.items)) {
            ord.items.forEach(item => {
                let isUnavailable = !!item.unavailable;
                let rowStyle = isUnavailable ? 'text-decoration:line-through; color:#999;' : '';
                itemsRows += `
                    <tr>
                        <td style="padding:4px 6px; border-bottom:1px solid #ddd; ${rowStyle}">${item.name || item.productName || 'منتج'}${isUnavailable ? ' (نفذت الكمية)' : ''}</td>
                        <td style="padding:4px 6px; border-bottom:1px solid #ddd; text-align:center; ${rowStyle}">${item.qty || item.quantity || 1}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('printArea').innerHTML = `
            <div style="font-family: 'Cairo', sans-serif; direction: rtl; padding: 15px; max-width: 400px; margin: 0 auto;">
                <h2 style="text-align: center; margin-bottom: 4px;">🍳 العروبة أونلاين</h2>
                <p style="text-align: center; margin-bottom: 12px; color: #555;">فاتورة تحضير الطلب</p>
                <hr>
                <p><strong>رقم الطلبية:</strong> ${orderLabel}</p>
                <p><strong>الزبون:</strong> ${ord.customerName || ord.clientName || 'زبون'}</p>
                <p><strong>الهاتف:</strong> ${ord.customerPhone || ord.phone || ''}</p>
                <p><strong>العنوان:</strong> ${ord.customerAddress || ord.address || ''}</p>
                <p><strong>وقت الطلب:</strong> <span dir="ltr">${formatOrderTime(ord)}</span></p>
                ${notesVal ? `<p><strong>ملاحظة الزبون:</strong> ${notesVal}</p>` : ''}
                <hr style="margin: 10px 0;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="text-align: right; padding: 4px 6px; border-bottom: 2px solid #000;">المنتج</th>
                            <th style="text-align: center; padding: 4px 6px; border-bottom: 2px solid #000;">الكمية</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>
                <h3 style="text-align: left; margin-top: 14px;">الإجمالي: ${ord.total || 0} ₪</h3>
            </div>
        `;
        window.print();
    }

</script>
</body>
</html>
