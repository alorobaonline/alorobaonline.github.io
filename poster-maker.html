<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صانع صورة العروض - العروبة أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --primary-green: #6BA516; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #f3f4f6; color: #1f2937; padding: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 900; color: var(--primary-green); margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #6b7280; margin-bottom: 18px; }

    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card h2 { font-size: 0.95rem; font-weight: 800; margin-bottom: 10px; color: #374151; }

    input[type="text"], input[type="search"] { width: 100%; padding: 10px; border: 1.5px solid #d1d5db; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 0.85rem; margin-bottom: 10px; }

    .color-swatches { display: flex; gap: 8px; margin-bottom: 4px; }
    .swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
    .swatch.selected { border-color: #111827; }

    .selected-count { font-size: 0.75rem; font-weight: 800; color: var(--primary-green); margin-bottom: 8px; }
    .selected-count.full { color: #dc2626; }

    .product-search-results { max-height: 280px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 10px; }
    .product-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .product-row:last-child { border-bottom: none; }
    .product-row img { width: 38px; height: 38px; object-fit: contain; border-radius: 8px; background: #fafbfa; flex-shrink: 0; }
    .product-row .info { flex: 1; min-width: 0; }
    .product-row .name { font-size: 0.78rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-row .price { font-size: 0.7rem; color: #6b7280; }
    .product-row.in-selection { background: #f0fdf4; }
    .product-row .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #d1d5db; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .product-row.in-selection .check { background: var(--primary-green); border-color: var(--primary-green); color: white; }

    .selected-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .selected-item { position: relative; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 6px; text-align: center; }
    .selected-item img { width: 100%; height: 44px; object-fit: contain; }
    .selected-item .name { font-size: 0.6rem; font-weight: 700; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .selected-item .remove-x { position: absolute; top: -6px; left: -6px; background: #dc2626; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .selected-item .order-num { position: absolute; top: -6px; right: -6px; background: var(--primary-green); color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .selected-item .move-buttons { display: flex; gap: 3px; margin-top: 4px; }
    .selected-item .move-buttons button { flex: 1; border: 1px solid #d1d5db; background: white; border-radius: 5px; font-size: 0.65rem; padding: 2px 0; cursor: pointer; }
    .selected-item .move-buttons button:disabled { opacity: 0.3; cursor: not-allowed; }
    .selected-item .deal-inputs { display: flex; gap: 3px; margin-top: 5px; }
    .selected-item .deal-inputs input { width: 100%; min-width: 0; padding: 3px 2px; font-size: 0.58rem; border: 1px solid #d1d5db; border-radius: 5px; text-align: center; font-family: 'Cairo', sans-serif; }
    .selected-item .deal-hint { font-size: 0.52rem; color: #9ca3af; margin-top: 2px; }

    .generate-btn { width: 100%; background: var(--primary-green); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 0.95rem; cursor: pointer; margin-top: 6px; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #posterCanvas { width: 100%; border-radius: 12px; margin-top: 14px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .download-btn { display: none; width: 100%; text-align: center; background: #111827; color: white; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; margin-top: 10px; }
    .status-msg { text-align: center; font-size: 0.8rem; font-weight: 700; color: #dc2626; margin-top: 10px; display: none; }

    .draft-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: #f8faf7; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 6px; }
    .draft-row .draft-name { flex: 1; font-size: 0.8rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .draft-row .draft-count { font-size: 0.65rem; color: #6b7280; font-weight: 600; margin-top: 2px; }
    .draft-row button { border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.68rem; font-weight: 800; cursor: pointer; }
    .draft-row .load-btn { background: var(--primary-green); color: white; }
    .draft-row .del-btn { background: #fef2f2; color: #dc2626; }
</style>
</head>
<body>
<div class="wrap">
    <h1>🖼️ صانع صورة العروض</h1>
    <p class="sub">اختاري 12 منتج، وبضغطة زر بتطلع صورة واحدة جاهزة لواتساب/انستقرام</p>

    <div class="card">
        <h2>1️⃣ عنوان الصورة</h2>
        <input type="text" id="posterTitle" placeholder="مثال: عروض الأسبوع 🔥" value="عروض الأسبوع 🔥">
        <input type="text" id="posterSubtitle" placeholder="مثال: العروبة أونلاين" value="العروبة أونلاين">
        <div class="color-swatches" id="colorSwatches"></div>
    </div>

    <div class="card">
        <h2>2️⃣ اختاري 15 منتج (<span id="selCount">0</span>/15)</h2>
        <div class="selected-count" id="selCountText">اختاري منتجاتك من القائمة تحت</div>
        <div class="selected-grid" id="selectedGrid"></div>
        <div style="height:12px;"></div>
        <input type="search" id="productSearchInput" placeholder="🔍 دوري باسم المنتج...">
        <div class="product-search-results" id="productResults"></div>
    </div>

    <div class="card">
        <h2>3️⃣ التصاميم المحفوظة</h2>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" id="draftNameInput" placeholder="اسم التصميم (مثال: عروض هالأسبوع)" style="flex:1; margin-bottom:0;">
            <button onclick="saveDraft()" style="background:#111827; color:white; border:none; padding:0 16px; border-radius:10px; font-weight:800; font-size:0.82rem; cursor:pointer; white-space:nowrap;">💾 حفظ</button>
        </div>
        <div id="draftsList"></div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generatePoster()" disabled>🖼️ ولّدي الصورة</button>
    <div class="status-msg" id="statusMsg"></div>

    <canvas id="posterCanvas" width="1080" height="1830"></canvas>
    <a class="download-btn" id="downloadBtn">⬇️ تنزيل الصورة</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
        authDomain: "alorobaonline.firebaseapp.com",
        projectId: "alorobaonline",
        storageBucket: "alorobaonline.firebasestorage.app",
        messagingSenderId: "880642361344",
        appId: "1:880642361344:web:9dddec05f81125f0fc30e5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const COLORS = ['#6BA516', '#dc2626', '#f59e0b', '#7c3aed', '#0891b2', '#111827'];
    let selectedColor = COLORS[0];

    let allProducts = [];
    let selectedProducts = []; // بالترتيب يلي اخترتهم فيه

    // ===================== تحميل المنتجات =====================
    getDocs(collection(db, "products")).then(snap => {
        allProducts = [];
        snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
        renderProductResults('');
    }).catch(err => {
        console.error(err);
        document.getElementById('productResults').innerHTML = '<p style="padding:14px; font-size:0.8rem; color:#dc2626;">تعذر تحميل المنتجات، حاولي تحدّثي الصفحة</p>';
    });

    // ===================== ألوان الخلفية =====================
    const swatchesEl = document.getElementById('colorSwatches');
    COLORS.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'swatch' + (i === 0 ? ' selected' : '');
        el.style.background = c;
        el.onclick = () => {
            selectedColor = c;
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
        };
        swatchesEl.appendChild(el);
    });

    // ===================== حفظ/تحميل التصاميم (محفوظة على هالجهاز بالمتصفح) =====================
    const DRAFTS_KEY = 'aloroba_poster_drafts';

    function getDrafts() {
        try { return JSON.parse(localStorage.getItem(DRAFTS_KEY)) || []; } catch (e) { return []; }
    }

    function saveDrafts(drafts) {
        localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts));
    }

    window.saveDraft = function() {
        const nameInput = document.getElementById('draftNameInput');
        const name = nameInput.value.trim();
        if (!name) {
            alert('اكتبي اسم للتصميم حتى تقدري تلاقيه بعدين');
            return;
        }
        if (selectedProducts.length === 0) {
            alert('ضيفي منتج واحد على الأقل قبل ما تحفظي');
            return;
        }

        const draft = {
            id: 'd_' + Date.now(),
            name,
            title: document.getElementById('posterTitle').value,
            subtitle: document.getElementById('posterSubtitle').value,
            color: selectedColor,
            products: selectedProducts.map(p => ({
                id: p.id, name: p.name, img: p.img, price: p.price, salePrice: p.salePrice,
                dealQty: p.dealQty || null, dealPrice: p.dealPrice || null
            }))
        };

        const drafts = getDrafts();
        drafts.unshift(draft);
        saveDrafts(drafts);
        nameInput.value = '';
        renderDraftsList();
        alert('تم حفظ التصميم ✅ - رجعيله بأي وقت من القائمة تحت');
    };

    window.loadDraft = function(draftId) {
        const draft = getDrafts().find(d => d.id === draftId);
        if (!draft) return;

        document.getElementById('posterTitle').value = draft.title || '';
        document.getElementById('posterSubtitle').value = draft.subtitle || '';

        selectedColor = draft.color || COLORS[0];
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        const idx = COLORS.indexOf(selectedColor);
        if (idx !== -1) document.querySelectorAll('.swatch')[idx].classList.add('selected');

        // منحدّث الصورة والاسم والسعر من قائمة المنتجات الحالية لو المنتج لسا موجود (ممكن يكون
        // اتغيّر سعره من وقت الحفظ) - وإلا منستخدم النسخة المحفوظة كاحتياط
        selectedProducts = draft.products.map(dp => {
            const live = allProducts.find(p => p.id === dp.id);
            const base = live || dp;
            return { ...base, dealQty: dp.dealQty, dealPrice: dp.dealPrice };
        });

        renderSelectedGrid();
        renderProductResults(document.getElementById('productSearchInput').value);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteDraft = function(draftId, name) {
        if (!confirm(`حذف تصميم "${name}"؟`)) return;
        saveDrafts(getDrafts().filter(d => d.id !== draftId));
        renderDraftsList();
    };

    function renderDraftsList() {
        const container = document.getElementById('draftsList');
        const drafts = getDrafts();
        if (drafts.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#9ca3af; font-size:0.75rem; padding:8px;">ما في تصاميم محفوظة بعد</p>';
            return;
        }
        container.innerHTML = drafts.map(d => `
            <div class="draft-row">
                <div>
                    <div class="draft-name">${escapeHtml(d.name)}</div>
                    <div class="draft-count">${(d.products || []).length} منتج</div>
                </div>
                <button class="load-btn" onclick="window.loadDraft('${d.id}')">فتح ✏️</button>
                <button class="del-btn" onclick="window.deleteDraft('${d.id}', '${d.name.replace(/'/g, "\\'")}')">🗑️</button>
            </div>
        `).join('');
    }

    renderDraftsList();

    // ===================== البحث واختيار المنتجات =====================
    function renderProductResults(query) {
        const container = document.getElementById('productResults');
        const q = query.trim().toLowerCase();
        let list = allProducts;
        if (q) list = list.filter(p => (p.name || '').toLowerCase().includes(q));
        list = list.slice(0, 60);

        if (list.length === 0) {
            container.innerHTML = '<p style="padding:14px; font-size:0.78rem; color:#9ca3af; text-align:center;">ما في نتائج</p>';
            return;
        }

        container.innerHTML = list.map(p => {
            const inSel = selectedProducts.some(sp => sp.id === p.id);
            const price = effectivePrice(p);
            return `
                <div class="product-row ${inSel ? 'in-selection' : ''}" onclick="window.toggleProductSelection('${p.id}')">
                    <div class="check">${inSel ? '✓' : ''}</div>
                    <img src="${p.img || ''}" onerror="this.style.visibility='hidden'">
                    <div class="info">
                        <div class="name">${escapeHtml(p.name || '')}</div>
                        <div class="price">${price.toFixed(2)}₪</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function effectivePrice(p) {
        let hasSale = p.salePrice !== undefined && p.salePrice !== null && p.salePrice !== '';
        return Number(hasSale ? p.salePrice : p.price) || 0;
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    window.toggleProductSelection = function(productId) {
        const idx = selectedProducts.findIndex(p => p.id === productId);
        if (idx !== -1) {
            selectedProducts.splice(idx, 1);
        } else {
            if (selectedProducts.length >= 15) {
                alert('وصلتي الحد الأقصى (15 منتج) - شيلي منتج حتى تضيفي غيره');
                return;
            }
            const prod = allProducts.find(p => p.id === productId);
            if (prod) selectedProducts.push(prod);
        }
        renderSelectedGrid();
        renderProductResults(document.getElementById('productSearchInput').value);
    };

    window.removeSelected = function(productId) {
        selectedProducts = selectedProducts.filter(p => p.id !== productId);
        renderSelectedGrid();
        renderProductResults(document.getElementById('productSearchInput').value);
    };

    // بتبدّل مكان منتج مع اللي قبله (direction: -1) أو اللي بعده (direction: 1) - هيك بتتحكمي
    // بترتيب المنتجات بالصورة النهائية (المربع الأول فوق يمين، وهكذا بالترتيب)
    window.moveSelected = function(productId, direction) {
        const idx = selectedProducts.findIndex(p => p.id === productId);
        const newIdx = idx + direction;
        if (idx === -1 || newIdx < 0 || newIdx >= selectedProducts.length) return;
        [selectedProducts[idx], selectedProducts[newIdx]] = [selectedProducts[newIdx], selectedProducts[idx]];
        renderSelectedGrid();
    };

    // بتحفظ رقم الكمية أو السعر الكلي لعرض خاص ("5 بـ 35₪") لمنتج معين داخل الصورة
    window.setDealField = function(productId, field, value) {
        const p = selectedProducts.find(sp => sp.id === productId);
        if (!p) return;
        p[field] = value ? Number(value) : null;
    };

    function renderSelectedGrid() {
        document.getElementById('selCount').innerText = selectedProducts.length;
        const countTextEl = document.getElementById('selCountText');
        countTextEl.classList.toggle('full', selectedProducts.length === 12);
        countTextEl.innerText = selectedProducts.length === 12
            ? '✅ اخترتي 15 منتج - جاهزة تولّدي الصورة'
            : `اختاري ${15 - selectedProducts.length} منتج إضافي`;

        document.getElementById('selectedGrid').innerHTML = selectedProducts.map((p, idx) => `
            <div class="selected-item">
                <div class="order-num">${idx + 1}</div>
                <div class="remove-x" onclick="window.removeSelected('${p.id}')">✕</div>
                <img src="${p.img || ''}" onerror="this.style.visibility='hidden'">
                <div class="name">${escapeHtml(p.name || '')}</div>
                <div class="deal-inputs">
                    <input type="number" placeholder="كمية" min="2" value="${p.dealQty || ''}" onchange="window.setDealField('${p.id}', 'dealQty', this.value)">
                    <input type="number" placeholder="سعر الكل" min="0" step="0.01" value="${p.dealPrice || ''}" onchange="window.setDealField('${p.id}', 'dealPrice', this.value)">
                </div>
                <div class="deal-hint">عرض كمية (اختياري)</div>
                <div class="move-buttons">
                    <button onclick="window.moveSelected('${p.id}', -1)" ${idx === 0 ? 'disabled' : ''}>◀ بكّري</button>
                    <button onclick="window.moveSelected('${p.id}', 1)" ${idx === selectedProducts.length - 1 ? 'disabled' : ''}>أخّري ▶</button>
                </div>
            </div>
        `).join('');

        document.getElementById('generateBtn').disabled = selectedProducts.length !== 15;
    }

    document.getElementById('productSearchInput').addEventListener('input', (e) => renderProductResults(e.target.value));

    // ===================== توليد الصورة على Canvas =====================
    function loadImage(src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null); // لو فشلت صورة معينة، منكمل بباقي الصور
            img.src = src;
        });
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    window.generatePoster = async function() {
        const statusEl = document.getElementById('statusMsg');
        const btn = document.getElementById('generateBtn');
        statusEl.style.display = 'none';
        btn.disabled = true;
        btn.innerText = '⏳ جاري التوليد...';

        try {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;

            // خلفية
            ctx.fillStyle = '#f8faf7';
            ctx.fillRect(0, 0, W, H);

            // شريط العنوان فوق
            const headerH = 190;
            const grad = ctx.createLinearGradient(0, 0, W, 0);
            grad.addColorStop(0, selectedColor);
            grad.addColorStop(1, shadeColor(selectedColor, -20));
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, headerH);

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = '900 62px Cairo, sans-serif';
            ctx.direction = 'rtl';
            const title = document.getElementById('posterTitle').value.trim() || 'عروضنا';
            const subtitle = document.getElementById('posterSubtitle').value.trim();
            ctx.fillText(title, W / 2, 100);
            if (subtitle) {
                ctx.font = '700 30px Cairo, sans-serif';
                ctx.fillText(subtitle, W / 2, 150);
            }

            // الشبكة: 3 أعمدة × 4 صفوف
            const cols = 3, rows = 5;
            const padding = 22;
            const gridTop = headerH + padding;
            const cellW = (W - padding * (cols + 1)) / cols;
            const cellH = (H - gridTop - padding * rows) / rows;

            for (let i = 0; i < selectedProducts.length; i++) {
                const p = selectedProducts[i];
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = padding + col * (cellW + padding);
                const y = gridTop + row * (cellH + padding);

                // خلفية الكرت
                ctx.fillStyle = 'white';
                drawRoundedRect(ctx, x, y, cellW, cellH, 18);
                ctx.fill();
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 2;
                ctx.stroke();

                // صورة المنتج
                const imgBoxH = cellH * 0.55;
                if (p.img) {
                    const img = await loadImage(p.img);
                    if (img) {
                        const maxImgW = cellW - 24, maxImgH = imgBoxH - 16;
                        const scale = Math.min(maxImgW / img.width, maxImgH / img.height);
                        const iw = img.width * scale, ih = img.height * scale;
                        const ix = x + (cellW - iw) / 2;
                        const iy = y + 12 + (imgBoxH - 16 - ih) / 2;
                        ctx.drawImage(img, ix, iy, iw, ih);
                    }
                }

                // اسم المنتج
                let name = p.name || '';
                if (name.length > 22) name = name.slice(0, 20) + '…';
                ctx.fillStyle = '#1f2937';
                ctx.font = '800 24px Cairo, sans-serif';
                ctx.fillText(name, x + cellW / 2, y + imgBoxH + 34);

                // الأسعار
                const hasSale = p.salePrice !== undefined && p.salePrice !== null && p.salePrice !== '';
                const sellPrice = Number(p.price) || 0;
                const salePrice = hasSale ? Number(p.salePrice) : null;
                const priceY = y + imgBoxH + 92;

                const hasDeal = p.dealQty && p.dealPrice;
                if (hasDeal) {
                    // شارة عرض كمية حمراء "X بـ Y₪" بدل السعر العادي - نفس شكل عروض الكمية بالمتجر
                    const dealText = `${p.dealQty} بـ ${p.dealPrice}₪`;
                    ctx.font = '900 30px Cairo, sans-serif';
                    const dealW = ctx.measureText(dealText).width + 36;
                    const badgeX = x + (cellW - dealW) / 2;
                    const badgeY = priceY - 34;
                    ctx.fillStyle = '#dc2626';
                    drawRoundedRect(ctx, badgeX, badgeY, dealW, 44, 10);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.fillText(dealText, x + cellW / 2, priceY);
                } else if (hasSale) {
                    ctx.font = '900 30px Cairo, sans-serif';
                    ctx.fillStyle = '#dc2626';
                    ctx.fillText(salePrice.toFixed(2) + '₪', x + cellW / 2 - 8, priceY);

                    ctx.font = '700 20px Cairo, sans-serif';
                    ctx.fillStyle = '#9ca3af';
                    const oldPriceText = sellPrice.toFixed(2) + '₪';
                    const oldPriceX = x + cellW / 2 + 62;
                    ctx.fillText(oldPriceText, oldPriceX, priceY);
                    const tw = ctx.measureText(oldPriceText).width;
                    ctx.strokeStyle = '#9ca3af';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(oldPriceX - tw / 2 - 2, priceY - 7);
                    ctx.lineTo(oldPriceX + tw / 2 + 2, priceY - 7);
                    ctx.stroke();
                } else {
                    ctx.font = '900 28px Cairo, sans-serif';
                    ctx.fillStyle = '#111827';
                    ctx.fillText(sellPrice.toFixed(2) + '₪', x + cellW / 2, priceY);
                }
            }

            canvas.style.display = 'block';
            canvas.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const dataUrl = canvas.toDataURL('image/png');
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.href = dataUrl;
            dlBtn.download = 'عروض-العروبة-اونلاين.png';
            dlBtn.style.display = 'block';
        } catch (e) {
            console.error(e);
            statusEl.innerText = '❌ صار خطأ أثناء توليد الصورة - جربي منتجات ثانية أو حاولي مرة تانية';
            statusEl.style.display = 'block';
        } finally {
            btn.disabled = selectedProducts.length !== 15;
            btn.innerText = '🖼️ ولّدي الصورة';
        }
    };

    function shadeColor(hex, percent) {
        let num = parseInt(hex.replace('#', ''), 16);
        let r = (num >> 16) + Math.round(2.55 * percent);
        let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
        let b = (num & 0x0000FF) + Math.round(2.55 * percent);
        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));
        return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
    }
</script>
