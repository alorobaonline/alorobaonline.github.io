<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة أونلاين - المتجر الرئيسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding-bottom: 90px; }

        .store-container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: var(--shadow-card); position: relative; }
        
        /* الهيدر العلوي */
        .store-header { background: var(--primary-green); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .store-title { font-size: 1rem; font-weight: 900; display: flex; align-items: center; gap: 5px; }
        .admin-link { background: rgba(255,255,255,0.2); color: white; padding: 5px 10px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; }

        /* شريط البحث */
        .search-box-container { padding: 10px 15px; background: white; border-bottom: 1px solid #e5e7eb; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.75rem; outline: none; background: #f8fafc; }
        .search-input:focus { border-color: var(--accent-green); background: white; }

        /* البانر الإعلاني */
        .banner-container { padding: 10px 15px; }
        .banner-slide { background: linear-gradient(135deg, var(--primary-green), #2e6930); color: white; border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-card); }
        .banner-text h2 { font-size: 0.95rem; font-weight: 900; margin-bottom: 3px; }
        .banner-text p { font-size: 0.7rem; opacity: 0.9; }
        .banner-img { width: 60px; height: 60px; object-fit: contain; background: white; border-radius: 50%; padding: 5px; }

        /* أقسام التصنيفات الأفقي */
        .categories-scroll { display: flex; gap: 8px; padding: 5px 15px 10px 15px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; color: #374151; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; }
        .cat-chip.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }

        /* شبكة المنتجات */
        .products-grid { padding: 10px 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .product-img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 8px; background: #fff; border-radius: 8px; }
        .product-name { font-size: 0.8rem; font-weight: 800; color: #1f2937; margin-bottom: 4px; }
        .product-weight { font-size: 0.65rem; color: #6b7280; margin-bottom: 6px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .product-price { font-size: 0.85rem; font-weight: 900; color: var(--primary-green); }
        .add-to-cart-btn { background: var(--accent-green); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(104, 166, 51, 0.3); }

        /* شريط السلة العائم السفلي */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--primary-green); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100; border-top-left-radius: 16px; border-top-right-radius: 16px; }
        .cart-total { font-size: 1rem; font-weight: 900; }
        .cart-btn-open { background: white; color: var(--primary-green); border: none; padding: 7px 15px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; cursor: pointer; }

        /* زر طلباتي السابقة العائم أو العلوي */
        .my-orders-trigger { background: #f8fafc; border: 1px solid var(--accent-green); color: var(--primary-green); padding: 6px 12px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px; margin: 5px 15px; width: calc(100% - 30px); justify-content: center; }

        /* نافذة السلة وإتمام الطلب / طلباتي */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-width: 480px; max-height: 85vh; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 12px; }
        .modal-title { font-size: 0.9rem; font-weight: 900; color: var(--primary-green); }
        .close-modal { background: #f1f5f9; border: none; width: 25px; height: 25px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.75rem; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { background: #e2e8f0; border: none; width: 22px; height: 22px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 700; margin-bottom: 3px; color: #4b5563; }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.75rem; outline: none; background: white; }
        .form-control:focus { border-color: var(--accent-green); }

        .btn-main { width: 100%; background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 900; cursor: pointer; margin-top: 10px; }
        
        .past-order-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 0.7rem; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.doc = doc;
        window.getDoc = getDoc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="store-container">
    <!-- الهيدر -->
    <div class="store-header">
        <div class="store-title">🛒 العروبة أونلاين</div>
        <a href="admin.html" class="admin-link">⚙️ لوحة التحكم</a>
    </div>

    <!-- زر طلباتي السابقة -->
    <button class="my-orders-trigger" onclick="openMyOrdersModal()">
        📂 سجل طلباتي السابقة (<span id="myOrdersCountBadge">0</span>)
    </button>

    <!-- شريط البحث -->
    <div class="search-box-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي منتج تريده..." oninput="filterProducts()">
    </div>

    <!-- البانر -->
    <div class="banner-container" id="storeBannerContainer">
        <div class="banner-slide">
            <div class="banner-text">
                <h2 id="bannerTitleText">تسوق أفضل المنتجات</h2>
                <p>تسوق أفضل المنتجات الطازجة</p>
            </div>
            <img src="https://i.ibb.co/3m1K2wP/basket.png" class="banner-img" id="bannerImgTag">
        </div>
    </div>

    <!-- فئات الأقسام -->
    <div class="categories-scroll" id="storeCategoriesScroll">
        <div class="cat-chip active" onclick="filterByCategory('الكل', this)">🛍️ الكل</div>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="storeProductsGrid">
        <p style="grid-column: span 2; text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">جاري تحميل المنتجات...</p>
    </div>

    <!-- السلة العائمة -->
    <div class="cart-bar">
        <div>
            <div style="font-size: 0.65rem; opacity: 0.85;">سلة المشتريات</div>
            <div class="cart-total" id="cartTotalText">0.00 ₪</div>
        </div>
        <button class="cart-btn-open" onclick="openCartModal()">عرض السلة (<span id="cartCountBadge">0</span>)</button>
    </div>
</div>

<!-- نافذة السلة وإتمام الطلب -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">🛒 سلة المشتريات وإتمام الطلب</div>
            <button class="close-modal" onclick="closeCartModal()">✕</button>
        </div>
        <div id="cartItemsList" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;"></div>
        
        <div style="font-weight: bold; font-size: 0.8rem; margin-bottom: 10px; text-align: left;" id="cartModalTotal">المجموع الكلي: 0.00 ₪</div>

        <div style="border-top: 1px solid #e5e7eb; padding-top: 10px;">
            <div style="font-size: 0.75rem; font-weight: 900; color: var(--primary-green); margin-bottom: 8px;">معلومات التوصيل (محفوظة في جهازك تلقائياً):</div>
            <div class="form-group">
                <label>اسم الزبون</label>
                <input type="text" id="custName" class="form-control" placeholder="ادخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="custPhone" class="form-control" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>العنوان (الحارة والبيت)</label>
                <textarea id="custAddress" class="form-control" rows="2" placeholder="اسم الحارة، رقم البيت، أو أي توضيح..."></textarea>
            </div>
            <button class="btn-main" onclick="submitOrder()">إرسال الطلب الآن 🚀</button>
        </div>
    </div>
</div>

<!-- نافذة أرشيف طلباتي السابقة -->
<div class="modal-overlay" id="myOrdersModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">📂 سجل طلباتي السابقة</div>
            <button class="close-modal" onclick="closeMyOrdersModal()">✕</button>
        </div>
        <div id="myPreviousOrdersList" style="max-height: 350px; overflow-y: auto;">
            <p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات سابقة محفوظة.</p>
        </div>
    </div>
</div>

<script>
    let products = [];
    let categories = [{ name: "الكل", icon: "🛍️" }];
    let cart = [];
    let bannerSlides = [];
    let currentCategory = "الكل";

    window.addEventListener('firebase-ready', async function() {
        await loadStoreData();
        loadSavedCustomerData();
        loadMyPreviousOrders();
    });

    async function loadStoreData() {
        try {
            const prodSnap = await window.getDocs(window.collection(window.db, "products"));
            products = [];
            prodSnap.forEach(docSnap => {
                products.push({ id: docSnap.id, ...docSnap.data() });
            });

            const catSnap = await window.getDocs(window.collection(window.db, "categories"));
            if(!catSnap.empty) {
                categories = [{ name: "الكل", icon: "🛍️" }];
                catSnap.forEach(docSnap => {
                    let d = docSnap.data();
                    if(d.name && d.name !== "الكل") categories.push(d);
                });
            }

            // تحميل البانر إن وجد
            const bannerDoc = await window.getDoc(window.doc(window.db, "settings", "banner"));
            if(bannerDoc.exists() && bannerDoc.data().slides && bannerDoc.data().slides.length > 0) {
                bannerSlides = bannerDoc.data().slides;
                renderBanner(0);
            }

            renderCategoriesChips();
            renderProducts(products);
        } catch(e) {
            console.error("خطأ في جلب بيانات المتجر:", e);
        }
    }

    function renderBanner(index) {
        if(bannerSlides.length === 0) return;
        let slide = bannerSlides[index % bannerSlides.length];
        document.getElementById('bannerTitleText').innerText = slide.title || "تسوق أفضل المنتجات";
        document.getElementById('bannerImgTag').src = slide.img || "https://i.ibb.co/3m1K2wP/basket.png";
    }

    function renderCategoriesChips() {
        const container = document.getElementById('storeCategoriesScroll');
        container.innerHTML = '';
        categories.forEach(cat => {
            let activeClass = (cat.name === currentCategory) ? 'active' : '';
            container.innerHTML += `
                <div class="cat-chip ${activeClass}" onclick="filterByCategory('${cat.name}', this)">
                    ${cat.icon} ${cat.name}
                </div>
            `;
        });
    }

    function filterByCategory(catName, elem) {
        currentCategory = catName;
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        elem.classList.add('active');

        if(catName === "الكل") {
            renderProducts(products);
        } else {
            let filtered = products.filter(p => p.categories && p.categories.includes(catName));
            renderProducts(filtered);
        }
    }

    function filterProducts() {
        let keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = products.filter(p => {
            let matchName = p.name.toLowerCase().includes(keyword);
            let matchCat = currentCategory === "الكل" || (p.categories && p.categories.includes(currentCategory));
            return matchName && matchCat;
        });
        renderProducts(filtered);
    }

    function renderProducts(list) {
        const grid = document.getElementById('storeProductsGrid');
        grid.innerHTML = '';
        if(list.length === 0) {
            grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد منتجات مطابقة</p>';
            return;
        }

        list.forEach(p => {
            let activePrice = (p.salePrice !== undefined && p.salePrice !== "") ? p.salePrice : p.price;
            let originalPriceHtml = (p.salePrice !== undefined && p.salePrice !== "") ? `<span style="text-decoration: line-through; color: #9ca3af; font-size: 0.7rem; margin-left: 4px;">${p.price}₪</span>` : '';

            grid.innerHTML += `
                <div class="product-card">
                    <div>
                        <img src="${p.img}" class="product-img" onerror="this.src='https://i.ibb.co/3m1K2wP/basket.png'">
                        <div class="product-name">${p.name}</div>
                        <div class="product-weight">${p.weight || 'حبة'}</div>
                    </div>
                    <div class="product-footer">
                        <div>
                            <span class="product-price">${activePrice} ₪</span>
                            ${originalPriceHtml}
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart('${p.id}')">+</button>
                    </div>
                </div>
            `;
        });
    }

    function addToCart(prodId) {
        let p = products.find(x => x.id == prodId);
        if(!p) return;
        let finalPrice = (p.salePrice !== undefined && p.salePrice !== "") ? p.salePrice : p.price;

        let existing = cart.find(item => item.id == prodId);
        if(existing) {
            existing.qty += 1;
        } else {
            cart.push({ id: p.id, name: p.name, price: finalPrice, qty: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        let totalCount = 0;
        let totalPrice = 0;
        cart.forEach(item => {
            totalCount += item.qty;
            totalPrice += item.price * item.qty;
        });

        document.getElementById('cartCountBadge').innerText = totalCount;
        document.getElementById('myOrdersCountBadge').innerText = getMySavedOrders().length;
        document.getElementById('cartTotalText').innerText = totalPrice.toFixed(2) + " ₪";
        document.getElementById('cartModalTotal').innerText = "المجموع الكلي: " + totalPrice.toFixed(2) + " ₪";

        let listContainer = document.getElementById('cartItemsList');
        if(cart.length === 0) {
            listContainer.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 10px;">السلة فارغة</p>';
            return;
        }

        let html = '';
        cart.forEach((item, index) => {
            html += `
                <div class="cart-item-row">
                    <div><b>${item.name}</b><br><span style="color:#666;">${item.price} ₪</span></div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }

    function changeQty(index, delta) {
        cart[index].qty += delta;
        if(cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        updateCartUI();
    }

    function openCartModal() {
        if(cart.length === 0) {
            alert("سلة المشتريات فارغة!");
            return;
        }
        updateCartUI();
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCartModal() {
        document.getElementById('cartModal').style.display = 'none';
    }

    // حفظ بيانات الزبون واسترجاعها من المتصفح (localStorage)
    function saveCustomerDataLocally(name, phone, address) {
        const custData = { name, phone, address };
        localStorage.setItem('aloroba_customer_profile', JSON.stringify(custData));
    }

    function loadSavedCustomerData() {
        let saved = localStorage.getItem('aloroba_customer_profile');
        if(saved) {
            try {
                let data = JSON.parse(saved);
                if(data.name) document.getElementById('custName').value = data.name;
                if(data.phone) document.getElementById('custPhone').value = data.phone;
                if(data.address) document.getElementById('custAddress').value = data.address;
            } catch(e) {}
        }
    }

    // حفظ واسترجاع الطلبات السابقة للزبون محلياً في جهازه
    function getMySavedOrders() {
        let saved = localStorage.getItem('aloroba_my_past_orders');
        return saved ? JSON.parse(saved) : [];
    }

    function saveOrderToMyHistory(orderObj) {
        let past = getMySavedOrders();
        past.unshift(orderObj); // إضافة الطلب الجديد في المقدمة
        localStorage.setItem('aloroba_my_past_orders', JSON.stringify(past));
    }

    function openMyOrdersModal() {
        let pastOrders = getMySavedOrders();
        const container = document.getElementById('myPreviousOrdersList');
        
        if(pastOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات سابقة محفوظة في هذا الجهاز.</p>';
        } else {
            let html = '';
            pastOrders.forEach((ord, index) => {
                let itemsListText = '';
                if(ord.items) {
                    ord.items.forEach(it => {
                        itemsListText += `▪️ ${it.name} (${it.qty}x) - ${it.price * it.qty} ₪<br>`;
                    });
                }
                html += `
                    <div class="past-order-box">
                        <div style="display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); margin-bottom: 4px;">
                            <span>طلب رقم #${pastOrders.length - index}</span>
                            <span>الحالة: ${ord.status || 'جديد'}</span>
                        </div>
                        <div><b>التاريخ:</b> ${ord.date || 'اليوم'}</div>
                        <div><b>العنوان:</b> ${ord.customerAddress}</div>
                        <div style="margin: 4px 0; background: #fff; padding: 4px; border-radius: 6px;"><b>المنتجات:<br></b> ${itemsListText}</div>
                        <div style="font-weight: bold; color: var(--accent-green);">السعر الإجمالي: ${ord.total} ₪</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        document.getElementById('myOrdersModal').style.display = 'flex';
    }

    function closeMyOrdersModal() {
        document.getElementById('myOrdersModal').style.display = 'none';
    }

    async function submitOrder() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const address = document.getElementById('custAddress').value.trim();

        if(!name || !phone || !address) {
            alert("الرجاء إدخال اسمك ورقم هاتفك وعنوانك الكامل (الحارة والبيت)");
            return;
        }

        let totalPrice = 0;
        cart.forEach(item => { totalPrice += item.price * item.qty; });

        const newOrder = {
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            items: cart,
            total: totalPrice,
            status: "جديد",
            date: new Date().toLocaleDateString('ar-EG') + " " + new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
        };

        try {
            // حفظ في سحابة Firebase لتصل للوحة التحكم فوراً
            const docRef = await window.addDoc(window.collection(window.db, "orders"), newOrder);
            newOrder.id = docRef.id;

            // حفظ بيانات الزبون في المتصفح لعدم طلبها مرة أخرى
            saveCustomerDataLocally(name, phone, address);

            // حفظ الطلب في أرشيف الزبون المحلي بجهازه
            saveOrderToMyHistory(newOrder);

            alert("تم إرسال طلبك بنجاح! شكراً لتسوقك معنا 💚");
            cart = [];
            closeCartModal();
            updateCartUI();
            loadMyPreviousOrders();
        } catch(e) {
            console.error(e);
            alert("حدث خطأ أثناء إرسال الطلب، تأكد من الاتصال بالإنترنت.");
        }
    }

    function loadMyPreviousOrders() {
        document.getElementById('myOrdersCountBadge').innerText = getMySavedOrders().length;
    }
</script>
</body>
</html>
