<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة أون لاين</title>
    <style>
        :root {
            --primary-green: #68a633;
            --primary-green-hover: #548828;
            --accent-orange: #f35b04;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-pill: 50px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 50px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-color);
            min-height: 100vh;
        }

        /* 1. الهيدر */
        .header {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-badge {
            background-color: var(--primary-green);
            color: white;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-admin-toggle {
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* 2. لوحة الإدارة */
        .admin-panel {
            background: white;
            margin: 15px 16px;
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 2px dashed #2196f3;
            display: none;
        }

        .admin-panel h3 {
            font-size: 1rem;
            color: #1976d2;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input[type="file"] {
            background: #f9fafb;
            padding: 6px;
        }

        .btn-submit {
            background: #2196f3;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        /* 3. شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .card-img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: var(--radius-md);
        }

        .card-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-orange);
            margin-bottom: 8px;
        }

        /* أزرار البطاقة */
        .btn-add {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-add:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }

        .card-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-green);
            color: white;
            border-radius: var(--radius-md);
            padding: 3px;
            width: 100%;
        }

        .counter-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            width: 36px;
            height: 34px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-value {
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff;
            padding: 0 8px;
        }

        .admin-actions {
            display: none;
            gap: 5px;
            margin-top: 8px;
        }

        .btn-card-edit {
            background: #ff9800;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }

        .btn-card-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
        }

        /* 4. نافذة السلة */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .cart-content {
            background: white;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-cart {
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-controls button {
            background: #e5e7eb;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: bold;
            font-size: 1rem;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- الهيدر -->
        <header class="header">
            <div class="cart-badge" onclick="toggleCartModal()">
                🛒 <span id="cart-count">0</span>
            </div>

            <div class="header-actions">
                <button class="btn-admin-toggle" onclick="toggleAdminPanel()">⚙️ الإدارة</button>
            </div>

            <div class="brand">
                <span class="brand-title">العروبة أون لاين</span>
                <span class="brand-subtitle">توصيل سريع • رهط</span>
            </div>
        </header>

        <!-- لوحة الإدارة -->
        <div class="admin-panel" id="admin-panel">
            <h3 id="panel-title">➕ إضافة غرض جديد</h3>
            <input type="hidden" id="p-id">
            
            <div class="form-group">
                <label>اسم الغرض</label>
                <input type="text" id="p-title" placeholder="مثال: حليب طازج">
            </div>
            
            <div class="form-group">
                <label>السعر (₪)</label>
                <input type="number" id="p-price" step="0.10" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>الكمية المتوفرة</label>
                <input type="number" id="p-stock" placeholder="مثال: 10">
            </div>

            <div class="form-group">
                <label>تحميل صورة من جهازك</label>
                <input type="file" id="p-file" accept="image/*">
            </div>

            <button class="btn-submit" onclick="saveProduct()">حفظ ونشر</button>
        </div>

        <!-- شبكة العرض -->
        <div class="products-grid" id="products-grid"></div>

        <!-- نافذة السلة -->
        <div class="cart-modal" id="cart-modal">
            <div class="cart-content">
                <div class="cart-header">
                    <h3>🛒 سلة التسوق</h3>
                    <button class="close-cart" onclick="toggleCartModal()">✕</button>
                </div>
                <div id="cart-items-list"></div>
                <div class="cart-total">
                    <span>المجموع الكلي:</span>
                    <span id="cart-total-price">₪0.00</span>
                </div>
                <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">📱 إرسال الطلب عبر الواتساب</button>
            </div>
        </div>

    </div>

    <script>
        const defaultItems = [
            { id: 101, title: "منظف سانو 00", price: 11.90, stock: 8, img: "https://via.placeholder.com/150" },
            { id: 102, title: "ليف سانو سلك", price: 5.50, stock: 5, img: "https://via.placeholder.com/150" }
        ];

        let products = JSON.parse(localStorage.getItem('aloroba_items_v2')) || defaultItems;
        let cart = JSON.parse(localStorage.getItem('aloroba_cart_v2')) || {}; 
        let isAdminMode = false;

        function saveToStorage() {
            localStorage.setItem('aloroba_items_v2', JSON.stringify(products));
            localStorage.setItem('aloroba_cart_v2', JSON.stringify(cart));
        }

        function toggleAdminPanel() {
            isAdminMode = !isAdminMode;
            document.getElementById('admin-panel').style.display = isAdminMode ? 'block' : 'none';
            resetForm();
            render();
        }

        function render() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(item => {
                const countInCart = cart[item.id] || 0;

                let actionArea = '';
                if (item.stock <= 0) {
                    actionArea = `<button class="btn-add" disabled>نفد المخزون</button>`;
                } else if (countInCart === 0) {
                    actionArea = `<button class="btn-add" onclick="updateQty(${item.id}, 1)">+ أضف للسلة</button>`;
                } else {
                    actionArea = `
                        <div class="card-counter">
                            <button class="counter-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span class="counter-value">${countInCart}</span>
                            <button class="counter-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    `;
                }

                return `
                    <div class="card">
                        <div class="card-img-container">
                            <img src="${item.img}" alt="${item.title}">
                        </div>
                        <div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">المتوفر: <strong>${item.stock}</strong></div>
                            <div class="card-price">₪${parseFloat(item.price).toFixed(2)}</div>
                        </div>

                        ${actionArea}

                        <div class="admin-actions" style="display: ${isAdminMode ? 'flex' : 'none'}">
                            <button class="btn-card-edit" onclick="editProduct(${item.id})">تعديل</button>
                            <button class="btn-card-delete" onclick="deleteProduct(${item.id})">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');

            updateCartBadge();
        }

        function updateQty(id, change) {
            const item = products.find(p => p.id == id);
            const current = cart[id] || 0;
            const target = current + change;

            if (target <= 0) {
                delete cart[id];
            } else if (item && target <= item.stock) {
                cart[id] = target;
            } else {
                alert("وصلت إلى الحد الأقصى للمخزون المتوفر!");
            }

            saveToStorage();
            render();
            if (document.getElementById('cart-modal').style.display === 'flex') {
                renderCartItems();
            }
        }

        function updateCartBadge() {
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            const isOpen = modal.style.display === 'flex';
            modal.style.display = isOpen ? 'none' : 'flex';
            if (!isOpen) renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            let itemsHtml = '';

            const keys = Object.keys(cart);
            if (keys.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">السلة فارغة حالياً</p>';
                document.getElementById('cart-total-price').innerText = '₪0.00';
                return;
            }

            keys.forEach(id => {
                const count = cart[id];
                const item = products.find(p => p.id == id);
                if (item && count > 0) {
                    const itemTotal = item.price * count;
                    total += itemTotal;
                    itemsHtml += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.title}</strong>
                                <div style="font-size:0.8rem; color:#666;">₪${item.price.toFixed(2)} × ${count}</div>
                            </div>
                            <div class="cart-controls">
                                <button onclick="updateQty(${id}, -1)">-</button>
                                <span>${count}</span>
                                <button onclick="updateQty(${id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                }
            });

            list.innerHTML = itemsHtml;
            document.getElementById('cart-total-price').innerText = `₪${total.toFixed(2)}`;
        }

        function sendWhatsAppOrder() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let message = "طلب جديد من العروبة أون لاين:\n\n";
            let total = 0;

            keys.forEach(id => {
                const count = cart[id];
                const item = products.find(p => p.id == id);
                if (item && count > 0) {
                    const sum = item.price * count;
                    total += sum;
                    message += `• ${item.title} (${count} حبة) = ₪${sum.toFixed(2)}\n`;
                }
            });

            message += `\nالمجموع الكلي: ₪${total.toFixed(2)}`;
            
            // رقم الواتساب الخاص بالعروبة أون لاين
            const phone = "972546288791"; 
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function saveProduct() {
            const id = document.getElementById('p-id').value;
            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const fileInput = document.getElementById('p-file');

            if (!title || isNaN(price) || isNaN(stock)) {
                alert("يرجى إدخال البيانات كاملة!");
                return;
            }

            const processSave = (imgUrl) => {
                if (id) {
                    const index = products.findIndex(p => p.id == id);
                    if (index !== -1) {
                        products[index].title = title;
                        products[index].price = price;
                        products[index].stock = stock;
                        if (imgUrl) products[index].img = imgUrl;
                    }
                } else {
                    products.push({
                        id: Date.now(),
                        title: title,
                        price: price,
                        stock: stock,
                        img: imgUrl || 'https://via.placeholder.com/150'
                    });
                }
                saveToStorage();
                resetForm();
                render();
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) { processSave(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                const existing = products.find(p => p.id == id);
                processSave(existing ? existing.img : null);
            }
        }

        function editProduct(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;

            document.getElementById('p-id').value = item.id;
            document.getElementById('p-title').value = item.title;
            document.getElementById('p-price').value = item.price;
            document.getElementById('p-stock').value = item.stock;
            document.getElementById('panel-title').innerText = "✏️ تعديل غرض";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (confirm("هل أنت تأكد من حذف هذا الغرض؟")) {
                products = products.filter(p => p.id !== id);
                delete cart[id];
                saveToStorage();
                render();
            }
        }

        function resetForm() {
            document.getElementById('p-id').value = '';
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-stock').value = '';
            document.getElementById('p-file').value = '';
            document.getElementById('panel-title').innerText = "➕ إضافة غرض جديد";
        }

        render();
    </script>
</body>
</html>
