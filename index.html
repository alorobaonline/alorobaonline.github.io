<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة أونلاين - السوبر ماركت الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #609b15;
            --accent-green: #4e8010;
            --light-bg: #f4f6f5;
            --border-color: #eaeaea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; text-rendering: optimizeLegibility; }
        body { background-color: var(--light-bg); color: #1f2937; padding-bottom: 90px; }
        .store-container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        .store-header { background: var(--primary-green); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .store-title { font-size: 1.15rem; font-weight: 900; }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .admin-link { background: rgba(255,255,255,0.2); color: white; padding: 5px 10px; border-radius: 8px; text-decoration: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; border: none; }

        .search-bar-container { padding: 12px 15px; background: white; }
        .search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.85rem; font-weight: 600; outline: none; background: #fafafa; }

        .banner-slider { padding: 0 15px; margin-bottom: 15px; }
        .banner-card { background: var(--primary-green); color: white; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .banner-text h2 { font-size: 1rem; font-weight: 900; margin-bottom: 4px; }
        .banner-text p { font-size: 0.8rem; font-weight: 600; opacity: 0.95; }
        .banner-img { width: 60px; height: 60px; object-fit: contain; background: white; border-radius: 50%; padding: 3px; }

        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 15px 10px 15px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: white; border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; cursor: pointer; color: #334155; display: flex; align-items: center; gap: 4px; }
        .cat-chip.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }

        .horizontal-section { margin-bottom: 20px; padding: 0 15px; }
        .horizontal-section-title { font-size: 0.95rem; font-weight: 900; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .section-category-title { font-size: 0.95rem; font-weight: 900; display: flex; align-items: center; gap: 5px; }
        .category-text-gradient { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-view-all { font-size: 0.76rem; font-weight: 900; background: linear-gradient(135deg, #ff8c00 0%, #ff4500 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }

        .products-horizontal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-behavior: smooth; scrollbar-width: none; }
        .products-horizontal-scroll::-webkit-scrollbar { display: none; }

        .product-card { min-width: 145px; max-width: 145px; background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        .product-img-box { width: 100%; height: 110px; position: relative; display: flex; align-items: center; justify-content: center; background: #ffffff; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-name { font-size: 0.8rem; font-weight: 700; color: #222; margin-bottom: 4px; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .product-weight { font-size: 0.7rem; font-weight: 600; color: #666; margin-bottom: 8px; }
        .product-price-top { margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .price-text { font-size: 1.15rem; font-weight: 900; background: linear-gradient(135deg, #ff8c00 0%, #ff4500 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .old-price { font-size: 0.7rem; font-weight: 600; color: #9ca3af; text-decoration: line-through; }
        
        .add-to-cart-btn { background: var(--accent-green); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .quantity-control-full { display: flex; align-items: center; justify-content: space-between; background-color: var(--accent-green); border-radius: 8px; padding: 2px 10px; color: white; width: 100%; height: 32px; margin-top: auto; }
        .quantity-control-full .qty-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; font-weight: 900; }
        .quantity-control-full .qty-display { font-weight: 900; font-size: 0.9rem; text-align: center; }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px; }
        .products-grid .product-card { min-width: 100%; max-width: 100%; }

        /* شريط السلة السفلي ينتقل لصفحة cart.html */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary-green); color: white; padding: 14px 20px; display: none; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto; border-top-left-radius: 16px; border-top-right-radius: 16px; z-index: 100; text-decoration: none; }
        
        .image-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 300; max-width: 480px; margin: 0 auto; padding: 20px; }
        .image-modal-content { background: white; width: 100%; border-radius: 16px; padding: 15px; text-align: center; position: relative; }
        .image-modal-content img { max-width: 100%; max-height: 60vh; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.getDoc = getDoc;
        window.query = query;
        window.where = where;
        window.onSnapshot = onSnapshot;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="store-container">
    <div class="store-header">
        <div class="store-title">🛒 العروبة أونلاين</div>
        <div class="header-actions">
            <a href="admin.html" class="admin-link">لوحة التحكم ⚙️</a>
        </div>
    </div>

    <div class="search-bar-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي منتج تريده..." oninput="filterProducts()">
    </div>

    <div class="banner-slider" id="bannerContainer">
        <div class="banner-card">
            <div class="banner-text">
                <span style="font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;" id="bannerTag">سوبر ماركت العروبة</span>
                <h2 id="bannerTitle">أهلاً بك في متجرنا</h2>
                <p>تسوّق أفضل المنتجات الطازجة</p>
            </div>
            <img src="logo.png" class="banner-img" id="bannerImg" onerror="this.onerror=null; this.src='logo.png';">
        </div>
    </div>

    <div class="categories-scroll" id="categoriesScrollContainer"></div>
    <div id="storeMainContent"></div>
    
    <div id="loadMoreIndicator" style="text-align: center; padding: 15px; font-size: 0.75rem; color: #64748b; font-weight: 700; display: none;">
        جاري تحميل المزيد من الفئات... ⬇️
    </div>
</div>

<!-- شريط السلة السفلي ينقل لصفحة cart.html -->
<a href="cart.html" class="cart-bar" id="cartBar">
    <div style="font-size: 0.9rem; font-weight: 900;">للذهاب للدفع 🛒</div>
    <div style="font-size: 1rem; font-weight: 900;" id="cartTotalText">0.00 ₪</div>
</a>

<div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <div class="image-modal-content" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 id="zoomImageTitle" style="font-size: 0.9rem; font-weight: 900; color: var(--primary-green);"></h3>
            <button onclick="closeImageModal()" style="background:none; border:none; font-size: 1.1rem; cursor:pointer; font-weight: 900;">✕</button>
        </div>
        <img id="zoomImageSrc" src="" alt="صورة المنتج" onerror="this.onerror=null; this.src='logo.png';">
    </div>
</div>

<script>
    let products = [];
    let categories = [{ name: "الكل", icon: "🛍️" }];
    let bannerSlides = [{ tag: "سوبر ماركت العروبة", title: "كل احتياجات بيتك في مكان واحد", img: "logo.png" }];
    let layoutData = { firstSection: "", secondSection: "", thirdSection: "" };
    let cart = [];
    let visibleSectionsLimit = 2;
    let currentCategory = "الكل";

    function loadCartFromLocalStorage() {
        let savedCart = localStorage.getItem('aloroba_cart');
        if (savedCart) {
            try { cart = JSON.parse(savedCart); } catch (e) { cart = []; }
        }
    }

    function saveCartToLocalStorage() {
        localStorage.setItem('aloroba_cart', JSON.stringify(cart));
    }

    window.addEventListener('firebase-ready', async function() {
        loadCartFromLocalStorage();
        await loadStaticSettingsFromCloud();
        initRealtimeListeners();
        updateCartStateUI();
    });

    async function loadStaticSettingsFromCloud() {
        try {
            const [layoutDoc, bannerDoc] = await Promise.all([
                window.getDoc(window.doc(window.db, "settings", "layout")),
                window.getDoc(window.doc(window.db, "settings", "banner"))
            ]);
            if(layoutDoc.exists()) layoutData = layoutDoc.data();
            if(bannerDoc.exists() && bannerDoc.data().slides) bannerSlides = bannerDoc.data().slides;
            renderBanner();
        } catch(e) {}
    }

    function initRealtimeListeners() {
        window.onSnapshot(window.collection(window.db, "products"), (prodSnap) => {
            products = [];
            prodSnap.forEach(docSnap => { products.push({ id: docSnap.id, ...docSnap.data() }); });
            renderMainStoreContent();
            updateCartStateUI();
        });

        window.onSnapshot(window.collection(window.db, "categories"), (catSnap) => {
            if(!catSnap.empty) {
                categories = [{ name: "الكل", icon: "🛍️" }];
                catSnap.forEach(docSnap => {
                    let catData = docSnap.data();
                    if(catData.name && catData.name !== "الكل") categories.push(catData);
                });
            }
            renderCategoriesScroll();
            renderMainStoreContent();
        });
    }

    function renderBanner() {
        if(bannerSlides.length === 0) return;
        let slide = bannerSlides[0];
        document.getElementById('bannerTag').innerText = slide.tag || 'سوبر ماركت العروبة';
        document.getElementById('bannerTitle').innerText = slide.title || 'أهلاً بك';
        document.getElementById('bannerImg').src = slide.img || 'logo.png';
    }

    function renderCategoriesScroll() {
        const container = document.getElementById('categoriesScrollContainer');
        container.innerHTML = '';
        categories.forEach(cat => {
            let activeClass = currentCategory === cat.name ? 'active' : '';
            container.innerHTML += `
                <div class="cat-chip ${activeClass}" onclick="selectCategory('${cat.name}')">
                    <span>${cat.icon}</span> ${cat.name}
                </div>
            `;
        });
    }

    function selectCategory(catName) {
        currentCategory = catName;
        visibleSectionsLimit = 2;
        renderCategoriesScroll();
        renderMainStoreContent();
    }

    function productBelongsToCategory(p, catName) {
        if (!p.categories) return false;
        if (Array.isArray(p.categories)) return p.categories.includes(catName);
        return p.categories.includes(catName);
    }

    function renderMainStoreContent() {
        const container = document.getElementById('storeMainContent');
        if (products.length === 0) return;

        let query = document.getElementById('searchInput').value.trim().toLowerCase();
        let htmlParts = [];

        if(query !== "" || currentCategory !== "الكل") {
            document.getElementById('loadMoreIndicator').style.display = 'none';
            let filtered = products.filter(p => {
                let matchesQuery = p.name.toLowerCase().includes(query);
                let matchesCat = currentCategory === "الكل" || productBelongsToCategory(p, currentCategory);
                return matchesQuery && matchesCat;
            });

            let gridHtml = `<div class="products-grid" style="margin-top: 10px;">`;
            if(filtered.length === 0) {
                gridHtml = `<p style="text-align: center; color: #888; font-size: 0.8rem; font-weight: 600; padding: 20px;">لا توجد منتجات مطابقة</p>`;
            } else {
                filtered.forEach(p => { gridHtml += createProductCardHtml(p); });
                gridHtml += `</div>`;
            }
            container.innerHTML = gridHtml;
            return;
        }

        let sectionsList = [layoutData.firstSection, layoutData.secondSection, layoutData.thirdSection].filter(Boolean);
        categories.forEach(cat => { if(cat.name !== "الكل" && !sectionsList.includes(cat.name)) sectionsList.push(cat.name); });

        let nonEmpSections = sectionsList.filter(secName => products.some(p => productBelongsToCategory(p, secName)));
        let activeSections = nonEmpSections.slice(0, visibleSectionsLimit);

        activeSections.forEach(secName => {
            let secProds = products.filter(p => productBelongsToCategory(p, secName)).slice(0, 9);
            if(secProds.length === 0) return;

            let catObj = categories.find(c => c.name === secName);
            let icon = catObj ? catObj.icon : '🏷️';

            let secHtml = `
                <div class="horizontal-section">
                    <div class="horizontal-section-title">
                        <span class="section-category-title"><span>${icon}</span> <span class="category-text-gradient">${secName}</span></span>
                        <span class="section-view-all" onclick="selectCategory('${secName}')">عرض الكل ←</span>
                    </div>
                    <div class="products-horizontal-scroll">
            `;
            secProds.forEach(p => { secHtml += createProductCardHtml(p); });
            secHtml += `</div></div>`;
            htmlParts.push(secHtml);
        });

        container.innerHTML = htmlParts.join('');
    }

    function createProductCardHtml(p) {
        let priceDisplay = `${p.price} ₪`;
        let oldPriceDisplay = "";
        if(p.salePrice !== undefined && p.salePrice !== "") {
            priceDisplay = `${p.salePrice} ₪`;
            oldPriceDisplay = `<span class="old-price">${p.price} ₪</span>`;
        }

        let cartItem = cart.find(item => item.id == p.id);
        let qty = cartItem ? cartItem.quantity : 0;
        let hasQty = qty > 0;

        return `
            <div class="product-card" data-product-id="${p.id}">
                <div>
                    <div class="product-img-box" onclick='openImageModal("${p.img}", "${p.name}")'>
                        <img src="${p.img || 'logo.png'}" class="product-img" loading="lazy" onerror="this.onerror=null; this.src='logo.png';">
                    </div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-weight">${p.weight || 'حبة'}</div>
                    <div class="product-price-top" style="${hasQty ? 'display: flex;' : 'display: none;'}">
                        <span class="price-text">${priceDisplay}</span>
                        ${oldPriceDisplay}
                    </div>
                </div>
                <div>
                    <div class="product-price-row" style="${hasQty ? 'display: none;' : 'display: flex;'}">
                        <div>
                            <span class="price-text">${priceDisplay}</span>
                            ${oldPriceDisplay}
                        </div>
                        <button class="add-to-cart-btn" onclick='increaseCartQty("${p.id}")'>+</button>
                    </div>
                    <div class="quantity-control-full" style="${hasQty ? 'display: flex;' : 'display: none;'}">
                        <button class="qty-btn" onclick='decreaseCartQty("${p.id}")'>-</button>
                        <span class="qty-display">${qty}</span>
                        <button class="qty-btn" onclick='increaseCartQty("${p.id}")'>+</button>
                    </div>
                </div>
            </div>
        `;
    }

    function filterProducts() {
        renderMainStoreContent();
    }

    function increaseCartQty(prodId) {
        let p = products.find(item => item.id == prodId);
        if(!p) return;
        let finalPrice = (p.salePrice !== undefined && p.salePrice !== "") ? Number(p.salePrice) : Number(p.price);
        
        let existing = cart.find(item => item.id == prodId);
        if(existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id: p.id, name: p.name, price: finalPrice, quantity: 1, img: p.img || '' });
        }
        saveCartToLocalStorage();
        updateCartStateUI();
        updateProductCardDOM(prodId);
    }

    function decreaseCartQty(prodId) {
        let existingIndex = cart.findIndex(item => item.id == prodId);
        if(existingIndex > -1) {
            if(cart[existingIndex].quantity > 1) {
                cart[existingIndex].quantity -= 1;
            } else {
                cart.splice(existingIndex, 1);
            }
        }
        saveCartToLocalStorage();
        updateCartStateUI();
        updateProductCardDOM(prodId);
    }

    function updateProductCardDOM(prodId) {
        let p = products.find(item => item.id == prodId);
        if(!p) return;
        let cards = document.querySelectorAll(`.product-card[data-product-id="${prodId}"]`);
        cards.forEach(card => {
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = createProductCardHtml(p);
            card.outerHTML = tempDiv.firstElementChild.outerHTML;
        });
    }

    function updateCartStateUI() {
        let totalCount = 0;
        let totalPrice = 0;
        cart.forEach(item => {
            totalCount += item.quantity;
            totalPrice += item.price * item.quantity;
        });
        document.getElementById('cartTotalText').innerText = totalPrice.toFixed(2) + " ₪";
        document.getElementById('cartBar').style.display = totalCount > 0 ? 'flex' : 'none';
    }

    function openImageModal(imgUrl, title) {
        document.getElementById('zoomImageSrc').src = imgUrl || 'logo.png';
        document.getElementById('zoomImageTitle').innerText = title;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>
</body>
</html>
