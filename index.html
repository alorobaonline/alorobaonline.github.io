<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة أونلاين - السوبر ماركت الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding-bottom: 80px; }

        .store-container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: var(--shadow-card); position: relative; }
        
        .store-header { background: var(--primary-green); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .store-title { font-size: 1.1rem; font-weight: 900; }
        .admin-link { background: rgba(255,255,255,0.2); color: white; padding: 5px 10px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: bold; }

        .search-bar-container { padding: 12px 15px; background: white; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.8rem; outline: none; background: #f8fafc; }

        /* البانر المتحرك */
        .banner-slider { padding: 0 15px; margin-bottom: 15px; }
        .banner-card { background: linear-gradient(135deg, #1b4d2e, #3a7d44); color: white; border-radius: 14px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .banner-text h2 { font-size: 0.95rem; font-weight: 900; margin-bottom: 4px; }
        .banner-text p { font-size: 0.75rem; opacity: 0.9; }
        .banner-img { width: 50px; height: 50px; object-fit: contain; background: white; border-radius: 50%; padding: 5px; }

        /* الأقسام الدائرية السريعة */
        .categories-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 15px 10px 15px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; cursor: pointer; color: #334155; display: flex; align-items: center; gap: 4px; }
        .cat-chip.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }

        /* أقسام العرض الأفقي للمتجر */
        .horizontal-section { margin-bottom: 20px; padding: 0 15px; }
        .horizontal-section-title { font-size: 0.9rem; font-weight: 900; color: var(--primary-green); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .products-horizontal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .products-horizontal-scroll::-webkit-scrollbar { display: none; }

        /* بطاقة المنتج */
        .product-card { min-width: 130px; max-width: 130px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0; }
        .product-img-box { width: 100%; height: 90px; position: relative; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 8px; margin-bottom: 6px; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-name { font-size: 0.75rem; font-weight: 800; color: #1f2937; margin-bottom: 4px; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .product-weight { font-size: 0.65rem; color: #6b7280; margin-bottom: 6px; }
        .product-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price-text { font-size: 0.8rem; font-weight: 900; color: var(--primary-green); }
        .old-price { font-size: 0.65rem; color: #9ca3af; text-decoration: line-through; margin-left: 4px; }
        .add-to-cart-btn { background: var(--accent-green); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* شبكة المنتجات العادية */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px; }
        .products-grid .product-card { min-width: 100%; max-width: 100%; }

        /* سلة المشتريات السفلية */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary-green); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto; border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100; cursor: pointer; }
        
        /* نافذة السلة الممنوعة / اتمام الطلب */
        .cart-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 200; max-width: 480px; margin: 0 auto; }
        .cart-modal-content { background: white; width: 100%; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.75rem; margin-bottom: 8px; outline: none; }
        .btn-main { width: 100%; background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.doc = doc;
        window.getDoc = getDoc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="store-container">
    <!-- الهيدر -->
    <div class="store-header">
        <div class="store-title">🛒 العروبة أونلاين</div>
        <a href="admin.html" class="admin-link">لوحة التحكم ⚙️</a>
    </div>

    <!-- شريط البحث -->
    <div class="search-bar-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي منتج تريده..." oninput="filterProducts()">
    </div>

    <!-- البانر المتحرك -->
    <div class="banner-slider" id="bannerContainer">
        <div class="banner-card">
            <div class="banner-text">
                <span style="font-size: 0.65rem; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;" id="bannerTag">سوبر ماركت العروبة</span>
                <h2 id="bannerTitle">أهلاً بك في متجرنا</h2>
                <p>جاري تحميل العروض...</p>
            </div>
            <img src="https://i.ibb.co/3m1K2wP/basket.png" class="banner-img" id="bannerImg">
        </div>
    </div>

    <!-- الأقسام الدائرية -->
    <div class="categories-scroll" id="categoriesScrollContainer"></div>

    <!-- المحتوى الرئيسي (أقسام أفقية أو شبكة منتجات حسب الاختيار) -->
    <div id="storeMainContent"></div>
</div>

<!-- شريط السلة السفلي -->
<div class="cart-bar" onclick="openCartModal()">
    <div>
        <div style="font-size: 0.7rem; opacity: 0.8;">سلة المشتريات</div>
        <div style="font-size: 0.95rem; font-weight: bold;" id="cartTotalText">0.00 ₪</div>
    </div>
    <div style="background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: bold;">
        عرض السلة (<span id="cartCountBadge">0</span>) 🛍️
    </div>
</div>

<!-- نافذة تفاصيل السلة وإتمام الطلب -->
<div class="cart-modal" id="cartModal">
    <div class="cart-modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="font-size: 0.9rem; color: var(--primary-green);">🛒 سلة المشتريات</h3>
            <button onclick="closeCartModal()" style="background:none; border:none; font-size: 1rem; cursor:pointer;">✕</button>
        </div>
        <div id="cartItemsList" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;"></div>
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
        <div style="font-size: 0.75rem; font-weight: bold; margin-bottom: 6px;">معلومات التوصيل:</div>
        <input type="text" id="customerName" class="form-control" placeholder="اسم الزبون الكريم">
        <input type="tel" id="customerPhone" class="form-control" placeholder="رقم الهاتف">
        <input type="text" id="customerAddress" class="form-control" placeholder="العنوان (المدينة، الحي، الشارع)">
        <button class="btn-main" onclick="submitOrder()">إتمام وتأكيد الطلب 🚀</button>
    </div>
</div>

<script>
    let products = [];
    let categories = [{ name: "الكل", icon: "🛍️" }];
    let bannerSlides = [{ tag: "سوبر ماركت العروبة", title: "كل احتياجات بيتك في مكان واحد", img: "https://i.ibb.co/3m1K2wP/basket.png" }];
    let layoutData = { firstSection: "عروض", secondSection: "ألبان", thirdSection: "معلبات" };
    let cart = [];
    let currentCategory = "الكل";

    window.addEventListener('firebase-ready', async function() {
        await loadStoreDataFromCloud();
    });

    async function loadStoreDataFromCloud() {
        try {
            // 1. جلب المنتجات
            const prodSnap = await window.getDocs(window.collection(window.db, "products"));
            products = [];
            prodSnap.forEach(docSnap => {
                products.push({ id: docSnap.id, ...docSnap.data() });
            });

            // 2. جلب الأقسام
            const catSnap = await window.getDocs(window.collection(window.db, "categories"));
            if(!catSnap.empty) {
                categories = [];
                catSnap.forEach(docSnap => {
                    categories.push(docSnap.data());
                });
            }

            // 3. جلب إعدادات العرض الأفقي
            const layoutDoc = await window.getDoc(window.doc(window.db, "settings", "layout"));
            if(layoutDoc.exists()) layoutData = layoutDoc.data();

            // 4. جلب البانر
            const bannerDoc = await window.getDoc(window.doc(window.db, "settings", "banner"));
            if(bannerDoc.exists() && bannerDoc.data().slides) {
                bannerSlides = bannerDoc.data().slides;
            }

            renderStoreUI();
        } catch(e) {
            console.error("خطأ في جلب بيانات المتجر: ", e);
        }
    }

    function renderStoreUI() {
        renderCategoriesScroll();
        renderBanner();
        renderMainStoreContent();
    }

    function renderBanner() {
        if(bannerSlides.length === 0) return;
        let slide = bannerSlides[0]; // عرض الشريحة الأولى كمثال
        document.getElementById('bannerTag').innerText = slide.tag || '';
        document.getElementById('bannerTitle').innerText = slide.title || '';
        if(slide.img) document.getElementById('bannerImg').src = slide.img;
    }

    function renderCategoriesScroll() {
        const container = document.getElementById('categoriesScrollContainer');
        container.innerHTML = '';
        categories.forEach(cat => {
            let activeClass = currentCategory === cat.name ? 'active' : '';
            container.innerHTML += `
                <div class="cat-chip ${activeClass}" onclick="selectCategory('${cat.name}')">
                    <span>${cat.icon}</span> ${cat.name}
                </div>
            `;
        });
    }

    function selectCategory(catName) {
        currentCategory = catName;
        renderCategoriesScroll();
        renderMainStoreContent();
    }

    function renderMainStoreContent() {
        const container = document.getElementById('storeMainContent');
        container.innerHTML = '';

        let query = document.getElementById('searchInput').value.trim().toLowerCase();

        // إذا كان المستخدم يبحث أو اختار قسماً غير "الكل"، اعرض شبكة منتجات عادية
        if(query !== "" || currentCategory !== "الكل") {
            let filtered = products.filter(p => {
                let matchesQuery = p.name.toLowerCase().includes(query);
                let matchesCat = currentCategory === "الكل" || (p.categories && p.categories.includes(currentCategory));
                return matchesQuery && matchesCat;
            });

            let gridHtml = `<div class="products-grid" style="margin-top: 10px;">`;
            if(filtered.length === 0) {
                gridHtml = `<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد منتجات مطابقة</p>`;
            } else {
                filtered.forEach(p => {
                    gridHtml += createProductCardHtml(p);
                });
                gridHtml += `</div>`;
            }
            container.innerHTML = gridHtml;
            return;
        }

        // العرض الافتراضي: عرض الصفوف الأفقية الثلاثة التي حددتها في لوحة التحكم
        let sectionsToShow = [layoutData.firstSection, layoutData.secondSection, layoutData.thirdSection];
        
        sectionsToShow.forEach(secName => {
            if(!secName) return;
            let secProds = products.filter(p => p.categories && p.categories.includes(secName));
            if(secProds.length === 0) return;

            let catObj = categories.find(c => c.name === secName);
            let icon = catObj ? catObj.icon : '🏷️';

            let secHtml = `
                <div class="horizontal-section">
                    <div class="horizontal-section-title">
                        <span>${icon} ${secName}</span>
                        <span style="font-size: 0.65rem; color: #6b7280; cursor: pointer;" onclick="selectCategory('${secName}')">عرض الكل ←</span>
                    </div>
                    <div class="products-horizontal-scroll">
            `;

            secProds.forEach(p => {
                secHtml += createProductCardHtml(p);
            });

            secHtml += `</div></div>`;
            container.innerHTML += secHtml;
        });
    }

    function createProductCardHtml(p) {
        let priceDisplay = `${p.price} ₪`;
        let oldPriceDisplay = "";
        if(p.salePrice !== undefined && p.salePrice !== "") {
            priceDisplay = `${p.salePrice} ₪`;
            oldPriceDisplay = `<span class="old-price">${p.price} ₪</span>`;
        }

        return `
            <div class="product-card">
                <div>
                    <div class="product-img-box">
                        <img src="${p.img}" class="product-img" onerror="this.src='https://i.ibb.co/3m1K2wP/basket.png'">
                    </div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-weight">${p.weight || 'حبة'}</div>
                </div>
                <div class="product-price-row">
                    <div>
                        <span class="price-text">${priceDisplay}</span>
                        ${oldPriceDisplay}
                    </div>
                    <button class="add-to-cart-btn" onclick='addToCart("${p.id}")'>+</button>
                </div>
            </div>
        `;
    }

    function filterProducts() {
        renderMainStoreContent();
    }

    function addToCart(prodId) {
        let p = products.find(item => item.id == prodId);
        if(!p) return;
        let finalPrice = (p.salePrice !== undefined && p.salePrice !== "") ? p.salePrice : p.price;
        cart.push({ id: p.id, name: p.name, price: finalPrice });
        updateCartUI();
    }

    function updateCartUI() {
        let total = 0;
        cart.forEach(item => total += item.price);
        document.getElementById('cartTotalText').innerText = total.toFixed(2) + " ₪";
        document.getElementById('cartCountBadge').innerText = cart.length;
    }

    function openCartModal() {
        if(cart.length === 0) {
            alert("السلة فارغة حالياً!");
            return;
        }
        let listContainer = document.getElementById('cartItemsList');
        listContainer.innerHTML = '';
        cart.forEach((item, index) => {
            listContainer.innerHTML += `
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 6px; background: #f8fafc; padding: 5px; border-radius: 6px;">
                    <span>${item.name}</span>
                    <span><b>${item.price} ₪</b></span>
                </div>
            `;
        });
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCartModal() {
        document.getElementById('cartModal').style.display = 'none';
    }

    async function submitOrder() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if(!name || !phone || !address) {
            alert("الرجاء إكمال بيانات التوصيل (الاسم، الهاتف، العنوان)");
            return;
        }

        let total = 0;
        cart.forEach(i => total += i.price);

        const newOrder = {
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            items: cart,
            total: total,
            status: "جديد",
            timestamp: new Date().toISOString()
        };

        try {
            await window.addDoc(window.collection(window.db, "orders"), newOrder);
            alert("تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً 🚀");
            cart = [];
            updateCartUI();
            closeCartModal();
        } catch(e) {
            alert("حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.");
        }
    }
</script>
</body>
</html>
