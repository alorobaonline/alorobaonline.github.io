<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة أون لاين</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <!-- مكتبة قراءة الباركود -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        :root {
            --primary-green: #68a633;
            --accent-orange: #f35b04;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-pill: 50px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 50px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-color);
            min-height: 100vh;
        }

        .header {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-dark);
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-badge {
            background-color: var(--primary-green);
            color: white;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-admin-toggle {
            background-color: #2196f3 !important;
            color: white !important;
            border: none !important;
            padding: 8px 14px !important;
            border-radius: var(--radius-pill) !important;
            font-size: 0.85rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
        }

        .admin-panel {
            background: white;
            margin: 15px 16px;
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 2px dashed #2196f3;
            display: none;
        }

        .admin-panel.active {
            display: block !important;
        }

        .admin-panel h3 {
            font-size: 1rem;
            color: #1976d2;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
        }

        .barcode-row {
            display: flex;
            gap: 6px;
        }

        .btn-barcode {
            background: #607d8b;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        /* حاوية معاينة الصورة في الإدارة */
        .image-preview-container {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            background: #f8fafc;
            padding: 8px;
            border-radius: var(--radius-md);
            border: 1px solid #e2e8f0;
        }
        .image-preview-container img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
            background: white;
            border: 1px solid #cbd5e1;
        }
        .image-preview-text {
            font-size: 0.8rem;
            color: #059669;
            font-weight: bold;
        }

        .btn-submit {
            background: #2196f3;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        #scanner-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #scanner-container video {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
        }
        .btn-close-scanner {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .card-img-container {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: var(--radius-md);
            background: #f9fafb;
        }

        .card-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-orange);
            margin-bottom: 8px;
        }

        .btn-add {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .card-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-green);
            color: white;
            border-radius: var(--radius-md);
            padding: 3px;
        }

        .counter-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            width: 36px;
            height: 34px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
        }

        .counter-value {
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff;
            padding: 0 8px;
        }

        .admin-actions {
            display: none;
            gap: 5px;
            margin-top: 8px;
        }

        .admin-actions.active {
            display: flex !important;
        }

        .btn-card-edit, .btn-card-delete {
            border: none;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            color: white;
        }
        .btn-card-edit { background: #ff9800; }
        .btn-card-delete { background: #f44336; }

        .cart-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .cart-content {
            background: white;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-cart {
            background: #f0f0f0;
            border: none;
            width: 30px; height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .cart-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: bold;
            font-size: 1rem;
            margin-top: 15px;
            cursor: pointer;
        }
        
        .btn-clear-cart {
            background-color: #ff5252;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: var(--radius-md);
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="cart-badge" onclick="toggleCartModal()">
                🛒 <span id="cart-count">0</span>
            </div>
            <div class="header-actions">
                <button class="btn-admin-toggle" id="admin-toggle-btn" type="button">⚙️ الإدارة</button>
            </div>
            <div class="brand">
                <span class="brand-title">العروبة أون لاين</span>
                <span class="brand-subtitle">توصيل سريع • رهط</span>
            </div>
        </header>

        <!-- لوحة الإدارة -->
        <div class="admin-panel" id="admin-panel">
            <h3 id="panel-title">➕ إضافة منتج جديد</h3>
            <input type="hidden" id="p-id">
            
            <div class="form-group">
                <label>رقم / كود الباركود (اختياري)</label>
                <div class="barcode-row">
                    <input type="text" id="p-barcode" placeholder="أدخل الكود أو امسحه">
                    <button class="btn-barcode" type="button" onclick="startBarcodeScanner()">📷 مسح الباركود</button>
                </div>
            </div>

            <div class="form-group">
                <label>اسم المنتج بالعربي</label>
                <input type="text" id="p-title" placeholder="مثال: حليب طازج">
            </div>

            <div class="form-group">
                <label>السعر (₪)</label>
                <input type="number" id="p-price" step="0.10" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>الكمية المتوفرة</label>
                <input type="number" id="p-stock" value="50" placeholder="50">
            </div>

            <div class="form-group">
                <label>صورة المنتج من الهاتف</label>
                <input type="file" id="p-file" accept="image/*" onchange="previewImage(event)">
                <!-- صندوق معاينة الصورة -->
                <div class="image-preview-container" id="image-preview-box">
                    <img id="preview-img-tag" src="" alt="معاينة">
                    <span class="image-preview-text">✓ تم اختيار الصورة بنجاح</span>
                </div>
            </div>

            <button class="btn-submit" type="button" onclick="saveProduct()">حفظ ونشر على السحابة</button>
        </div>

        <!-- نافذة الكاميرا للباركود -->
        <div id="scanner-container">
            <video id="interactive" class="viewport"></video>
            <button class="btn-close-scanner" type="button" onclick="stopBarcodeScanner()">إغلاق الكاميرا</button>
        </div>

        <div class="products-grid" id="products-grid">
            <p style="grid-column: span 2; text-align: center; color: #888; padding: 20px;">جاري تحميل المنتجات...</p>
        </div>

        <div class="cart-modal" id="cart-modal">
            <div class="cart-content">
                <div class="cart-header">
                    <h3>🛒 سلة التسوق</h3>
                    <button class="close-cart" type="button" onclick="toggleCartModal()">✕</button>
                </div>
                <div id="cart-items-list"></div>
                <div class="cart-total">
                    <span>المجموع الكلي:</span>
                    <span id="cart-total-price">₪0.00</span>
                </div>
                <button class="btn-whatsapp" type="button" onclick="sendWhatsAppOrder()">📱 إرسال الطلب عبر الواتساب</button>
                <button class="btn-clear-cart" type="button" onclick="clearCart()">🗑️ تفريغ السلة بالكامل</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7--EMt--ZU395",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.appspot.com",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9071b76",
            measurementId: "G-F80VQ7YH77"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let products = [];
        let cart = JSON.parse(localStorage.getItem('aloroba_cart_cloud')) || {}; 
        let isAdminMode = false;
        let codeReader = null;
        let temporaryImageBase64 = null; // لتخزين الصورة مؤقتاً للمعاينة

        document.addEventListener('DOMContentLoaded', () => {
            const adminBtn = document.getElementById('admin-toggle-btn');
            if (adminBtn) {
                adminBtn.addEventListener('click', toggleAdminPanel);
            }
        });

        db.collection("products").onSnapshot((snapshot) => {
            products = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                products.push({ 
                    id: doc.id, 
                    title: data.title || 'بدون اسم',
                    price: data.price || 0,
                    stock: (data.stock !== undefined) ? data.stock : 50,
                    barcode: data.barcode || '',
                    img: (data.img && data.img.length > 50) ? data.img : 'https://via.placeholder.com/150'
                });
            });
            
            let validCart = {};
            Object.keys(cart).forEach(id => {
                if (products.some(p => p.id === id)) {
                    validCart[id] = cart[id];
                }
            });
            cart = validCart;
            localStorage.setItem('aloroba_cart_cloud', JSON.stringify(cart));

            render();
        });

        function toggleAdminPanel() {
            isAdminMode = !isAdminMode;
            const panel = document.getElementById('admin-panel');
            if (isAdminMode) {
                panel.classList.add('active');
            } else {
                panel.classList.remove('active');
                resetForm();
            }
            render();
        }

        // دالة لعرض معاينة الصورة فور اختيارها
        function previewImage(event) {
            const file = event.target.files[0];
            const previewBox = document.getElementById('image-preview-box');
            const previewImg = document.getElementById('preview-img-tag');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 250;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        temporaryImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                        previewImg.src = temporaryImageBase64;
                        previewBox.style.display = 'flex';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                previewBox.style.display = 'none';
                temporaryImageBase64 = null;
            }
        }

        function render() {
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888; padding: 20px;">لا توجد منتجات حالياً.</p>';
                updateCartBadge();
                return;
            }

            grid.innerHTML = products.map(item => {
                const countInCart = cart[item.id] || 0;
                let actionArea = '';
                
                if (item.stock <= 0) {
                    actionArea = `<button class="btn-add" disabled>نفد المخزون</button>`;
                } else if (countInCart === 0) {
                    actionArea = `<button class="btn-add" onclick="updateQty('${item.id}', 1)">+ أضف للسلة</button>`;
                } else {
                    actionArea = `
                        <div class="card-counter">
                            <button class="counter-btn" type="button" onclick="updateQty('${item.id}', -1)">-</button>
                            <span class="counter-value">${countInCart}</span>
                            <button class="counter-btn" type="button" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    `;
                }

                return `
                    <div class="card">
                        <div class="card-img-container">
                            <img src="${item.img}" alt="${item.title}">
                        </div>
                        <div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">المتوفر: <strong>${item.stock}</strong></div>
                            <div class="card-price">₪${parseFloat(item.price).toFixed(2)}</div>
                        </div>
                        ${actionArea}
                        <div class="admin-actions ${isAdminMode ? 'active' : ''}">
                            <button class="btn-card-edit" type="button" onclick="editProduct('${item.id}')">تعديل</button>
                            <button class="btn-card-delete" type="button" onclick="deleteProduct('${item.id}')">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');

            updateCartBadge();
        }

        function updateQty(id, change) {
            const item = products.find(p => p.id == id);
            const current = cart[id] || 0;
            const target = current + change;

            if (target <= 0) {
                delete cart[id];
            } else if (item && target <= item.stock) {
                cart[id] = target;
            } else {
                alert("وصلت للحد الأقصى للمخزون!");
            }

            localStorage.setItem('aloroba_cart_cloud', JSON.stringify(cart));
            render();
            if (document.getElementById('cart-modal').style.display === 'flex') {
                renderCartItems();
            }
        }

        function clearCart() {
            cart = {};
            localStorage.removeItem('aloroba_cart_cloud');
            render();
            renderCartItems();
            toggleCartModal();
        }

        function updateCartBadge() {
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            const isOpen = modal.style.display === 'flex';
            modal.style.display = isOpen ? 'none' : 'flex';
            if (!isOpen) renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cart-items-list');
            let total = 0;
            let itemsHtml = '';
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888; padding:20px;">السلة فارغة</p>';
                document.getElementById('cart-total-price').innerText = '₪0.00';
                return;
            }

            keys.forEach(id => {
                const count = cart[id];
                const item = products.find(p => p.id == id);
                if (item && count > 0) {
                    const itemTotal = item.price * count;
                    total += itemTotal;
                    itemsHtml += `
                        <div class="cart-item">
                            <div>
                                <strong>${item.title}</strong>
                                <div style="font-size:0.8rem; color:#666;">₪${Number(item.price).toFixed(2)} × ${count}</div>
                            </div>
                            <div style="font-weight:bold;">₪${itemTotal.toFixed(2)}</div>
                        </div>
                    `;
                }
            });

            list.innerHTML = itemsHtml;
            document.getElementById('cart-total-price').innerText = `₪${total.toFixed(2)}`;
        }

        function sendWhatsAppOrder() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let message = "🛒 طلب جديد من العروبة أون لاين:\n\n";
            let total = 0;

            keys.forEach(id => {
                const count = cart[id];
                const item = products.find(p => p.id == id);
                if (item && count > 0) {
                    const sum = item.price * count;
                    total += sum;
                    message += `• ${item.title} (${count} حبة) = ₪${sum.toFixed(2)}\n`;
                }
            });

            message += `\nالمجموع الكلي: ₪${total.toFixed(2)}`;
            const phone = "972546288791"; 
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function startBarcodeScanner() {
            const container = document.getElementById('scanner-container');
            container.style.display = 'flex';
            codeReader = new ZXing.BrowserBarcodeReader();
            codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                if (result) {
                    document.getElementById('p-barcode').value = result.text;
                    stopBarcodeScanner();
                }
            }).catch(err => console.error(err));
        }

        function stopBarcodeScanner() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('scanner-container').style.display = 'none';
        }

        function saveProduct() {
            const id = document.getElementById('p-id').value;
            const barcode = document.getElementById('p-barcode').value;
            const title = document.getElementById('p-title').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value) || 50;

            if (!title || isNaN(price)) {
                alert("يرجى إدخال اسم المنتج بالعربي والسعر بشكل صحيح!");
                return;
            }

            const productData = { title, price, stock, barcode };
            if (temporaryImageBase64) {
                productData.img = temporaryImageBase64;
            } else if (!id) {
                productData.img = 'https://via.placeholder.com/150';
            }

            let request;
            if (id) {
                request = db.collection("products").doc(id).update(productData);
            } else {
                request = db.collection("products").add(productData);
            }

            request.then(() => {
                resetForm();
                alert("تم الحفظ بنجاح!");
            }).catch((error) => {
                alert("خطأ أثناء الحفظ: " + error.message);
            });
        }

        function editProduct(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;

            document.getElementById('p-id').value = item.id;
            document.getElementById('p-barcode').value = item.barcode || '';
            document.getElementById('p-title').value = item.title;
            document.getElementById('p-price').value = item.price;
            document.getElementById('p-stock').value = item.stock;
            document.getElementById('panel-title').innerText = "✏️ تعديل منتج";
            
            // عرض صورة المنتج الحالي في صندوق المعاينة عند التعديل
            if (item.img && item.img.length > 50) {
                temporaryImageBase64 = item.img;
                document.getElementById('preview-img-tag').src = item.img;
                document.getElementById('image-preview-box').style.display = 'flex';
            }

            const panel = document.getElementById('admin-panel');
            panel.classList.add('active');
            isAdminMode = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (confirm("هل أنت متأكد من الحذف؟")) {
                db.collection("products").doc(id).delete().then(() => {
                    delete cart[id];
                    localStorage.setItem('aloroba_cart_cloud', JSON.stringify(cart));
                });
            }
        }

        function resetForm() {
            document.getElementById('p-id').value = '';
            document.getElementById('p-barcode').value = '';
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-stock').value = '50';
            document.getElementById('p-file').value = '';
            document.getElementById('image-preview-box').style.display = 'none';
            temporaryImageBase64 = null;
            document.getElementById('panel-title').innerText = "➕ إضافة منتج جديد";
            document.getElementById('admin-panel').classList.remove('active');
            isAdminMode = false;
        }
    </script>
</body>
</html>
