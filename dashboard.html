<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - سوبر ماركت العروبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }

        .dashboard-container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; box-shadow: var(--shadow-card); }
        
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .dash-header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; }

        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .section-box h2 { font-size: 0.85rem; margin-bottom: 10px; color: #1b4d2e; font-weight: 800; display: flex; align-items: center; gap: 5px; }

        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 700; margin-bottom: 3px; color: #4b5563; }
        .form-control { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.75rem; outline: none; background: white; }
        .form-control:focus { border-color: var(--accent-green); }

        .categories-checkbox-container {
            max-height: 130px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            background: white;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            padding: 4px 0;
            cursor: pointer;
            font-weight: 600;
            color: #374151;
        }
        .checkbox-item input {
            accent-color: var(--primary-green);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .file-upload-box { display: flex; align-items: center; gap: 8px; }
        .file-upload-box input[type="file"] { display: none; }
        .camera-btn { background: #e2e8f0; color: #1b4d2e; border: 1px solid #cbd5e1; padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .camera-btn:hover { background: #cbd5e1; }

        .btn-main { width: 100%; background: var(--primary-green); color: white; border: none; padding: 9px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; margin-top: 5px; }
        
        /* تنسيق الأزرار داخل صف المنتج ليتم وضعها بجانب بعضها بشكل مرتب */
        .product-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-size: 0.65rem; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-size: 0.65rem; cursor: pointer; font-weight: bold; white-space: nowrap; }

        .list-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 6px 10px; border-radius: 6px; margin-bottom: 5px; border: 1px solid #e2e8f0; font-size: 0.7rem; }
        
        .category-group-box { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .category-group-title { font-size: 0.8rem; font-weight: 900; color: #1b4d2e; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .category-toggle-badge { margin-right: auto; font-size: 0.7rem; background: #e2e8f0; padding: 2px 8px; border-radius: 12px; color: #334155; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; user-select: none; }
        .category-toggle-badge:hover { background: #cbd5e1; }
        
        .product-card-container { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        .product-mini-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; font-size: 0.7rem; gap: 8px; }
        .product-mini-info { display: flex; align-items: center; gap: 6px; overflow: hidden; flex: 1; }
        .product-mini-thumb { width: 32px; height: 32px; object-fit: contain; background: white; border-radius: 4px; border: 1px solid #ddd; padding: 2px; flex-shrink: 0; }
        
        .inline-edit-form { background: #eff6ff; border-top: 1px dashed #bfdbfe; padding: 10px; display: none; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="dash-header">
        <h1>⚙️ لوحة تحكم سوبر ماركت العروبة</h1>
        <a href="index.html" class="back-btn">← عودة للمتجر</a>
    </div>

    <!-- 1. إعدادات البانر الرئيسي -->
    <div class="section-box">
        <h2>📢 تخصيص البانر الرئيسي</h2>
        <div class="form-group">
            <label>عنوان البانر الرئيسي</label>
            <input type="text" id="bannerTitleInput" class="form-control" placeholder="كل احتياجات بيتك في مكان واحد">
        </div>
        <div class="form-group">
            <label>نص العرض / التاج</label>
            <input type="text" id="bannerTagInput" class="form-control" placeholder="سوبر ماركت العروبة">
        </div>
        <div class="form-group">
            <label>صورة البانر من الجهاز</label>
            <div class="file-upload-box">
                <label class="camera-btn" for="bannerFile">📷 اختر صورة البانر</label>
                <input type="file" id="bannerFile" accept="image/*" onchange="previewBannerImage(event)">
                <input type="text" id="bannerImgInput" class="form-control" placeholder="مسار الصورة أو رابطها">
            </div>
        </div>
        <button class="btn-main" onclick="saveBannerSettings()">حفظ وتحديث البانر 💾</button>
    </div>

    <!-- 2. إدارة الفئات والأقسام -->
    <div class="section-box">
        <h2>📁 إدارة الفئات (الأقسام)</h2>
        <div class="form-group">
            <label>اسم الفئة</label>
            <input type="text" id="catName" class="form-control" placeholder="مثال: لحوم، ألبان...">
        </div>
        <div class="form-group">
            <label>الأيقونة (إيموجي)</label>
            <input type="text" id="catIcon" class="form-control" placeholder="مثال: 🥩">
        </div>
        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 1;">
                <label>خلفية الأيقونة</label>
                <input type="text" id="catBg" class="form-control" value="#eaf3df">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>لون الأيقونة</label>
                <input type="text" id="catColor" class="form-control" value="#2e6930">
            </div>
        </div>
        <button class="btn-main" onclick="addCategory()">إضافة فئة جديدة ➕</button>
        <div style="margin-top: 10px;" id="adminCategoriesList"></div>
    </div>

    <!-- 3. إضافة منتج جديد -->
    <div class="section-box">
        <h2>📦 إضافة منتج أو حملة جديدة</h2>
        <div class="form-group">
            <label>اسم المنتج أو الحملة</label>
            <input type="text" id="prodName" class="form-control" placeholder="مثال: أرز تات بسمتي">
        </div>
        <div class="form-group">
            <label>الوزن أو الحجم</label>
            <input type="text" id="prodWeight" class="form-control" placeholder="مثال: 5 كجم">
        </div>
        <div class="form-group">
            <label>اختر الأقسام والفئات المطلوبة (يمكنك اختيار أكثر من فئة)</label>
            <div id="prodCategoriesCheckboxes" class="categories-checkbox-container"></div>
        </div>
        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 1;">
                <label>السعر الحالي (₪)</label>
                <input type="number" id="prodPrice" class="form-control" placeholder="22">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>السعر القديم (₪)</label>
                <input type="number" id="prodOldPrice" class="form-control" placeholder="30">
            </div>
        </div>
        <div class="form-group">
            <label>رزمة الحملة أو شارة العرض</label>
            <input type="text" id="prodOffer" class="form-control" placeholder="مثال: 3 بـ22 أو عرض خاص">
        </div>
        <div class="form-group">
            <label>صورة المنتج من الهاتف</label>
            <div class="file-upload-box">
                <label class="camera-btn" for="prodFile">📷 التقاط / اختيار صورة</label>
                <input type="file" id="prodFile" accept="image/*" onchange="previewProductImage(event)">
                <input type="text" id="prodImg" class="form-control" placeholder="مسار الصورة أو رابطها">
            </div>
        </div>
        <button class="btn-main" onclick="saveProduct()">إضافة ونشر المنتج فوراً 🚀</button>
    </div>

    <!-- 4. خانة المنتجات المقسمة حسب الفئات -->
    <div class="section-box" style="background: #edf2f7; border-color: #cbd5e1;">
        <h2>🛒 إدارة وعرض المنتجات (مقسمة حسب الأقسام)</h2>
        <div id="categorizedProductsAdminList"></div>
    </div>
</div>

<script>
    function getStoredProducts() {
        let saved = localStorage.getItem('aloroba_products');
        if (saved) {
            try { 
                let parsed = JSON.parse(saved);
                return parsed.map(p => {
                    if (!p.categories && p.category) {
                        p.categories = [p.category];
                    } else if (!p.categories) {
                        p.categories = [];
                    }
                    return p;
                });
            } catch (e) { console.error(e); }
        }
        const defaultProducts = [
            { id: 1, name: "أرز تات بسمتي", weight: "5 كجم", price: 22, oldPrice: 30, offer: "3 بـ22", img: "https://i.ibb.co/6y40H69/tat-rice.png", categories: ["معلبات", "عروض"] },
            { id: 2, name: "ماجي مرقة", weight: "قطعة", price: 10, oldPrice: 14, offer: "3 بـ22", img: "https://i.ibb.co/1q20K0v/maggi.png", categories: ["معلبات"] },
            { id: 3, name: "حليب نيدو", weight: "2500جم", price: 59, oldPrice: 75, offer: "عرض", img: "https://i.ibb.co/7Xv8L9p/nido.png", categories: ["ألبان"] }
        ];
        localStorage.setItem('aloroba_products', JSON.stringify(defaultProducts));
        return defaultProducts;
    }

    let categories = JSON.parse(localStorage.getItem('aloroba_categories')) || [
        { name: "الكل", icon: "🛍️", bg: "#eaf3df", color: "#2e6930" },
        { name: "عروض", icon: "🔥", bg: "#fee2e2", color: "#dc2626" },
        { name: "ألبان", icon: "🥛", bg: "#fef3c7", color: "#d97706" },
        { name: "معلبات", icon: "🥫", bg: "#ffedd5", color: "#c2410c" },
        { name: "خضار", icon: "🥦", bg: "#ecfdf5", color: "#059669" },
        { name: "منظفات", icon: "🧴", bg: "#f3e8ff", color: "#7e22ce" }
    ];

    let bannerData = JSON.parse(localStorage.getItem('aloroba_banner')) || {
        title: "كل احتياجات بيتك في مكان واحد",
        tag: "سوبر ماركت العروبة",
        img: "https://i.ibb.co/3m1K2wP/basket.png"
    };

    function renderAdmin() {
        let products = getStoredProducts();

        document.getElementById('bannerTitleInput').value = bannerData.title || "";
        document.getElementById('bannerTagInput').value = bannerData.tag || "";
        document.getElementById('bannerImgInput').value = bannerData.img || "";

        const checkboxesContainer = document.getElementById('prodCategoriesCheckboxes');
        checkboxesContainer.innerHTML = '';
        categories.forEach(cat => {
            if(cat.name !== "الكل") {
                checkboxesContainer.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" name="productCategoryCheck" value="${cat.name.trim()}">
                        <span>${cat.icon || ''} ${cat.name}</span>
                    </label>
                `;
            }
        });

        const catList = document.getElementById('adminCategoriesList');
        catList.innerHTML = '';
        categories.forEach((cat, index) => {
            catList.innerHTML += `
                <div class="list-item">
                    <span>${cat.icon} <b>${cat.name}</b></span>
                    ${index > 1 ? `<button class="btn-delete" onclick="deleteCategory(${index})">حذف</button>` : '<span style="font-size:0.6rem; color:#888;">الأساسية</span>'}
                </div>
            `;
        });

        const categorizedContainer = document.getElementById('categorizedProductsAdminList');
        categorizedContainer.innerHTML = '';

        let activeCategories = categories.filter(cat => cat.name !== "الكل");

        activeCategories.forEach((cat, catIdx) => {
            let catProducts = products.filter(p => p.categories && p.categories.some(c => c.trim() === cat.name.trim()));
            
            let productsHtml = '';
            if (catProducts.length === 0) {
                productsHtml = '<div style="color: #9ca3af; font-size: 0.65rem; padding: 4px; text-align: center;">لا توجد منتجات في هذا القسم</div>';
            } else {
                catProducts.forEach(p => {
                    let originalIndex = products.findIndex(item => item.id === p.id);
                    productsHtml += `
                        <div class="product-card-container">
                            <div class="product-mini-row">
                                <div class="product-mini-info">
                                    <img src="${p.img}" class="product-mini-thumb" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081986.png'">
                                    <div style="overflow: hidden;">
                                        <div style="font-weight: 800; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${p.name}</div>
                                        <div style="font-size: 0.6rem; color: #6b7280;">السعر: ${p.price} ₪ | ${p.weight || 'حبة'}</div>
                                    </div>
                                </div>
                                <div class="product-actions">
                                    <button class="btn-edit" onclick="toggleInlineEdit(${originalIndex})">تعديل ✏️</button>
                                    <button class="btn-delete" onclick="deleteProduct(${originalIndex})">حذف</button>
                                </div>
                            </div>
                            <div id="inline-edit-${originalIndex}" class="inline-edit-form">
                                <div class="form-group">
                                    <label>اسم المنتج</label>
                                    <input type="text" id="edit-name-${originalIndex}" class="form-control" value="${p.name}">
                                </div>
                                <div class="form-group">
                                    <label>الوزن أو الحجم</label>
                                    <input type="text" id="edit-weight-${originalIndex}" class="form-control" value="${p.weight || ''}">
                                </div>
                                <div class="form-group">
                                    <label>الفئات التابع لها:</label>
                                    <div style="display: flex; flex-wrap: wrap; gap: 6px; background: white; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px;">
                                        ${categories.filter(c => c.name !== "الكل").map(c => `
                                            <label style="font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer;">
                                                <input type="checkbox" class="edit-cat-check-${originalIndex}" value="${c.name}" ${p.categories && p.categories.includes(c.name) ? 'checked' : ''}>
                                                ${c.icon || ''} ${c.name}
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                                <div style="display: flex; gap: 8px;">
                                    <div class="form-group" style="flex: 1;">
                                        <label>السعر الحالي (₪)</label>
                                        <input type="number" id="edit-price-${originalIndex}" class="form-control" value="${p.price}">
                                    </div>
                                    <div class="form-group" style="flex: 1;">
                                        <label>السعر القديم (₪)</label>
                                        <input type="number" id="edit-oldprice-${originalIndex}" class="form-control" value="${p.oldPrice || ''}">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>رزمة الحملة أو العرض</label>
                                    <input type="text" id="edit-offer-${originalIndex}" class="form-control" value="${p.offer || ''}">
                                </div>
                                <div class="form-group">
                                    <label>رابط أو مسار الصورة</label>
                                    <input type="text" id="edit-img-${originalIndex}" class="form-control" value="${p.img || ''}">
                                </div>
                                <div style="display: flex; gap: 5px; margin-top: 5px;">
                                    <button class="btn-main" style="margin-top:0; background: #3b82f6;" onclick="saveInlineEdit(${originalIndex})">حفظ التعديلات ✅</button>
                                    <button class="btn-main" style="margin-top:0; background: #64748b;" onclick="toggleInlineEdit(${originalIndex})">إلغاء ❌</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            categorizedContainer.innerHTML += `
                <div class="category-group-box">
                    <div class="category-group-title">
                        <span>${cat.icon}</span>
                        <span>${cat.name}</span>
                        <div class="category-toggle-badge" onclick="toggleCategorySection(${catIdx})">
                            <span>${catProducts.length}</span>
                            <span id="arrow-icon-${catIdx}">▼</span>
                        </div>
                    </div>
                    <div id="category-content-${catIdx}" style="display: block;">
                        ${productsHtml}
                    </div>
                </div>
            `;
        });
    }

    function toggleInlineEdit(index) {
        const editBox = document.getElementById(`inline-edit-${index}`);
        if (editBox.style.display === "block") {
            editBox.style.display = "none";
        } else {
            document.querySelectorAll('.inline-edit-form').forEach(box => box.style.display = 'none');
            editBox.style.display = "block";
        }
    }

    function saveInlineEdit(index) {
        let products = getStoredProducts();
        
        const name = document.getElementById(`edit-name-${index}`).value;
        const weight = document.getElementById(`edit-weight-${index}`).value;
        const price = document.getElementById(`edit-price-${index}`).value;
        const oldPrice = document.getElementById(`edit-oldprice-${index}`).value;
        const offer = document.getElementById(`edit-offer-${index}`).value;
        const img = document.getElementById(`edit-img-${index}`).value;

        let selectedCategories = [];
        document.querySelectorAll(`.edit-cat-check-${index}:checked`).forEach(chk => {
            selectedCategories.push(chk.value);
        });

        if(!name || !price) {
            alert("الرجاء إدخال اسم المنتج والسعر على الأقل");
            return;
        }

        if(selectedCategories.length === 0) {
            alert("الرجاء اختيار فئة واحدة على الأقل للمنتج");
            return;
        }

        products[index].name = name;
        products[index].weight = weight;
        products[index].categories = selectedCategories;
        products[index].price = Number(price);
        products[index].oldPrice = oldPrice ? Number(oldPrice) : null;
        products[index].offer = offer;
        if(img) {
            products[index].img = img;
        }

        localStorage.setItem('aloroba_products', JSON.stringify(products));
        alert("تم تحديث المنتج والفئات بنجاح!");
        renderAdmin();
    }

    function toggleCategorySection(catIdx) {
        const contentBox = document.getElementById(`category-content-${catIdx}`);
        const arrowIcon = document.getElementById(`arrow-icon-${catIdx}`);
        
        if (contentBox.style.display === "none") {
            contentBox.style.display = "block";
            arrowIcon.innerText = "▼";
        } else {
            contentBox.style.display = "none";
            arrowIcon.innerText = "▲";
        }
    }

    function previewBannerImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bannerImgInput').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function previewProductImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('prodImg').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveBannerSettings() {
        bannerData.title = document.getElementById('bannerTitleInput').value;
        bannerData.tag = document.getElementById('bannerTagInput').value;
        bannerData.img = document.getElementById('bannerImgInput').value;
        localStorage.setItem('aloroba_banner', JSON.stringify(bannerData));
        alert("تم تحديث البانر الرئيسي وصورته بنجاح!");
    }

    function addCategory() {
        const name = document.getElementById('catName').value.trim();
        const icon = document.getElementById('catIcon').value.trim();
        const bg = document.getElementById('catBg').value;
        const color = document.getElementById('catColor').value;

        if(!name || !icon) {
            alert("الرجاء إدخال اسم الفئة والأيقونة");
            return;
        }

        categories.push({ name, icon, bg, color });
        localStorage.setItem('aloroba_categories', JSON.stringify(categories));
        document.getElementById('catName').value = '';
        document.getElementById('catIcon').value = '';
        renderAdmin();
        alert("تمت إضافة الفئة بنجاح!");
    }

    function deleteCategory(index) {
        if(confirm("هل أنت متأكد من حذف هذه الفئة؟")) {
            categories.splice(index, 1);
            localStorage.setItem('aloroba_categories', JSON.stringify(categories));
            renderAdmin();
        }
    }

    function saveProduct() {
        let products = getStoredProducts();
        const name = document.getElementById('prodName').value;
        const weight = document.getElementById('prodWeight').value;
        const price = document.getElementById('prodPrice').value;
        const oldPrice = document.getElementById('prodOldPrice').value;
        const offer = document.getElementById('prodOffer').value;
        const img = document.getElementById('prodImg').value;

        let selectedCategories = [];
        document.querySelectorAll('input[name="productCategoryCheck"]:checked').forEach(chk => {
            selectedCategories.push(chk.value);
        });

        if(!name || !price) {
            alert("الرجاء إدخال اسم المنتج والسعر على الأقل");
            return;
        }

        if(selectedCategories.length === 0) {
            alert("الرجاء اختيار فئة واحدة على الأقل للمنتج");
            return;
        }

        const newProd = {
            id: Date.now(),
            name,
            weight,
            categories: selectedCategories,
            price: Number(price),
            oldPrice: oldPrice ? Number(oldPrice) : null,
            offer,
            img: img || "https://cdn-icons-png.flaticon.com/512/3081/3081986.png"
        };
        products.unshift(newProd);

        localStorage.setItem('aloroba_products', JSON.stringify(products));
        
        document.getElementById('prodName').value = '';
        document.getElementById('prodWeight').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodOldPrice').value = '';
        document.getElementById('prodOffer').value = '';
        document.getElementById('prodImg').value = '';
        document.getElementById('prodFile').value = '';
        document.querySelectorAll('input[name="productCategoryCheck"]').forEach(chk => chk.checked = false);

        alert("تمت إضافة المنتج للفئات المحددة بنجاح وتحديث المتجر! 🚀");
        renderAdmin();
    }

    function deleteProduct(index) {
        if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            let products = getStoredProducts();
            products.splice(index, 1);
            localStorage.setItem('aloroba_products', JSON.stringify(products));
            renderAdmin();
        }
    }

    window.onload = () => renderAdmin();
</script>
</body>
</html>
