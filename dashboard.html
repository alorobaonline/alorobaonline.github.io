<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروبة - لوحة التحكم الشاملة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-green: #68a633;
            --bg-color: #f4f6f8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: #1f2937; padding: 15px; }
        .admin-container { max-width: 600px; margin: 0 auto; }
        .admin-header { background: white; padding: 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-top: 4px solid var(--primary-green); }
        .card-box { background: white; padding: 18px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 15px; border: 1px solid #e5e7eb; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: var(--radius-md); font-size: 0.9rem; outline: none; background: #fff; }
        .btn-main { background: var(--primary-green); color: white; border: none; width: 100%; padding: 12px; border-radius: var(--radius-md); font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .category-item, .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
        .btn-edit-sm { background: #ff9800; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .btn-del-sm { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2>العروبة - لوحة التحكم</h2>
            <a href="index.html" style="background:#e3f2fd; color:#1976d2; padding:6px 12px; border-radius:20px; text-decoration:none; font-size:0.85rem; font-weight:bold;">عرض المتجر ↗</a>
        </div>

        <!-- قسم إدارة الفئات -->
        <div class="card-box">
            <h3 id="cat-panel-title" style="margin-bottom: 12px; font-size: 1rem;">📁 إدارة فئات المتجر</h3>
            <input type="hidden" id="cat-id">
            <div class="form-group">
                <label>اسم الفئة (مثل: خضار وفواكه، ألبان وأجبان...)</label>
                <input type="text" id="cat-name" placeholder="اكتب اسم الفئة هنا">
            </div>
            <button class="btn-main" type="button" onclick="saveCategory()">حفظ الفئة وتحديث المتجر فوراً</button>
            
            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px;">
                <label style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; display:block;">الفئات النشطة حالياً:</label>
                <div id="categories-list-box">جاري التحميل...</div>
            </div>
        </div>

        <!-- قسم إدارة المنتجات -->
        <div class="card-box">
            <h3 id="prod-panel-title" style="margin-bottom: 12px; font-size: 1rem;">🛒 إضافة أو تعديل منتج</h3>
            <input type="hidden" id="prod-id">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="prod-title" placeholder="مثال: حليب، سكر...">
            </div>
            <div class="form-group">
                <label>السعر (₪)</label>
                <input type="number" step="0.01" id="prod-price" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>الكمية المتوفرة (المخزون)</label>
                <input type="number" id="prod-stock" placeholder="50">
            </div>
            <div class="form-group">
                <label>الوحدة</label>
                <input type="text" id="prod-unit" placeholder="حبة، كغ، لتر..." value="حبة">
            </div>
            <div class="form-group">
                <label>اختر الفئة</label>
                <select id="prod-category">
                    <option value="الكل">الكل وعروض الأسبوع</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط الصورة (URL)</label>
                <input type="text" id="prod-img" placeholder="https://...">
            </div>
            <button class="btn-main" type="button" onclick="saveProduct()">حفظ المنتج في المتجر</button>

            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px;">
                <label style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; display:block;">المنتجات الحالية:</label>
                <div id="products-list-box">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7--EMt--ZU395",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.appspot.com",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9071b76",
            measurementId: "G-F80VQ7YH77"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // مزامنة وعرض الفئات في لوحة التحكم وتعبئة القائمة المنسدلة للمنتجات
        db.collection("categories").onSnapshot((snapshot) => {
            let catHtml = '';
            let selectHtml = `<option value="الكل">الكل وعروض الأسبوع</option>`;
            
            snapshot.forEach((doc) => {
                let d = doc.data();
                catHtml += `
                    <div class="category-item">
                        <span style="font-weight:600; font-size:0.9rem;">${d.name}</span>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-edit-sm" onclick="editCategory('${doc.id}', '${d.name}')">تعديل</button>
                            <button class="btn-del-sm" onclick="deleteCategory('${doc.id}')">حذف</button>
                        </div>
                    </div>`;
                selectHtml += `<option value="${d.name}">${d.name}</option>`;
            });
            
            document.getElementById('categories-list-box').innerHTML = catHtml || '<p style="color:#888; font-size:0.85rem;">لا توجد فئات مضافة</p>';
            document.getElementById('prod-category').innerHTML = selectHtml;
        });

        // مزامنة وعرض المنتجات في لوحة التحكم
        db.collection("products").onSnapshot((snapshot) => {
            let prodHtml = '';
            snapshot.forEach((doc) => {
                let p = doc.data();
                prodHtml += `
                    <div class="product-item">
                        <div>
                            <strong style="font-size:0.9rem;">${p.title}</strong>
                            <div style="font-size:0.75rem; color:#666;">₪${p.price} | مخزون: ${p.stock} | فئة: ${p.category}</div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-edit-sm" onclick="editProduct('${doc.id}', '${p.title}', ${p.price}, ${p.stock}, '${p.unit}', '${p.category}', '${p.img || ''}')">تعديل</button>
                            <button class="btn-del-sm" onclick="deleteProduct('${doc.id}')">حذف</button>
                        </div>
                    </div>`;
            });
            document.getElementById('products-list-box').innerHTML = prodHtml || '<p style="color:#888; font-size:0.85rem;">لا توجد منتجات مضافة</p>';
        });

        function saveCategory() {
            const id = document.getElementById('cat-id').value;
            const name = document.getElementById('cat-name').value.trim();
            if (!name) { alert("الرجاء إدخال اسم الفئة!"); return; }

            let request = id ? db.collection("categories").doc(id).update({ name }) : db.collection("categories").add({ name });

            request.then(() => {
                document.getElementById('cat-id').value = '';
                document.getElementById('cat-name').value = '';
                document.getElementById('cat-panel-title').innerText = "📁 إدارة فئات المتجر";
                alert("تم حفظ الفئة بنجاح وتحديث المتجر!");
            }).catch(err => alert("خطأ: " + err.message));
        }

        function editCategory(id, name) {
            document.getElementById('cat-id').value = id;
            document.getElementById('cat-name').value = name;
            document.getElementById('cat-panel-title').innerText = "✏️ تعديل اسم الفئة";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteCategory(id) {
            if (confirm("هل أنت متأكد من حذف هذه الفئة؟")) {
                db.collection("categories").doc(id).delete();
            }
        }

        function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const title = document.getElementById('prod-title').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const stock = parseInt(document.getElementById('prod-stock').value) || 0;
            const unit = document.getElementById('prod-unit').value.trim() || 'حبة';
            const category = document.getElementById('prod-category').value;
            const img = document.getElementById('prod-img').value.trim();

            if (!title) { alert("الرجاء إدخال اسم المنتج!"); return; }

            const prodData = { title, price, stock, unit, category, img };

            let request = id ? db.collection("products").doc(id).update(prodData) : db.collection("products").add(prodData);

            request.then(() => {
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-title').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-stock').value = '';
                document.getElementById('prod-img').value = '';
                document.getElementById('prod-panel-title').innerText = "🛒 إضافة أو تعديل منتج";
                alert("تم حفظ المنتج بنجاح!");
            }).catch(err => alert("خطأ: " + err.message));
        }

        function editProduct(id, title, price, stock, unit, category, img) {
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-title').value = title;
            document.getElementById('prod-price').value = price;
            document.getElementById('prod-stock').value = stock;
            document.getElementById('prod-unit').value = unit;
            document.getElementById('prod-category').value = category;
            document.getElementById('prod-img').value = img;
            document.getElementById('prod-panel-title').innerText = "✏️ تعديل بيانات المنتج";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                db.collection("products").doc(id).delete();
            }
        }
    </script>
</body>
</html>
