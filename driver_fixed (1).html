<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة السائق - العروبة أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --accent-green: #68a633;
            --light-bg: #f3f4f6;
            --shadow-card: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: #1f2937; padding: 12px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 15px; border: 1px solid #e5e7eb; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 0.95rem; color: var(--primary-green); font-weight: 900; }
        .back-btn { background: #e5e7eb; color: #374151; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid #cbd5e1; }
        
        .order-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 0.75rem; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: var(--primary-green); border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 8px; }
        
        .btn-call { background: #2563eb; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; }
        .btn-location { background: #059669; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; margin-inline-start: 6px; }
        .btn-complete { background: #16a34a; color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-complete.btn-pickup { background: #f59e0b; }
        .status-badge { font-size: 0.62rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-inline-start: 6px; }
        .status-badge.status-ready { background: #fef3c7; color: #92400e; }
        .status-badge.status-onway { background: #dbeafe; color: #1e40af; }
        .delay-notice { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; padding: 6px; border-radius: 6px; font-size: 0.65rem; margin-top: 6px; font-weight: bold; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, where, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.query = query;
        window.where = where;
        window.increment = increment;
        window.setDoc = setDoc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏍️ شاشة السائق - العروبة أونلاين</h1>
        <a href="admin.html" class="back-btn">← لوحة التحكم</a>
    </div>

    <div style="font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; color: #4b5563;">
        الطلبات الجاهزة للتوصيل:
    </div>

    <div id="driverOrdersContainer">
        <p style="text-align: center; color: #888; font-size: 0.75rem;">جاري تحميل الطلبات...</p>
    </div>
</div>

<script>
    let currentOrdersList = [];

    window.addEventListener('firebase-ready', function() {
        initDriverOrdersListener();
    });

    function initDriverOrdersListener() {
        // نجيب فقط الطلبات الجاهزة للتوصيل/قيد التوصيل من قاعدة البيانات مباشرة
        // بدل ما نحمّل كل تاريخ الطلبات كل مرة (هذا كان يبطّئ الشاشة مع تراكم الطلبات)
        const activeQuery = window.query(
            window.collection(window.db, "orders"),
            window.where("status", "in", ["جاهز للتوصيل", "قيد التوصيل"])
        );
        window.onSnapshot(activeQuery, (snapshot) => {
            let orders = [];
            snapshot.forEach(docSnap => {
                orders.push({ id: docSnap.id, ...docSnap.data() });
            });
            currentOrdersList = orders;
            renderDriverOrders(orders);
        });
    }

    function renderDriverOrders(orders) {
        const container = document.getElementById('driverOrdersContainer');
        if(!container) return;
        
        let deliveryOrders = orders.filter(o => o.status === "جاهز للتوصيل" || o.status === "قيد التوصيل");

        if(deliveryOrders.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.75rem; padding: 20px;">لا توجد طلبات جاهزة للتوصيل حالياً 🛵</p>';
            return;
        }

        container.innerHTML = '';
        deliveryOrders.forEach((ord, index) => {
            let delayHtml = '';
            if(ord.delayReason) {
                delayHtml = `<div class="delay-notice">⚠️ سبب التأخير المسجل: ${ord.delayReason}</div>`;
            }
            let orderLabel = (ord.orderNumber !== undefined && ord.orderNumber !== null && ord.orderNumber !== '') ? `#${ord.orderNumber}` : `#${index + 1}`;

            let currentStatus = ord.status || 'جاهز للتوصيل';
            let isPickedUp = currentStatus === 'قيد التوصيل';

            let statusBadgeHtml = isPickedUp
                ? `<span class="status-badge status-onway">🛵 بالطريق</span>`
                : `<span class="status-badge status-ready">🔒 جاهزة بالمتجر</span>`;

            if (!isPickedUp) {
                // بطاقة مقفولة: بس رقم الطلبية والاسم، لحد ما السائق يستلمها فعليًا
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>طلب ${orderLabel} - ${ord.customerName || 'زبون'} ${statusBadgeHtml}</span>
                            <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                        </div>
                        <div style="font-size: 0.68rem; color: #94a3b8; margin-bottom: 6px;">باقي التفاصيل (الهاتف، العنوان، الموقع) بتفتح بعد ما تستلم الطلبية</div>
                        <button class="btn-complete btn-pickup" onclick="markOrderPickedUp('${ord.id}')">📦 استلام الطلبية من المتجر</button>
                    </div>
                `;
            } else {
                // بطاقة مفتوحة بكل التفاصيل بعد الاستلام
                let hasLocation = ord.customerGps && ord.customerGps !== 'غير متوفر';
                let locationHtml = hasLocation
                    ? `<a href="${ord.customerGps}" target="_blank" rel="noopener" class="btn-location">📍 فتح الموقع والتوجه للطلبية</a>`
                    : `<div style="font-size: 0.68rem; color: #94a3b8; margin: 4px 0;">📍 الزبون ما حدد موقعه على الخريطة</div>`;

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>طلب ${orderLabel} - ${ord.customerName || 'زبون'} ${statusBadgeHtml}</span>
                            <span style="color: #16a34a;">${ord.total || 0} ₪</span>
                        </div>
                        <div style="font-size: 0.7rem; margin-bottom: 4px;"><b>الهاتف:</b> ${ord.customerPhone || ''}</div>
                        <div style="font-size: 0.7rem; margin-bottom: 6px;"><b>العنوان:</b> ${ord.customerAddress || ord.address || ''}</div>
                        
                        <a href="tel:${ord.customerPhone || ''}" class="btn-call">📞 اتصال بالزبون</a>
                        ${locationHtml}
                        
                        ${delayHtml}

                        <button class="btn-complete" onclick="markOrderDelivered('${ord.id}')">تأكيد تسليم الطلب (مكتمل) ✅</button>
                    </div>
                `;
            }
        });
    }

    async function markOrderPickedUp(orderId) {
        if(confirm("هل استلمت الطلبية من المتجر وبدأت التوصيل؟")) {
            try {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "قيد التوصيل"
                });
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }

    async function markOrderDelivered(orderId) {
        if(confirm("هل أنت متأكد من تسليم الطلب بنجاح وانتقاله للأرشيف؟")) {
            try {
                let ord = currentOrdersList.find(o => o.id === orderId);
                let orderTotal = ord ? (Number(ord.total) || 0) : 0;

                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    status: "مكتمل"
                });

                // نحدّث إجمالي المبيعات المجمّع فورًا بدل ما تضطر لوحة التحكم تعيد جمع كل الطلبات من الصفر
                await window.setDoc(window.doc(window.db, "settings", "salesStats"), {
                    totalRevenue: window.increment(orderTotal),
                    completedCount: window.increment(1)
                }, { merge: true });
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء تحديث حالة الطلب.");
            }
        }
    }
</script>
</body>
</html>
