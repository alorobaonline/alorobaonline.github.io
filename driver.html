<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة السائق - توصيل الطلبات</title>
    <!-- مكتبة الخطوط وأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .order-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid #3498db;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .order-id {
            font-weight: bold;
            color: #2c3e50;
        }
        .order-details p {
            margin: 8px 0;
            font-size: 15px;
        }
        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .map-btn:hover {
            background-color: #c0392b;
        }
        .deliver-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            width: 100%;
            transition: background 0.3s;
        }
        .deliver-btn:hover {
            background-color: #219653;
        }
        .no-orders {
            text-align: center;
            color: #7f8c8d;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-motorcycle"></i> لوحة السائق - الطلبات الجاهزة</h1>
        <div id="driver-orders-list">
            <!-- سيتم تعبئة الطلبات هنا تلقائياً -->
        </div>
    </div>

    <!-- Firebase SDK (تأكد من توافق الإصدار مع بقية ملفات مشروعك) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // إعدادات اتصال Firebase (استبدل القيم بما يعادلها في مشروعك)
        const firebaseConfig = {
            databaseURL: "YOUR_FIREBASE_DATABASE_URL"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // جلب الطلبات التي حالتها ready (جاهزة للتوصيل)
        const ordersRef = database.ref('orders');
        ordersRef.on('value', (snapshot) => {
            const listContainer = document.getElementById('driver-orders-list');
            listContainer.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                listContainer.innerHTML = '<div class="no-orders">لا توجد طلبات جاهزة للتوصيل حالياً</div>';
                return;
            }

            let hasReadyOrders = false;

            Object.keys(data).forEach((key) => {
                const order = data[key];
                
                // عرض الطلبات التي تم الانتهاء من تحضيرها فقط
                if (order.status === 'ready') {
                    hasReadyOrders = true;
                    
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    
                    // تجهيز رابط خريطة جوجل بناءً على عنوان أو إحداثيات العميل
                    const mapUrl = order.locationUrl || `https://maps.google.com/?q=${encodeURIComponent(order.address || '')}`;

                    card.innerHTML = `
                        <div class="order-header">
                            <span class="order-id">رقم الطلب: #${key.slice(-5)}</span>
                            <span style="color: #e67e22; font-weight: bold;">جاهز للتوصيل</span>
                        </div>
                        <div class="order-details">
                            <p><strong>اسم العميل:</strong> ${order.customerName || 'غير متوفر'}</p>
                            <p><strong>رقم الهاتق:</strong> <a href="tel:${order.customerPhone}">${order.customerPhone || 'غير متوفر'}</a></p>
                            <p><strong>العنوان:</strong> ${order.address || 'لم يتم تحديد العنوان'}</p>
                            
                            <a href="${mapUrl}" target="_blank" class="map-btn">
                                <i class="fa-solid fa-map-location-dot"></i> فتح الموقع على الخريطة
                            </a>
                        </div>
                        <button class="deliver-btn" onclick="markAsDelivered('${key}')">
                            <i class="fa-solid fa-check-circle"></i> تم التسليم للزبون
                        </button>
                    `;
                    listContainer.appendChild(card);
                }
            });

            if (!hasReadyOrders) {
                listContainer.innerHTML = '<div class="no-orders">لا توجد طلبات جاهزة للتوصيل حالياً</div>';
            }
        });

        // دالة لتغيير حالة الطلب إلى delivered (تم التسليم) لكي ينتقل للأرشيف
        function markAsDelivered(orderId) {
            if (confirm('هل أنت متأكد من تسليم الطلب للزبون؟')) {
                database.ref('orders/' + orderId).update({
                    status: 'delivered',
                    deliveredAt: new Date().toISOString()
                }).then(() => {
                    // سيختفي تلقائياً من قائمة السائق وينتقل لأرشيف لوحة التحكم
                }).catch((error) => {
                    alert('حدث خطأ أثناء تحديث الحالة: ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
