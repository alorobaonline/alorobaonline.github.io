<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الحزمة - العروبة اون لاين</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #1b4d2e;
            --primary-green-dark: #123821;
            --accent-green: #68a633;
            --accent-green-light: #eef6e6;
        }
        * { font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(180deg, #f0f5f1 0%, #f3f4f6 260px);
            min-height: 100vh;
        }

        .brand-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
        }

        .bundle-card {
            transition: box-shadow .2s ease, transform .2s ease;
        }
        .bundle-card:hover {
            box-shadow: 0 6px 18px rgba(27, 77, 46, 0.1);
            transform: translateY(-1px);
        }
        .bundle-card.is-inactive { opacity: 0.6; }

        .icon-btn {
            transition: transform .15s ease, background-color .15s ease;
        }
        .icon-btn:active { transform: scale(0.92); }

        .cta-btn {
            transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
            box-shadow: 0 4px 14px rgba(27, 77, 46, 0.28);
        }
        .cta-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(27, 77, 46, 0.35); }
        .cta-btn:active { transform: translateY(0); }

        .toast-item { animation: toast-in .25s ease-out; }
        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-item.toast-out { animation: toast-out .25s ease-in forwards; }
        @keyframes toast-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-8px); }
        }

        @keyframes spin-slow { to { transform: rotate(360deg); } }
        .spin-slow { animation: spin-slow 1.4s linear infinite; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="font-sans p-3 sm:p-6 flex justify-center">

    <!-- حاوية إشعارات Toast -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[92%] max-w-sm space-y-2"></div>

    <div class="w-full max-w-xl space-y-4">

        <!-- Header -->
        <div class="brand-header rounded-2xl p-5 text-white shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl">🎉</div>
                    <div>
                        <h1 class="text-base sm:text-lg font-black">عروض الحزمة</h1>
                        <p class="text-[11px] text-white/70 font-bold">العروبة أونلاين</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="active-count" class="bg-white/15 backdrop-blur text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                    <i class="fa-solid fa-circle text-[6px] text-[var(--accent-green)]"></i> 0 نشطة
                </span>
                <span id="inactive-count" class="bg-white/10 text-white/70 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                    <i class="fa-solid fa-circle text-[6px] text-white/40"></i> 0 معطّلة
                </span>
            </div>
        </div>

        <!-- Description Box -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex items-start gap-3">
            <div class="w-9 h-9 rounded-lg bg-[var(--accent-green-light)] flex items-center justify-center text-[var(--primary-green)] flex-shrink-0 mt-0.5">
                <i class="fa-solid fa-lightbulb text-sm"></i>
            </div>
            <div>
                <h2 class="font-bold text-gray-900 text-sm mb-1">عروض الحزمة (X بـ Y ₪)</h2>
                <p class="text-gray-500 text-xs leading-relaxed">
                    الزبون يختار بنفسه النكهات من المنتجات المشاركة، والسعر يتحدث تلقائياً عند بلوغ الكمية.
                </p>
            </div>
        </div>

        <!-- Bundle List Container -->
        <div id="bundles-list" class="space-y-2.5">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm py-10 flex flex-col items-center gap-3">
                <i class="fa-solid fa-spinner spin-slow text-2xl text-[var(--primary-green)]"></i>
                <span class="text-gray-500 text-sm font-bold">جاري تحميل عروض الحزم والمنتجات...</span>
            </div>
        </div>

        <!-- Add Button -->
        <button onclick="openAddModal()" class="cta-btn w-full py-4 bg-[var(--primary-green)] text-white font-bold text-sm rounded-2xl hover:bg-[var(--primary-green-dark)] flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-circle-plus"></i> عرض حزمة جديد
        </button>

    </div>

    <!-- Modal لإضافة/تعديل حزمة -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-lg w-full p-0 border border-gray-100 max-h-[92vh] overflow-hidden flex flex-col shadow-2xl">

            <div class="brand-header p-4 flex items-center justify-between text-white flex-shrink-0">
                <h3 id="modal-title" class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-gift"></i>
                    <span>إضافة عرض حزمة جديد</span>
                </h3>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 flex items-center justify-center transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="p-5 space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">اسم الحزمة (مثال: 4- مسليات)</label>
                    <input type="text" id="bundle-name" oninput="updatePreview()" class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]/40 focus:border-[var(--primary-green)] transition" placeholder="أدخل اسم الحزمة">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">السعر الإجمالي (₪)</label>
                        <input type="text" id="bundle-price" oninput="updatePreview()" class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]/40 focus:border-[var(--primary-green)] transition" placeholder="14.90">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">الكمية المطلوبة</label>
                        <input type="number" id="bundle-qty" oninput="updatePreview()" class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]/40 focus:border-[var(--primary-green)] transition" placeholder="4">
                    </div>
                </div>

                <!-- معاينة حية للشارة -->
                <div class="flex items-center gap-2.5 bg-[var(--accent-green-light)] border border-[var(--accent-green)]/20 rounded-xl p-3">
                    <i class="fa-solid fa-eye text-[var(--primary-green)] text-xs"></i>
                    <span class="text-xs text-[var(--primary-green)] font-bold">معاينة الشارة بالمتجر:</span>
                    <span id="badge-preview" class="text-xs bg-red-600 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm">4 بـ 0.00 ₪</span>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-gray-700">اختر المنتجات المشاركة من متجرك:</label>
                        <span id="selected-counter" class="text-xs font-bold text-white bg-[var(--primary-green)] px-2 py-0.5 rounded-md">0 محدد</span>
                    </div>

                    <div class="relative mb-2">
                        <i class="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 right-3.5 text-gray-400 text-xs"></i>
                        <input type="text" id="product-search" oninput="filterStoreProducts()" class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-xl pr-9 pl-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]/40 focus:border-[var(--primary-green)] transition" placeholder="ابحث عن منتج بالاسم...">
                    </div>

                    <div class="flex gap-2 mb-2">
                        <button type="button" onclick="selectAllVisible()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2 rounded-lg cursor-pointer transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-check-double text-[10px]"></i> تحديد الكل
                        </button>
                        <button type="button" onclick="clearAllSelection()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2 rounded-lg cursor-pointer transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-xmark text-[10px]"></i> إلغاء التحديد
                        </button>
                    </div>

                    <div id="store-products-container" class="border border-gray-200 rounded-xl p-2.5 max-h-48 overflow-y-auto space-y-1.5 bg-gray-50">
                        <p class="text-xs text-gray-500 p-2">جاري جلب منتجات المتجر...</p>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 p-4 border-t border-gray-100 flex-shrink-0 bg-white">
                <button id="save-btn" onclick="saveBundle()" class="cta-btn flex-1 bg-[var(--primary-green)] text-white py-3 rounded-xl font-bold text-sm hover:bg-[var(--primary-green-dark)] cursor-pointer flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ العرض
                </button>
                <button onclick="closeAddModal()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold text-sm hover:bg-gray-200 transition cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات الـ Firebase الخاصة بمتجرك
        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let storeProducts = [];
        let allBundles = [];
        let editingBundleId = null;

        // ===================== Toast =====================
        window.showToast = function(message, type) {
            type = type || 'success';
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-[var(--primary-green)]',
                error: 'bg-red-600'
            };
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';

            const toast = document.createElement('div');
            toast.className = `toast-item ${colors[type] || colors.success} text-white text-sm font-bold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 250);
            }, 2800);
        };

        // ===================== منتجات المتجر =====================
        async function fetchStoreProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                storeProducts = [];
                querySnapshot.forEach((docSnap) => {
                    storeProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProductCheckboxes();
            } catch (error) {
                console.error("خطأ في جلب المنتجات:", error);
                showToast('تعذر جلب منتجات المتجر', 'error');
            }
        }

        function renderProductCheckboxes(preSelectedNames) {
            preSelectedNames = preSelectedNames || [];
            const container = document.getElementById('store-products-container');
            container.innerHTML = '';
            if (storeProducts.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 p-2">لا توجد منتجات مسجلة في المتجر حالياً.</p>';
                return;
            }
            storeProducts.forEach(prod => {
                const prodName = prod.name || prod.title || '';
                const isChecked = preSelectedNames.includes(prodName);
                const div = document.createElement('label');
                div.className = "product-item flex items-center gap-2.5 text-xs text-gray-800 cursor-pointer bg-white hover:bg-[var(--accent-green-light)] p-2.5 rounded-lg border border-gray-200 transition";
                div.setAttribute('data-name', prodName.toLowerCase());
                div.innerHTML = `
                    <input type="checkbox" value="${prodName}" ${isChecked ? 'checked' : ''} onchange="updateSelectedCounter()" class="product-checkbox accent-[var(--primary-green)] w-4 h-4">
                    <span class="font-semibold">${prodName}</span>
                    <span class="text-gray-400 mr-auto">${prod.price || 0} ₪</span>
                `;
                container.appendChild(div);
            });
            updateSelectedCounter();
        }

        window.filterStoreProducts = function() {
            const query = document.getElementById('product-search').value.toLowerCase().trim();
            const items = document.querySelectorAll('.product-item');
            items.forEach(item => {
                const name = item.getAttribute('data-name');
                item.classList.toggle('hidden', !name.includes(query));
            });
        };

        window.selectAllVisible = function() {
            document.querySelectorAll('.product-item').forEach(item => {
                if (!item.classList.contains('hidden')) {
                    item.querySelector('.product-checkbox').checked = true;
                }
            });
            updateSelectedCounter();
        };

        window.clearAllSelection = function() {
            document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false);
            updateSelectedCounter();
        };

        window.updateSelectedCounter = function() {
            const count = document.querySelectorAll('.product-checkbox:checked').length;
            const el = document.getElementById('selected-counter');
            if (el) el.innerText = `${count} محدد`;
        };

        // ===================== معاينة حية للشارة =====================
        window.updatePreview = function() {
            const qty = document.getElementById('bundle-qty').value.trim() || '4';
            const price = document.getElementById('bundle-price').value.trim() || '0.00';
            document.getElementById('badge-preview').innerText = `${qty} بـ ${price} ₪`;
        };

        // ===================== عرض قائمة الحزم =====================
        window.loadBundles = async function() {
            const listEl = document.getElementById('bundles-list');
            try {
                const querySnapshot = await getDocs(collection(db, "bundles"));
                allBundles = [];
                querySnapshot.forEach((docSnap) => {
                    allBundles.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderBundlesList();
            } catch (error) {
                console.error("خطأ في جلب الحزم:", error);
                listEl.innerHTML = `
                    <div class="bg-white rounded-2xl border border-red-100 shadow-sm py-10 flex flex-col items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-2xl text-red-500"></i>
                        <span class="text-red-500 text-sm font-bold">حدث خطأ أثناء الاتصال بقاعدة البيانات</span>
                    </div>
                `;
            }
        };

        function findThumbnailForBundle(bundle) {
            if (bundle.selectedItems && bundle.selectedItems.length > 0) {
                for (const itemName of bundle.selectedItems) {
                    const match = storeProducts.find(p => (p.name || '') === itemName);
                    if (match && match.img) return match.img;
                }
            }
            return null;
        }

        function renderBundlesList() {
            const listEl = document.getElementById('bundles-list');
            listEl.innerHTML = '';

            let activeCount = 0;
            let inactiveCount = 0;

            allBundles.forEach((bundle) => {
                const docId = bundle.id;
                if (bundle.active) activeCount++; else inactiveCount++;

                const itemsText = bundle.selectedItems && bundle.selectedItems.length > 0 ? bundle.selectedItems.join(' • ') : 'جميع المنتجات المشاركة...';
                const thumb = findThumbnailForBundle(bundle);
                const thumbHtml = thumb
                    ? `<img src="${thumb}" class="w-12 h-12 rounded-xl object-cover border border-gray-100 flex-shrink-0" onerror="this.style.display='none'">`
                    : `<div class="w-12 h-12 rounded-xl bg-[var(--accent-green-light)] border border-gray-100 flex items-center justify-center flex-shrink-0 text-[var(--primary-green)]"><i class="fa-solid fa-gift"></i></div>`;

                const itemDiv = document.createElement('div');
                itemDiv.className = `bundle-card ${bundle.active ? '' : 'is-inactive'} flex items-center justify-between p-3 bg-white border border-gray-100 rounded-2xl shadow-sm gap-3`;

                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        ${thumbHtml}
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="font-bold text-gray-900 text-sm">${bundle.name}</span>
                                <span class="text-[11px] bg-red-600 text-white font-bold px-2 py-0.5 rounded-md whitespace-nowrap">${bundle.qty || 4} بـ ${bundle.priceText} ₪</span>
                            </div>
                            <p class="text-gray-400 text-[11px] truncate max-w-[210px]">${itemsText}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <button onclick="openEditModal('${docId}')" class="icon-btn w-9 h-9 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 cursor-pointer" title="تعديل">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteBundle('${docId}')" class="icon-btn w-9 h-9 flex items-center justify-center bg-red-50 text-red-600 rounded-xl hover:bg-red-100 cursor-pointer" title="حذف">
                            <i class="fa-regular fa-trash-can text-xs"></i>
                        </button>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" ${bundle.active ? 'checked' : ''} onchange="toggleBundle('${docId}', ${!bundle.active})" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-400 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[var(--accent-green)] relative"></div>
                        </label>
                    </div>
                `;
                listEl.appendChild(itemDiv);
            });

            if (allBundles.length === 0) {
                listEl.innerHTML = `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm py-10 flex flex-col items-center gap-2">
                        <i class="fa-solid fa-box-open text-2xl text-gray-300"></i>
                        <span class="text-gray-400 text-sm font-bold">لا توجد عروض حزم مضافة حالياً</span>
                    </div>
                `;
            }

            document.getElementById('active-count').innerHTML = `<i class="fa-solid fa-circle text-[6px] text-[var(--accent-green)]"></i> ${activeCount} نشطة`;
            document.getElementById('inactive-count').innerHTML = `<i class="fa-solid fa-circle text-[6px] text-white/40"></i> ${inactiveCount} معطّلة`;
        }

        window.toggleBundle = async function(docId, newState) {
            try {
                await updateDoc(doc(db, "bundles", docId), { active: newState });
                showToast(newState ? 'تم تفعيل العرض ✅' : 'تم تعطيل العرض');
                loadBundles();
            } catch (error) {
                console.error("خطأ في التحديث:", error);
                showToast('حدث خطأ أثناء تحديث الحالة', 'error');
            }
        };

        window.deleteBundle = async function(docId) {
            if (confirm('هل أنت متأكد من حذف هذا العرض من النظام؟')) {
                try {
                    await deleteDoc(doc(db, "bundles", docId));
                    showToast('تم حذف العرض 🗑️');
                    loadBundles();
                } catch (error) {
                    console.error("خطأ في الحذف:", error);
                    showToast('حدث خطأ أثناء الحذف', 'error');
                }
            }
        };

        window.saveBundle = async function() {
            const name = document.getElementById('bundle-name').value.trim();
            const priceText = document.getElementById('bundle-price').value.trim();
            const qty = document.getElementById('bundle-qty').value.trim();

            const selectedCheckboxes = document.querySelectorAll('.product-checkbox:checked');
            const selectedItems = Array.from(selectedCheckboxes).map(cb => cb.value);

            if (!name || !priceText) {
                showToast('يرجى تعبئة اسم الحزمة والسعر على الأقل', 'error');
                return;
            }

            try {
                if (editingBundleId) {
                    await updateDoc(doc(db, "bundles", editingBundleId), {
                        name: name,
                        priceText: priceText,
                        qty: qty || 4,
                        selectedItems: selectedItems
                    });
                    showToast('تم تحديث عرض الحزمة بنجاح ✏️');
                } else {
                    await addDoc(collection(db, "bundles"), {
                        name: name,
                        priceText: priceText,
                        qty: qty || 4,
                        selectedItems: selectedItems,
                        active: true,
                        createdAt: Date.now()
                    });
                    showToast('تم إضافة عرض الحزمة بنجاح 🎉');
                }

                closeAddModal();
                loadBundles();
            } catch (error) {
                console.error("خطأ في الحفظ:", error);
                showToast('حدث خطأ أثناء حفظ الحزمة', 'error');
            }
        };

        window.openAddModal = function() {
            editingBundleId = null;
            document.getElementById('modal-title').querySelector('span').innerText = 'إضافة عرض حزمة جديد';
            document.getElementById('save-btn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ العرض';
            document.getElementById('bundle-name').value = '';
            document.getElementById('bundle-price').value = '';
            document.getElementById('bundle-qty').value = '';
            document.getElementById('product-search').value = '';
            renderProductCheckboxes([]);
            filterStoreProducts();
            updatePreview();

            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        };

        window.openEditModal = function(docId) {
            const bundle = allBundles.find(b => b.id === docId);
            if (!bundle) return;

            editingBundleId = docId;
            document.getElementById('modal-title').querySelector('span').innerText = `تعديل: ${bundle.name}`;
            document.getElementById('save-btn').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات';
            document.getElementById('bundle-name').value = bundle.name || '';
            document.getElementById('bundle-price').value = bundle.priceText || '';
            document.getElementById('bundle-qty').value = bundle.qty || 4;
            document.getElementById('product-search').value = '';
            renderProductCheckboxes(bundle.selectedItems || []);
            filterStoreProducts();
            updatePreview();

            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
            editingBundleId = null;
        };

        fetchStoreProducts().then(loadBundles);
    </script>
</body>
</html>
