<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الحزمة - العروبة اون لاين</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans p-3 sm:p-6 flex justify-center">

    <div class="w-full max-w-xl bg-white rounded-xl border border-gray-200 p-4 sm:p-5 space-y-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-200 pb-4">
            <h1 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                <span>🎉</span> عروض الحزمة
            </h1>
            <span id="active-count" class="bg-gray-200 text-gray-800 text-xs font-bold px-3 py-1 rounded-md">
                0 نشطة
            </span>
        </div>

        <!-- Description Box -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
            <h2 class="font-bold text-gray-900 text-sm mb-1 flex items-center gap-1.5">
                <span>🎉</span> عروض الحزمة (X بـ Y ₪)
            </h2>
            <p class="text-gray-600 text-xs leading-relaxed">
                الزبون يختار بنفسه النكهات من المنتجات المشاركة، والسعر يتحدث تلقائياً عند بلوغ الكمية.
            </p>
        </div>

        <!-- Bundle List Container -->
        <div id="bundles-list" class="space-y-3">
            <div class="text-center py-6 text-gray-500 text-sm">جاري تحميل عروض الحزم والمنتجات...</div>
        </div>

        <!-- Add Button -->
        <button onclick="openAddModal()" class="w-full py-3.5 bg-emerald-600 text-white font-bold text-sm rounded-xl hover:bg-emerald-700 transition flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-plus"></i> عرض حزمة جديد
        </button>

    </div>

    <!-- Modal لإضافة حزمة جديدة -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-5 space-y-4 border border-gray-200 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-gray-900 text-lg border-b border-gray-200 pb-2">إضافة عرض حزمة جديد من المنتجات</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم الحزمة (مثال: 4- مسليات)</label>
                    <input type="text" id="bundle-name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" placeholder="أدخل اسم الحزمة">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">السعر الإجمالي للعرض (مثال: 14.90 ₪)</label>
                    <input type="text" id="bundle-price" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" placeholder="أدخل السعر الإجمالي">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">الكمية المطلوبة (مثال: 4 قطع)</label>
                    <input type="number" id="bundle-qty" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" placeholder="4">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اختر المنتجات المشاركة من متجرك:</label>
                    <div id="store-products-container" class="border border-gray-300 rounded-lg p-3 max-h-48 overflow-y-auto space-y-2 bg-gray-50">
                        <p class="text-xs text-gray-500">جاري جلب منتجات المتجر...</p>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-gray-200">
                <button onclick="saveNewBundle()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-emerald-700 transition cursor-pointer">حفظ العرض</button>
                <button onclick="closeAddModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-bold text-sm hover:bg-gray-300 transition cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات الـ Firebase الخاصة بمتجرك
        const firebaseConfig = {
            // ضع إعداداتك هنا
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let storeProducts = [];

        async function fetchStoreProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                storeProducts = [];
                querySnapshot.forEach((docSnap) => {
                    storeProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProductCheckboxes();
            } catch (error) {
                console.error("خطأ في جلب المنتجات:", error);
            }
        }

        function renderProductCheckboxes() {
            const container = document.getElementById('store-products-container');
            container.innerHTML = '';
            if (storeProducts.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500">لا توجد منتجات مسجلة في المتجر حالياً.</p>';
                return;
            }
            storeProducts.forEach(prod => {
                const div = document.createElement('label');
                div.className = "flex items-center gap-2 text-xs text-gray-800 cursor-pointer bg-white p-2 rounded border border-gray-200";
                div.innerHTML = `
                    <input type="checkbox" value="${prod.name || prod.title}" class="product-checkbox accent-emerald-600 w-4 h-4">
                    <span>${prod.name || prod.title} (${prod.price || 0} ₪)</span>
                `;
                container.appendChild(div);
            });
        }

        async function loadBundles() {
            const listEl = document.getElementById('bundles-list');
            try {
                const querySnapshot = await getDocs(collection(db, "bundles"));
                listEl.innerHTML = '';
                let activeCount = 0;
                let docsCount = 0;

                querySnapshot.forEach((docSnap) => {
                    docsCount++;
                    const bundle = docSnap.data();
                    const docId = docSnap.id;
                    if (bundle.active) activeCount++;

                    const itemsText = bundle.selectedItems && bundle.selectedItems.length > 0 ? bundle.selectedItems.join(' • ') : 'جميع المنتجات المشاركة...';

                    const itemDiv = document.createElement('div');
                    itemDiv.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between p-3.5 bg-white border border-gray-200 rounded-lg gap-3";
                    
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-start">
                            <div class="flex items-center gap-2">
                                <button onclick="deleteBundle('${docId}')" class="w-8 h-8 flex items-center justify-center bg-red-100 text-red-700 rounded-md hover:bg-red-200 transition cursor-pointer" title="حذف">
                                    <i class="fa-regular fa-trash-can text-xs"></i>
                                </button>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${bundle.active ? 'checked' : ''} onchange="toggleBundle('${docId}', ${!bundle.active})" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-md peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-400 after:border after:rounded-md after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                            </label>
                        </div>

                        <div class="text-right sm:text-left w-full sm:w-auto">
                            <div class="flex items-center gap-2 justify-start sm:justify-end mb-1 flex-wrap-reverse">
                                <span class="font-bold text-gray-900 text-sm">${bundle.name}</span>
                                <span class="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded">${bundle.qty || 4} بـ ${bundle.priceText} ₪</span>
                            </div>
                            <p class="text-gray-500 text-xs truncate max-w-full sm:max-w-xs">${itemsText}</p>
                        </div>
                    `;
                    listEl.appendChild(itemDiv);
                });

                if (docsCount === 0) {
                    listEl.innerHTML = '<p class="text-center py-6 text-gray-500 text-sm">لا توجد عروض حزم مضافة حالياً.</p>';
                }

                document.getElementById('active-count').innerText = `${activeCount} نشطة`;
            } catch (error) {
                console.error("خطأ في جلب الحزم:", error);
                listEl.innerHTML = '<p class="text-center py-6 text-red-500 text-sm">حدث خطأ أثناء الاتصال بقاعدة البيانات.</p>';
            }
        }

        window.toggleBundle = async function(docId, newState) {
            try {
                await updateDoc(doc(db, "bundles", docId), { active: newState });
                loadBundles();
            } catch (error) {
                console.error("خطأ في التحديث:", error);
            }
        };

        window.deleteBundle = async function(docId) {
            if (confirm('هل أنت متأكد من حذف هذا العرض من النظام؟')) {
                try {
                    await deleteDoc(doc(db, "bundles", docId));
                    loadBundles();
                } catch (error) {
                    console.error("خطأ في الحذف:", error);
                }
            }
        };

        window.saveNewBundle = async function() {
            const name = document.getElementById('bundle-name').value.trim();
            const priceText = document.getElementById('bundle-price').value.trim();
            const qty = document.getElementById('bundle-qty').value.trim();
            
            const selectedCheckboxes = document.querySelectorAll('.product-checkbox:checked');
            const selectedItems = Array.from(selectedCheckboxes).map(cb => cb.value);

            if (!name || !priceText) {
                alert('يرجى تعبئة اسم الحزمة والسعر على الأقل');
                return;
            }

            try {
                await addDoc(collection(db, "bundles"), {
                    name: name,
                    priceText: priceText,
                    qty: qty || 4,
                    selectedItems: selectedItems,
                    active: true,
                    createdAt: Date.now()
                });

                closeAddModal();
                loadBundles();
            } catch (error) {
                console.error("خطأ في الحفظ:", error);
                alert('حدث خطأ أثناء حفظ الحزمة.');
            }
        };

        window.openAddModal = function() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('bundle-name').value = '';
            document.getElementById('bundle-price').value = '';
            document.getElementById('bundle-qty').value = '';
        };

        fetchStoreProducts();
    </script>
</body>
</html>
