<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الحزمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans p-4 sm:p-6 flex justify-center">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-100 pb-4">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span>🎉</span> عروض الحزمة
            </h1>
            <span class="bg-gray-100 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">
                2 نشطة
            </span>
        </div>

        <!-- Description Box -->
        <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-100">
            <h2 class="font-bold text-gray-800 text-sm mb-1 flex items-center gap-1.5">
                <span>🎉</span> عروض الحزمة (X بـ Y ₪)
            </h2>
            <p class="text-gray-500 text-xs leading-relaxed">
                الزبون يختار بنفسه النكهات من المنتجات المشاركة، والسعر يتحدث تلقائياً عند بلوغ الكمية.
            </p>
        </div>

        <!-- Bundle List -->
        <div class="space-y-3">
            
            <!-- Item 1 -->
            <div class="flex items-center justify-between p-3.5 bg-white border border-gray-100 rounded-xl shadow-2xs hover:border-gray-200 transition">
                <div class="flex items-center gap-3">
                    <button class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                    <button class="w-9 h-9 flex items-center justify-center bg-amber-50 text-amber-500 rounded-xl hover:bg-amber-100 transition">
                        <i class="fa-solid fa-pencil text-sm"></i>
                    </button>
                    <!-- Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>

                <div class="text-left">
                    <div class="flex items-center gap-2 justify-end mb-1">
                        <span class="text-xs bg-red-500 text-white font-bold px-2.5 py-0.5 rounded-lg">4 بـ 14.90 ₪</span>
                        <span class="font-bold text-gray-800 text-sm">4- مسليات</span>
                    </div>
                    <p class="text-gray-400 text-xs truncate max-w-[200px] sm:max-w-xs">بسلي بطعم بيتزا • بسلي بربييكيو • مسلي...</p>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="flex items-center justify-between p-3.5 bg-white border border-gray-100 rounded-xl shadow-2xs hover:border-gray-200 transition">
                <div class="flex items-center gap-3">
                    <button class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                    <button class="w-9 h-9 flex items-center justify-center bg-amber-50 text-amber-500 rounded-xl hover:bg-amber-100 transition">
                        <i class="fa-solid fa-pencil text-sm"></i>
                    </button>
                    <!-- Toggle Switch -->
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>

                <div class="text-left">
                    <div class="flex items-center gap-2 justify-end mb-1">
                        <span class="text-xs bg-red-500 text-white font-bold px-2.5 py-0.5 rounded-lg">3 بـ 59.90 ₪</span>
                        <span class="font-bold text-gray-800 text-sm">3- منتجات عيليت</span>
                    </div>
                    <p class="text-gray-400 text-xs truncate max-w-[200px] sm:max-w-xs">قهوة نمص عيليت بطعم موكا 200 غرم • ...</p>
                </div>
            </div>

        </div>

        <!-- Add Button -->
        <button class="w-full py-3.5 bg-emerald-50 text-emerald-600 font-bold text-sm rounded-xl hover:bg-emerald-100 transition flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-plus"></i> عرض حزمة جديد
        </button>

    </div>

</body>
</html>
