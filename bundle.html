<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الحزمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans p-3 sm:p-6 flex justify-center">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-5 space-y-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-100 pb-4">
            <h1 class="text-lg sm:text-xl font-bold text-gray-800 flex items-center gap-2">
                <span>🎉</span> عروض الحزمة
            </h1>
            <span id="active-count" class="bg-gray-100 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">
                0 نشطة
            </span>
        </div>

        <!-- Description Box -->
        <div class="bg-gray-50/50 p-4 rounded-xl border border-gray-100">
            <h2 class="font-bold text-gray-800 text-sm mb-1 flex items-center gap-1.5">
                <span>🎉</span> عروض الحزمة (X بـ Y ₪)
            </h2>
            <p class="text-gray-500 text-xs leading-relaxed">
                الزبون يختار بنفسه النكهات من المنتجات المشاركة، والسعر يتحدث تلقائياً عند بلوغ الكمية.
            </p>
        </div>

        <!-- Bundle List Container -->
        <div id="bundles-list" class="space-y-3">
            <!-- سيتم تعبئة الحزم تلقائياً عبر JavaScript -->
        </div>

        <!-- Add Button -->
        <button onclick="openAddModal()" class="w-full py-3.5 bg-emerald-50 text-emerald-600 font-bold text-sm rounded-xl hover:bg-emerald-100 transition flex items-center justify-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-plus"></i> عرض حزمة جديد
        </button>

    </div>

    <!-- Modal لإضافة حزمة جديدة -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
            <h3 class="font-bold text-gray-800 text-lg">إضافة عرض حزمة جديد</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">اسم الحزمة (مثال: 4- مسليات)</label>
                    <input type="text" id="bundle-name" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="أدخل اسم الحزمة">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">نص السعر (مثال: 4 بـ 14.90 ₪)</label>
                    <input type="text" id="bundle-price" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="أدخل السعر والعرض">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">المنتجات المشمولة</label>
                    <input type="text" id="bundle-items" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="مثال: بسلي بيتزا • بسلي بربييكيو">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveNewBundle()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-emerald-700 transition cursor-pointer">حفظ وإضافة</button>
                <button onclick="closeAddModal()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-200 transition cursor-pointer">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // البيانات الأولية أو من الـ LocalStorage
        let bundles = JSON.parse(localStorage.getItem('my_bundles')) || [
            { id: 1, name: "4- مسليات", priceText: "4 بـ 14.90 ₪", desc: "بسلي بطعم بيتزا • بسلي بربييكيو • مسلي...", active: true },
            { id: 2, name: "3- منتجات عيليت", priceText: "3 بـ 59.90 ₪", desc: "قهوة نمص عيليت بطعم موكا 200 غرام • ...", active: true }
        ];

        function saveAndRender() {
            localStorage.setItem('my_bundles', JSON.stringify(bundles));
            renderBundles();
        }

        function renderBundles() {
            const listEl = document.getElementById('bundles-list');
            listEl.innerHTML = '';
            
            let activeCount = 0;

            bundles.forEach((bundle, index) => {
                if (bundle.active) activeCount++;

                const itemDiv = document.createElement('div');
                itemDiv.className = "flex flex-col sm:flex-row items-start sm:items-center justify-between p-3.5 bg-white border border-gray-100 rounded-xl shadow-2xs gap-3 hover:border-gray-200 transition";
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between sm:justify-start">
                        <div class="flex items-center gap-2">
                            <button onclick="deleteBundle(${index})" class="w-9 h-9 flex items-center justify-center bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition cursor-pointer" title="حذف">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                            <button onclick="editBundle(${index})" class="w-9 h-9 flex items-center justify-center bg-amber-50 text-amber-500 rounded-xl hover:bg-amber-100 transition cursor-pointer" title="تعديل">
                                <i class="fa-solid fa-pencil text-sm"></i>
                            </button>
                        </div>
                        <!-- Toggle Switch -->
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" ${bundle.active ? 'checked' : ''} onchange="toggleBundle(${index})" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                        </label>
                    </div>

                    <div class="text-right sm:text-left w-full sm:w-auto">
                        <div class="flex items-center gap-2 justify-start sm:justify-end mb-1 flex-wrap-reverse">
                            <span class="font-bold text-gray-800 text-sm">${bundle.name}</span>
                            <span class="text-xs bg-red-500 text-white font-bold px-2.5 py-0.5 rounded-lg">${bundle.priceText}</span>
                        </div>
                        <p class="text-gray-400 text-xs truncate max-w-full sm:max-w-xs">${bundle.desc}</p>
                    </div>
                `;
                listEl.appendChild(itemDiv);
            });

            document.getElementById('active-count').innerText = `${activeCount} نشطة`;
        }

        function toggleBundle(index) {
            bundles[index].active = !bundles[index].active;
            saveAndRender();
        }

        function deleteBundle(index) {
            if (confirm('هل أنت متأكد من حذف هذا العرض؟')) {
                bundles.splice(index, 1);
                saveAndRender();
            }
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('bundle-name').value = '';
            document.getElementById('bundle-price').value = '';
            document.getElementById('bundle-items').value = '';
        }

        function saveNewBundle() {
            const name = document.getElementById('bundle-name').value.trim();
            const priceText = document.getElementById('bundle-price').value.trim();
            const desc = document.getElementById('bundle-items').value.trim();

            if (!name || !priceText) {
                alert('يرجى تعبئة اسم الحزمة والسعر على الأقل');
                return;
            }

            bundles.push({
                id: Date.now(),
                name: name,
                priceText: priceText,
                desc: desc || 'منتجات مشاركة متنوعة...',
                active: true
            });

            closeAddModal();
            saveAndRender();
        }

        // التشغيل الأولي
        renderDb = renderBundles();
    </script>
</body>
</html>
