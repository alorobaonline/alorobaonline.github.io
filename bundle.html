<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الباقات - Aloroba Online</title>
    <style>
        :root {
            --primary-color: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --danger-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 1rem;
            color: var(--text-main);
        }
        .btn-back {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }
        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            background: #fff;
        }
        /* تصميم الزر التبديلي (Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .products-checklist {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            background: #fff;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.8rem;
        }
        .checkbox-item:last-child {
            border-bottom: none;
        }
        .btn-main {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .btn-main:active {
            opacity: 0.9;
        }
        #loadingMsg {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 20px;
        }
    </style>

    <!-- استدعاء Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFk8EX7-EMt--ZU3958nrMogeEdvGtaCs",
            authDomain: "alorobaonline.firebaseapp.com",
            projectId: "alorobaonline",
            storageBucket: "alorobaonline.firebasestorage.app",
            messagingSenderId: "880642361344",
            appId: "1:880642361344:web:9dddec05f81125f0fc30e5",
            measurementId: "G-NL9CS2135V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let bundleSettings = {
            enabled: true,
            targetCount: 6,
            bundlePrice: 19.90,
            productIds: []
        };

        async function initBundlePage() {
            try {
                // 1. جلب المنتجات المتاحة
                const prodSnap = await getDocs(collection(db, "products"));
                products = [];
                prodSnap.forEach(docSnap => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });

                // 2. جلب إعدادات الباقة الحالية من Firebase
                const bundleSnap = await getDoc(doc(db, "settings", "bundleOffer"));
                if(bundleSnap.exists()) {
                    bundleSettings = { ...bundleSettings, ...bundleSnap.data() };
                }

                // تعبئة الحقول بالقيم المسترجعة
                document.getElementById('toggleBundle').checked = bundleSettings.enabled !== false;
                document.getElementById('targetCount').value = bundleSettings.targetCount || 6;
                document.getElementById('bundlePrice').value = bundleSettings.bundlePrice || 19.90;

                renderProductsList();
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('loadingMsg').innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
            }
        }

        function renderProductsList() {
            const container = document.getElementById('productsListContainer');
            container.innerHTML = '';
            
            if(products.length === 0) {
                container.innerHTML = '<div style="font-size:0.75rem; color:#888; text-align:center;">لا توجد منتجات مضافة في المتجر</div>';
                return;
            }

            products.forEach(p => {
                const isChecked = bundleSettings.productIds && bundleSettings.productIds.includes(p.id) ? 'checked' : '';
                container.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" name="prodCheck" value="${p.id}" ${isChecked}>
                        <span>${p.name || 'بدون اسم'} - <span style="color:var(--primary-color);">${p.price || 0} ₪</span></span>
                    </label>
                `;
            });
        }

        async function saveBundleData() {
            bundleSettings.enabled = document.getElementById('toggleBundle').checked;
            bundleSettings.targetCount = parseInt(document.getElementById('targetCount').value) || 6;
            bundleSettings.bundlePrice = parseFloat(document.getElementById('bundlePrice').value) || 19.90;

            let selectedIds = [];
            document.querySelectorAll('input[name="prodCheck"]:checked').forEach(cb => {
                selectedIds.push(cb.value);
            });
            bundleSettings.productIds = selectedIds;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "جاري الحفظ...";
            saveBtn.disabled = true;

            try {
                await setDoc(doc(db, "settings", "bundleOffer"), bundleSettings);
                alert("تم حفظ وتحديث إعدادات عروض الباقات بنجاح! 🚀");
            } catch (error) {
                console.error(error);
                alert("فشل حفظ البيانات، يرجى المحاولة مرة أخرى.");
            } finally {
                saveBtn.innerText = "حفظ الإعدادات 💾";
                saveBtn.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', initBundlePage);
        window.saveBundleData = saveBundleData;
    </script>
</head>
<body>

    <header>
        <h1>شاشة إدارة عروض الباقات (Mix & Match)</h1>
        <a href="admin.html" class="btn-back">لوحة التحكم 🔙</a>
    </header>

    <div id="loadingMsg">جاري تحميل البيانات من النظام...</div>

    <div id="mainContent" style="display: none;">
        <div class="section-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <label style="font-size: 0.8rem; font-weight: 700;">تفعيل ميزة عروض الباقات في المتجر</label>
                <label class="switch">
                    <input type="checkbox" id="toggleBundle">
                    <span class="slider"></span>
                </label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-group">
                    <label>عدد القطع المطلوبة للباقة</label>
                    <input type="number" id="targetCount" class="form-control" value="6">
                </div>
                <div class="form-group">
                    <label>السعر الإجمالي للباقة (₪)</label>
                    <input type="number" step="0.01" id="bundlePrice" class="form-control" value="19.90">
                </div>
            </div>

            <div class="form-group">
                <label>حدد المنتجات المشمولة في الباقة:</label>
                <div class="products-checklist" id="productsListContainer">
                    <!-- يتم جلب المنتجات هنا برمجياً -->
                </div>
            </div>

            <button id="saveBtn" class="btn-main" onclick="saveBundleData()">حفظ الإعدادات 💾</button>
        </div>
    </div>

</body>
</html>
