<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل تطبيق العروبة أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
        background: linear-gradient(135deg, #6BA516 0%, #4e8010 100%);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        text-align: center; color: white; padding: 24px;
    }
    .box { max-width: 360px; }
    .logo { font-size: 3rem; margin-bottom: 10px; }
    h1 { font-size: 1.3rem; font-weight: 900; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.92; margin-bottom: 22px; }
    .spinner {
        width: 34px; height: 34px; border: 4px solid rgba(255,255,255,0.35);
        border-top-color: white; border-radius: 50%; margin: 0 auto 20px;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manual-links { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .manual-links a {
        display: block; background: white; color: #4e8010; text-decoration: none;
        font-weight: 800; font-size: 0.9rem; padding: 12px; border-radius: 12px;
    }
</style>
</head>
<body>
<div class="box">
    <div class="logo">🛒</div>
    <h1>العروبة أونلاين</h1>
    <div class="spinner"></div>
    <p>عم نوديك على المتجر المناسب لجهازك...</p>

    <div class="manual-links">
        <a href="https://play.google.com/store/apps/details?id=market.alaoroba.app">🟢 تحميل لأندرويد (Google Play)</a>
        <a href="https://apps.apple.com/il/app/%D8%A7%D9%84%D8%B9%D8%B1%D9%88%D8%A8%D9%87-%D8%A7%D9%88%D9%86-%D9%84%D8%A7%D9%8A%D9%86/id6759161478">⚫ تحميل لآيفون (App Store)</a>
    </div>
</div>

<script>
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var androidUrl = 'https://play.google.com/store/apps/details?id=market.alaoroba.app';
    var iosUrl = 'https://apps.apple.com/il/app/%D8%A7%D9%84%D8%B9%D8%B1%D9%88%D8%A8%D9%87-%D8%A7%D9%88%D9%86-%D9%84%D8%A7%D9%8A%D9%86/id6759161478';

    // فحص نوع الجهاز من بصمة المتصفح (User Agent) وتحويل تلقائي فوري
    if (/android/i.test(ua)) {
        window.location.replace(androidUrl);
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace(iosUrl);
    }
    // لو الجهاز مش آيفون ولا أندرويد (مثلاً كمبيوتر)، بيضل واقف بالصفحة ويشوف الرابطين يدوياً
</script>
</body>
</html>
